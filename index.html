<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElemenTrick ─ 試遊版 Ver3</title>
<style>
/* ══════════════════════════════════════════════
   素材：藍の羅紗・胡桃の縁・生成りの札
   光：正＝真鍮 / 逆＝青磁 が卓に落ちる
   ══════════════════════════════════════════════ */
:root{
  --anim-scale:1;
  --felt:#243447;
  --felt-deep:#1B2836;
  --rail:#4A3828;
  --rail-hi:#6B5136;
  --room:#141B24;

  --ivory:#F4EDDE;
  --ivory-dim:#E4DAC6;
  --card-ink:#2B2620;

  --brass:#C9A227;
  --verdigris:#CDD4DD;      /* 反理力＝銀 */

  --p0:#F2D64B;  /* A 黄     */
  --p1:#A578F0;  /* B 紫     */
  --p2:#3BC9E8;  /* C 水色   */
  --p3:#F0559B;  /* D 桃     */

  --s0:#0088D2;  /* 水 Aqua  （製品版の色） */
  --s1:#E50012;  /* 火 Fire  */
  --s2:#FBC400;  /* 地 Earth */
  --s3:#00913A;  /* 風 Wind  */
  /* カード地色（各元素色を黒に沈めたもの） */
  --s0d:#0B2638; --s1d:#3A0D10; --s2d:#3A2E08; --s3d:#0A2615;

  /* ── 明地パネル（読む場所）── 卓との明暗差を情報の階層に使う */
  --pane:#EFE9DC;           /* パネル地 */
  --pane-alt:#E3DBC9;       /* 交互行・ヘッダ */
  --pane-ink:#26221C;       /* パネル上の文字 */
  --pane-sub:#6B6357;       /* パネル上の弱い文字 */
  --pane-line:#C3B9A4;      /* パネル上の罫線 */

  --ink:#EAE6DC;
  --muted:#9AA5B1;
  --dim:#5F6B78;
  --warn:#D9924A;

  --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--room);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}

.wrap{max-width:1560px;margin:0 auto;padding:8px 16px 14px;
  display:flex;flex-direction:column;
  /* 高さを確定させないと内側が縮めない。下限より低い画面ではページ側がスクロールする */
  height:100vh;min-height:840px}
/* 卓が余白を吸収するようにして、低い画面でも収まり高い画面でも間延びさせない */
.layout{display:grid;grid-template-columns:1fr 330px;grid-template-rows:minmax(0,1fr);
  gap:14px;align-items:stretch;flex:1 1 auto;min-height:0}
.colL{min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0}
.colR{min-width:0;display:flex;flex-direction:column;gap:8px;align-self:start}
/* 卓は中身が収まる高さより縮めない（縮めると手札がトラックに重なる）。足りない分はページがスクロールする */
.tableframe{flex:1 1 auto;min-height:530px;max-height:600px;display:flex}
.tableframe > .table{flex:1 1 auto}

/* 右カラム：行動順のプレイヤー一覧 */
.roster{display:flex;flex-direction:column;gap:6px}
.rhead{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--dim);
  text-transform:uppercase;padding:0 2px;
}
.rrow{
  border:1px solid #33455A;border-left-width:3px;border-radius:3px;
  background:var(--felt-deep);padding:6px 10px;
  display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.rrow.now{background:#2C3E52;box-shadow:0 0 0 1px var(--warn) inset}
.rrow.done{opacity:.72}
.rrow .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.rrow .tags{display:flex;gap:4px;align-items:center}
.rrow .tg{
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;border-radius:2px;
  padding:1px 5px;border:1px solid currentColor;
}
.rrow .tg.p1{color:var(--muted)}
.rrow .tg.lead{color:var(--ivory)}
.rrow .tg.turn{color:var(--warn)}
.rrow .sc{font-family:var(--mono);font-size:19px;font-weight:700;text-align:right;line-height:1}
.rrow .bid{
  font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.02em;
  border:1px solid var(--brass);color:var(--brass);border-radius:3px;padding:1px 7px;
}
.rrow .bid.done{border-color:#79C08D;color:#79C08D}
.rrow .bid.over{border-color:#E06C75;color:#E06C75}
.rrow .conds{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;min-height:20px;margin-top:2px}
.rrow .act{
  grid-column:1/-1;font-size:11.5px;color:var(--ink);line-height:1.5;
  border-top:1px solid rgba(255,255,255,.07);padding-top:4px;margin-top:3px;
}
.rrow .act em{font-style:normal;font-family:var(--mono);font-weight:700}
.rrow .act.wait{color:var(--dim)}

.phasedlg{
  position:fixed;inset:0;z-index:55;display:flex;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(10,15,22,.72);backdrop-filter:blur(3px);
  animation:pdin .18s ease;
}
@keyframes pdin{from{opacity:0}to{opacity:1}}
.phasebox{
  background:var(--felt-deep);border:1px solid var(--brass);border-radius:6px;
  padding:22px 30px 20px;max-width:640px;width:100%;text-align:center;
  box-shadow:0 12px 44px rgba(0,0,0,.7);
}
.phasebox .ph-t{
  font-family:var(--mincho);font-size:19px;letter-spacing:.12em;
  color:var(--brass);margin-bottom:9px;
}
.phasebox .ph-m{font-size:14px;line-height:1.8;color:var(--ink);margin-bottom:6px}
.phasebox .ph-m b{color:var(--ivory);font-weight:700}
.phasebox .ph-s{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:14px}
/* 手番順の並び */
.ph-order{
  display:flex;gap:6px;align-items:center;justify-content:center;
  flex-wrap:wrap;margin:14px 0 4px;
}
.ph-order{gap:5px}
.ph-order .pchip{
  font-family:var(--mono);font-size:12px;font-weight:700;
  border:1.5px solid;border-radius:3px;padding:4px 8px;white-space:nowrap;
}
.ph-order .arw{color:var(--dim);font-size:12px}
.ph-order .brk{flex-basis:100%;height:0}
.ph-round{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--brass);
  margin:11px 0 3px;
}
.ph-round .nt{color:var(--dim);letter-spacing:0;margin-left:7px;font-size:10px}
.ph-order{margin:3px 0 2px}
.ph-order .pchip .ix{
  display:inline-block;min-width:12px;margin-right:5px;
  font-size:9.5px;opacity:.65;font-weight:700;
}
.ph-order.isLead .pchip{background:rgba(201,162,39,.10)}
.ph-order.isLead .pchip:first-of-type{
  background:rgba(201,162,39,.26);box-shadow:0 0 0 1px var(--brass) inset;
}
.phasebox .btn{margin-top:16px;padding:10px 30px}
.phflow{margin:14px auto 2px;max-width:520px;text-align:left;display:none}
.phflow.on{display:block}
.phflow>summary{
  cursor:pointer;font-size:12px;color:var(--brass);
  list-style:none;padding:5px 2px;user-select:none;text-align:center;
}
.phflow>summary::-webkit-details-marker{display:none}
.phflow>summary::before{content:'▸ '}
.phflow[open]>summary::before{content:'▾ '}
.phflow-body{
  background:rgba(0,0,0,.22);border:1px solid rgba(244,237,222,.10);
  border-radius:5px;padding:10px 12px;margin-top:4px;
}
.phstep{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid rgba(244,237,222,.07)}
.phstep:last-child{border-bottom:0}
.phstep .no{
  flex:0 0 19px;height:19px;border-radius:50%;
  border:1px solid var(--brass);color:var(--brass);
  font:700 11px/17px var(--mono);text-align:center;
}
.phstep .tx{flex:1;min-width:0;font-size:12px;line-height:1.55}
.phstep .tx b{color:var(--ivory);font-size:12.5px}
.phstep .tx .wy{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.phskip{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:14px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none;
}
.phskip input{width:14px;height:14px;accent-color:var(--brass);cursor:pointer}
.phskip:hover{color:var(--ink)}
.phasebox .hintk{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-left:8px}

.startveil{
  position:fixed;inset:0;z-index:70;display:flex;
  align-items:center;justify-content:center;padding:24px 16px;overflow-y:auto;
  background:radial-gradient(ellipse 90% 70% at 50% 40%, #2B3F57 0%, #1B2836 55%, #0E141C 100%);
}
.startveil.off{display:none}
.snames{margin:14px auto 4px;max-width:460px;text-align:left}
.snames>summary{
  cursor:pointer;font-size:12px;color:var(--muted);
  list-style:none;padding:6px 2px;user-select:none;
}
.snames>summary::-webkit-details-marker{display:none}
.snames>summary::before{content:'▸ ';color:var(--brass)}
.snames[open]>summary::before{content:'▾ '}
.snames>summary:hover{color:var(--ink)}
.snamerow{display:flex;flex-direction:column;gap:6px;padding:6px 2px 2px}
.snamerow .nmline{display:flex;align-items:center;gap:8px}
.snamerow .nmtag{
  width:20px;height:20px;flex:0 0 20px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font:700 11px/1 var(--mono);color:#101720;
}
.snamerow input{
  flex:1;min-width:0;background:rgba(12,18,26,.6);
  border:1px solid var(--dim);border-radius:4px;
  color:var(--ink);font-size:13px;padding:5px 8px;
}
.snamerow input:focus{outline:none;border-color:var(--brass)}
.snamehint{font-size:11px;color:var(--dim);padding:4px 2px 0}
.startbox{
  max-width:520px;width:100%;text-align:center;
}
.stitle{
  font-family:var(--mincho);font-size:38px;letter-spacing:.14em;
  margin:0 0 4px;font-weight:600;color:var(--ivory);
}
.sprov{font-family:var(--sans);font-size:13px;color:var(--dim);letter-spacing:.06em;margin-left:8px}
.stag{
  font-size:13.5px;color:var(--brass);letter-spacing:.04em;margin:0 0 22px;line-height:1.7;
}
.snote{
  font-size:11.5px;color:var(--muted);line-height:1.75;text-align:left;
  border:1px solid #33455A;border-radius:4px;background:rgba(0,0,0,.22);
  padding:11px 15px;margin-bottom:20px;
}
.snote b{color:var(--ivory)}
.srow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.sopt{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.sopt label{font-size:10.5px;color:var(--dim);letter-spacing:.1em;font-family:var(--mono)}
.sopt select{min-width:132px}
.sbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn.big{padding:13px 40px;font-size:15px;letter-spacing:.08em}

.glossveil{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(8,12,18,.82);backdrop-filter:blur(3px);
  align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;
}
.glossveil.on{display:flex}
.helpveil{
  position:fixed;inset:0;z-index:80;display:none;
  background:rgba(8,12,18,.82);backdrop-filter:blur(3px);
  align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;
}
.helpveil.on{display:flex}
/* 宣言フェイズの自動表示：背景を暗転・ぼかしせず、下の卓と手札をそのまま操作できる */
.helpveil.soft{background:transparent;backdrop-filter:none;pointer-events:none}
.helpveil.soft .helpbox{pointer-events:auto;box-shadow:0 14px 54px rgba(0,0,0,.85)}
.helpbox{
  background:var(--felt-deep);border:1px solid var(--brass);border-radius:6px;
  max-width:760px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.7);
}
.helphead{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 20px;border-bottom:1px solid #33455A;position:sticky;top:0;
  background:var(--felt-deep);border-radius:6px 6px 0 0;z-index:2;
}
.helphead h2{margin:0;font-family:var(--mincho);font-size:18px;letter-spacing:.14em}
.helpbody{padding:16px 22px 26px;font-size:13.5px;line-height:1.8;color:var(--ink)}
.helpbody h3{
  font-size:14px;margin:22px 0 7px;padding-bottom:4px;letter-spacing:.06em;
  border-bottom:1px solid #33455A;color:var(--brass);font-weight:600;
}
.helpbody h4{font-size:13px;margin:14px 0 3px;color:var(--ivory);font-weight:600}
.helpbody p{margin:5px 0}
.helpbody ul,.helpbody ol{margin:5px 0;padding-left:1.4em}
.helpbody li{margin:3px 0}
.helpbody b{color:var(--ivory);font-weight:600}
.hnote{
  border:1px solid var(--warn);border-radius:4px;background:rgba(217,146,74,.08);
  padding:10px 14px;font-size:12.5px;line-height:1.7;color:var(--muted);margin-bottom:6px;
}
.hnote b{color:var(--warn)}
.glossveil .helpbody{padding-top:8px}
.glossveil .glcat:first-of-type{margin-top:4px}
.cardguide{
  display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center;
  border:1px solid #33455A;border-radius:4px;background:rgba(0,0,0,.2);
  padding:14px 16px;margin:8px 0 4px;
}
.cardguide .cg{display:flex;gap:8px;align-items:flex-end}
.cardguide .cgtxt{font-size:12.5px;line-height:1.7;color:var(--muted)}
.cardguide .cgtxt b{color:var(--ivory);font-weight:600}
.cardguide .cgtxt .mk{
  font-family:var(--mono);font-weight:700;color:var(--brass);
}
.chipguide{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
@media (max-width:640px){ .cardguide{grid-template-columns:1fr} }

.inlsuit{
  display:inline-block;vertical-align:-3px;margin:0 1px;
}
.inlmk{
  display:inline-block;vertical-align:0;margin:0 2px;
  background:#12161C;border:1px solid #3A4A5E;border-radius:2px;padding:1px 0;
}
.hgloss{
  border:1px solid #3A4A5E;border-radius:4px;background:rgba(255,255,255,.03);
  margin:22px 0 4px;
}
.hgloss summary{
  padding:11px 16px;cursor:pointer;font-size:13.5px;font-weight:600;
  color:var(--ivory);user-select:none;
}
.hgloss summary:hover{background:rgba(255,255,255,.04)}
.glcat{
  font-size:12px;letter-spacing:.1em;color:var(--brass);font-weight:600;
  margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid #33455A;
}
dl.gl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:baseline}
dl.gl dt{
  font-weight:600;color:var(--ivory);font-size:12.5px;white-space:nowrap;
  padding:5px 0 5px;border-top:1px solid rgba(255,255,255,.05);
}
dl.gl dd{
  margin:0;font-size:12.5px;color:var(--muted);line-height:1.7;
  padding:5px 0 5px;border-top:1px solid rgba(255,255,255,.05);
}
dl.gl dt:first-of-type,dl.gl dd:first-of-type{border-top:0}
dl.gl dd b{color:var(--ink)}
@media (max-width:640px){
  dl.gl{grid-template-columns:1fr;gap:0}
  dl.gl dd{padding-top:0;border-top:0;padding-bottom:8px}
}

.hgoal{
  border:1px solid var(--brass);border-radius:5px;
  background:rgba(201,162,39,.07);padding:13px 17px;margin:14px 0 4px;
}
.hgt{
  font-family:var(--mincho);font-size:15px;letter-spacing:.1em;color:var(--brass);
  margin-bottom:6px;font-weight:600;
}
.hgoal p{margin:6px 0}
.hgw{
  border-left:2px solid var(--warn);padding-left:10px;color:var(--muted);
}
.hgw b{color:var(--warn)}
.hgex{
  margin:10px 0 8px;border:1px solid #33455A;border-radius:4px;
  background:rgba(0,0,0,.22);padding:8px 12px;
}
.hgexr{display:flex;gap:12px;align-items:baseline;font-size:12.5px;padding:3px 0;line-height:1.6}
.hgexr .lbl{
  font-family:var(--mono);font-size:12px;color:var(--ivory);
  border:1px solid #46586E;border-radius:3px;padding:1px 8px;white-space:nowrap;flex:0 0 auto;
}
@media (max-width:640px){ .hgexr{flex-direction:column;gap:2px} }

.hbasic{
  border:1px solid #3A4A5E;border-radius:4px;background:rgba(255,255,255,.03);
  margin:14px 0 4px;
}
.hbasic summary{
  padding:11px 16px;cursor:pointer;font-size:13.5px;font-weight:600;
  color:var(--ivory);user-select:none;
}
.hbasic summary:hover{background:rgba(255,255,255,.04)}
.hin{padding:2px 18px 16px;border-top:1px solid #33455A}
.hin .ex{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  background:rgba(0,0,0,.25);border-radius:3px;padding:6px 10px;margin:6px 0;
}
.hin .hend{
  margin-top:14px;padding-top:10px;border-top:1px solid #33455A;color:var(--muted);
}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.hcell{border:1px solid #33455A;border-radius:4px;padding:10px 13px;background:rgba(0,0,0,.18)}
.hct{font-weight:700;color:var(--brass);margin-bottom:4px;font-size:13px}
.hsub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.65}
.hnb{font-size:12.5px;color:var(--muted);margin-top:6px}
.hflow li{margin:5px 0}
.hui li{font-size:13px}
@media (max-width:640px){ .hgrid{grid-template-columns:1fr} }

.narrowwarn{
  display:none;
  border:1px solid var(--warn);border-radius:3px;
  background:rgba(217,146,74,.10);color:var(--warn);
  font-size:11.5px;line-height:1.5;padding:7px 11px;margin-bottom:8px;
}
@media (max-width:1180px){ .narrowwarn{display:block} }

.roundsnote{
  font-family:var(--sans);font-size:11px;color:var(--muted);
  padding:0 2px 6px;line-height:1.5;
}
/* 宣言の総和：卓上に重ねると席プレートと衝突するため、卓の外の帯に出す */
.sumbar{
  display:none;align-items:baseline;gap:10px;flex-wrap:wrap;
  font-family:var(--mono);line-height:1.4;margin:0 0 8px;
  border-left:3px solid var(--brass);background:rgba(201,162,39,.07);
  padding:5px 12px;border-radius:0 3px 3px 0;
}
.sumbar.on{display:flex}
.sumbar .lb{color:var(--muted);font-size:10px;letter-spacing:.08em;white-space:nowrap}
.sumbar .vl{font-size:19px;font-weight:700;color:var(--ivory);line-height:1}
.sumbar .of{font-size:12px;color:var(--muted)}
.sumbar .df{font-size:12.5px;font-weight:700;white-space:nowrap}
.sumbar .df.under{color:#79C08D}
.sumbar .df.over{color:#E06C75}
.sumbar .df.even{color:var(--ivory)}
.sumbar .exp{font-family:var(--sans);font-size:11.5px;color:var(--muted);flex:1 1 240px;min-width:0}
.sumbar .exp b{color:var(--ivory)}
.prov{
  font-family:var(--sans);font-size:11px;color:var(--dim);
  letter-spacing:.06em;align-self:center;
}
.dealtag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);
  border:1px solid #33455A;border-radius:3px;padding:5px 10px;background:var(--felt-deep);
}
.dealtag b{color:var(--ivory);font-weight:700}

/* ── 見出し ── */
.masthead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:7px}
.masthead h1{
  margin:0;font-family:var(--mincho);font-weight:600;
  font-size:17px;letter-spacing:.22em;
}
.masthead .ver{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em}
.masthead .spacer{flex:1}
.modelab{font-size:11px;color:var(--muted)}
.sel-mode{
  background:var(--felt-deep);color:var(--ink);border:1px solid #3A4A5E;
  border-radius:3px;padding:5px 8px;font-size:12px;font-family:inherit;
}
.btn{
  border:1px solid #3A4A5E;background:var(--felt-deep);border-radius:3px;
  padding:7px 14px;font-size:12.5px;transition:border-color .15s,background .15s;
}
.btn:hover{border-color:var(--ivory);background:#2C3E52}
.btn.primary{border-color:var(--brass)}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ── トラック（欄干） ── */
.rail-t{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--dim);
  text-transform:uppercase;margin:0 0 4px;
}
.board{
  display:grid;grid-template-columns:64px repeat(var(--ntrick,15),1fr);
  gap:1px;font-family:var(--mono);
  background:var(--pane);border:1px solid var(--pane-line);border-radius:3px;
  padding:3px;
}
/* 行ラベル（左端） */
.bl{
  display:flex;align-items:center;gap:5px;padding:0 6px;
  font-size:11px;color:var(--pane-sub);white-space:nowrap;overflow:hidden;
  border-right:1px solid var(--pane-line);
}
.bl.plr{border-left:3px solid transparent;border-radius:2px 0 0 2px}
.bl .who{font-weight:700;font-size:11.5px;letter-spacing:.02em;color:var(--pane-ink)}
/* ビッドタイル */
.bidtile{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:20px;border-radius:3px;
  border:1.5px solid var(--brass);color:var(--brass);
  font-size:13px;font-weight:700;line-height:1;flex:0 0 auto;
}
.bidtile.none{border-color:#3A4A5E;color:var(--dim);font-size:11px}
.bidtile.done{border-color:#79C08D;color:#79C08D;background:rgba(121,192,138,.14)}
.bidtile.over{border-color:#E06C75;color:#E06C75;background:rgba(224,108,117,.12)}

/* 布石スロット */
.track{display:contents}
/* プレイヤー行のマス */
.tk{
  border:1px solid var(--pane-line);border-radius:2px;
  background:#F7F3E9;min-height:23px;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s;
}
.tk.past{background:var(--pane-alt);opacity:.75}
.tk.now{border-color:#8A6D12;border-width:2px;background:#FFF6D8}
/* 獲得マーカー（10mm角ガラスタイル相当） */
.mk{
  width:17px;height:17px;border-radius:2px;
  box-shadow:0 1px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35);
  animation:mkin .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes mkin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.slot{
  border:1px solid var(--pane-line);border-radius:2px;background:#F7F3E9;
  min-height:44px;padding:2px;display:flex;flex-direction:column;gap:2px;
  transition:border-color .2s,opacity .2s;position:relative;
}
.slot .no{font-family:var(--mono);font-size:11px;color:var(--pane-sub);text-align:center;line-height:1.25;font-weight:600}
.slot.past{background:var(--pane-alt);opacity:.7}
.slot.now{border-color:#8A6D12;border-width:2px;background:#FFF6D8}
.slot.pick{cursor:pointer;border-color:#B4721E;background:#FBEFD6;
  animation:slotwait 1.5s ease-in-out infinite}
.slot.pick:hover{background:#F6E3B8;animation:none}
@keyframes slotwait{
  0%,100%{box-shadow:0 0 0 0 rgba(180,114,30,0)}
  50%{box-shadow:0 0 0 2px rgba(180,114,30,.45)}
}
.slot.blocked{opacity:.3;cursor:not-allowed}
.chipline{
  font-family:var(--mono);font-size:11px;line-height:1.45;border-radius:3px;
  border:1px solid;padding:2px 3px;text-align:center;letter-spacing:.02em;
  background:#FFFDF7;font-weight:600;
}
.chipline .du{margin-left:2px;font-size:9.5px;letter-spacing:0}
.chipline .ow{
  margin-left:5px;font-size:9.5px;opacity:.8;letter-spacing:0;
  padding-left:4px;border-left:1px solid currentColor;
}
.mini .du{margin-left:3px;font-size:11px;letter-spacing:0;opacity:.9}
.raillegend{
  font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.04em;
  display:inline-flex;gap:10px;align-items:center;margin-left:10px;
}
.raillegend i{font-style:normal;display:inline-flex;align-items:center;gap:3px}
.lgbox{display:inline-block;width:16px;height:9px;border:1px solid var(--muted);border-radius:2px}
.lgbox.fill{background:var(--muted)}
.slot .win{font-family:var(--mono);font-size:10px;text-align:center;color:var(--pane-sub)}
.slot .shield{
  position:absolute;top:1px;right:2px;font-size:8px;color:#9A5B12;font-weight:700;
  font-family:var(--mono);letter-spacing:.05em;
}

/* ── 卓 ── */
.tableframe{
  border-radius:12px;padding:7px;
  background:linear-gradient(160deg,var(--rail-hi),var(--rail) 40%,#3A2C1E);
  box-shadow:0 6px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
  margin-bottom:10px;
}
.table{
  position:relative;border-radius:8px;overflow:hidden;
  background:
    radial-gradient(ellipse 130% 90% at 50% 46%, #2B3F57 0%, var(--felt) 55%, var(--felt-deep) 100%);
  min-height:392px;
  display:grid;
  grid-template-columns:168px 1fr 168px;
  grid-template-rows:84px 1fr 138px;
  grid-template-areas:
    "corner-a north corner-b"
    "west     center east"
    "south    south  south";
}
/* 署名：卓に落ちる光 */
.table::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 46% at 50% 44%, rgba(201,162,39,.20), rgba(201,162,39,0) 70%);
  transition:opacity .7s ease;
  opacity:1;
}
.table::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 46% at 50% 44%, rgba(205,212,221,.20), rgba(205,212,221,0) 70%);
  transition:opacity .7s ease;
  opacity:0;
}
body[data-rank="R"] .table::before{opacity:0}
body[data-rank="R"] .table::after{opacity:1}

/* 座席 */
.seat{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px}
.seat-n{grid-area:north;flex-direction:column}
.seat-w{grid-area:west;justify-content:center;align-items:flex-start;padding-left:8px}
.seat-e{align-items:flex-end;padding-right:8px}
.seat-w .plate,.seat-e .plate{white-space:nowrap}
.seat-w .minis,.seat-e .minis{justify-content:flex-start}
.seat-e .minis{justify-content:flex-end}
.seat-e{grid-area:east;justify-content:center}
.seat-s{grid-area:south;justify-content:flex-end;padding-bottom:10px}

.plate{
  display:flex;align-items:center;gap:8px;
  background:rgba(12,18,26,.72);border:1px solid rgba(255,255,255,.12);
  border-radius:4px;padding:5px 12px;backdrop-filter:blur(2px);
  transition:border-color .25s, box-shadow .25s;
}
.plate .nm{font-size:14.5px;font-weight:600;letter-spacing:.04em}
.plate .won{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--ivory)}
.plate .p1{
  font-family:var(--mono);font-size:10px;color:var(--room);
  background:var(--muted);border-radius:2px;padding:0 4px;letter-spacing:.08em;
}
.plate .spent{font-size:11px;color:var(--dim)}
.seat.lead .plate{border-color:var(--ivory);box-shadow:0 0 10px rgba(244,237,222,.25)}
.leadmark{
  font-family:var(--mincho);font-size:10px;color:var(--ivory);letter-spacing:.3em;
  opacity:0;transition:opacity .25s;
}
.seat.lead .leadmark{opacity:1}

.backs{display:flex;gap:0}
.backs .cardback{margin-left:-15px}
.backs .cardback:first-child{margin-left:0}
.seat-w .backs,.seat-e .backs{flex-direction:column}
.seat-w .backs .cardback,.seat-e .backs .cardback{margin-left:0;margin-top:-27px}
.seat-w .backs .cardback:first-child,.seat-e .backs .cardback:first-child{margin-top:0}

.minis{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:20px}
.mini{
  font-family:var(--mono);font-size:14px;border:1.5px solid;border-radius:3px;
  padding:3px 9px;background:rgba(12,18,26,.6);letter-spacing:.03em;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.mini.R{border-color:var(--verdigris);color:var(--verdigris)}

/* 中央 */
.center{grid-area:center;position:relative;z-index:2}
.bidsum{
  position:absolute;left:8px;top:4px;display:none;width:200px;z-index:6;
  font-family:var(--mono);line-height:1.45;
  background:rgba(8,13,20,.66);border:1px solid rgba(244,237,222,.16);
  border-radius:5px;padding:6px 11px;z-index:4;
}
.bidsum.on{display:block}
.bidsum.wide{width:470px}
.bidsum .lb{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;margin-bottom:1px}
.bidsum .big{display:flex;align-items:baseline;gap:7px}
.bidsum .vl{font-size:23px;font-weight:700;color:var(--ivory);line-height:1}
.bidsum .of{font-size:13px;color:var(--muted)}
.bidsum .df{font-size:13px;font-weight:700}
.bidsum .df.under{color:#79C08D}
.bidsum .df.over{color:#E06C75}
.bidsum .df.even{color:var(--ivory)}
.bidsum .exp{
  font-family:var(--sans);font-size:11.5px;line-height:1.5;
  color:var(--muted);margin-top:4px;white-space:normal;
}
.bidsum .exp b{color:var(--ivory)}
/* 開始前の順序一覧 */
.bidsum .ordrow{display:flex;align-items:center;gap:4px;margin:3px 0 5px;flex-wrap:wrap}
.bidsum .ordrow:last-child{margin-bottom:0}
.bidsum .ordlb{color:var(--brass);font-size:10px;letter-spacing:.08em;display:block;margin-top:6px}
.bidsum .ordlb:first-child{margin-top:0}
.bidsum .oc{font-size:11px;font-weight:700;border:1px solid;border-radius:3px;padding:1px 5px}
.bidsum .oa{color:var(--dim);font-size:10px}
/* 順序一覧は2列に畳んで背を低くする（西席との衝突回避） */
.bidsum .ordgrid{display:grid;grid-template-columns:auto auto;gap:3px 16px}
.bidsum .ordblk .ordlb{margin-top:0}
.bidsum.ord{width:auto;padding:5px 9px}
.bidsum.ord .ordgrid{gap:2px 14px}
.bidsum.ord .ordlb{margin:0 0 1px;font-size:9px;line-height:1.3}
.bidsum.ord .ordrow{margin:0;gap:3px}
.bidsum.ord .oc{font-size:10.5px;padding:0 4px}
.bidsum.ord .oa{font-size:9px}
/* 順序一覧が出ている間だけ、西席を下寄せして重なりを避ける */
body[data-ord="1"] .seat-w{justify-content:flex-end}

/* 離脱点（結果ダイアログ）の案内 */
.trialnote{
  margin-top:14px;padding-top:12px;border-top:1px solid #33455A;
  font-family:var(--sans);font-size:12px;line-height:1.6;color:var(--muted);
}
.trialnote .tn-t b{color:var(--ivory)}
.trialnote .tn-l{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:9px}
.trialnote .tn-l .btn{text-decoration:none;font-size:12px;padding:6px 14px;
  color:var(--ink);border-color:var(--brass);display:inline-block}
.trialnote .tn-l .btn:hover{color:var(--ivory)}

/* 得点表モーダル内のビッド操作欄 */
.ptbid:empty{display:none}
.ptbid{margin-top:14px;padding-top:14px;border-top:1px solid #33455A}
.ptbid .bidnote{margin-bottom:8px}

/* 総得点（卓の右上・横並び） */
.totalscore{
  grid-area:corner-b;align-self:start;justify-self:end;
  margin:8px 8px 0 0;z-index:5;display:flex;align-items:stretch;
  font-family:var(--mono);white-space:nowrap;
  background:rgba(8,13,20,.72);border:1px solid rgba(244,237,222,.16);
  border-radius:5px;overflow:hidden;
}
.totalscore .lb{
  display:flex;align-items:center;padding:0 7px;
  color:var(--muted);font-size:9.5px;letter-spacing:.06em;
  background:rgba(244,237,222,.05);
}
.totalscore .col{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:30px;padding:3px 6px;border-left:1px solid rgba(244,237,222,.14);
}
.totalscore .nm{font-size:10px;font-weight:700;line-height:1.3}
.totalscore .vl{font-size:14px;font-weight:700;color:var(--ivory);line-height:1.25}
.lens{
  position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);
  width:auto;min-width:210px;height:72px;border-radius:8px;
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:14px;
  padding:0 16px;white-space:nowrap;
  background:radial-gradient(circle at 42% 36%, rgba(20,28,38,.92), rgba(6,10,16,.96));
  border:1.5px solid rgba(244,237,222,.42);
  box-shadow:0 3px 18px rgba(0,0,0,.55), inset 0 0 20px rgba(0,0,0,.4);
  pointer-events:none;z-index:3;
}
.lens .lcol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.lens .lcol.lstack{align-items:flex-start;gap:4px}
.lens .lcol.lsep{width:1px;height:42px;background:rgba(244,237,222,.18);gap:0}
.lens .tno{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--ivory);line-height:1}
.lens .tno .of{font-size:12px;color:var(--muted);margin-left:1px}
.lens .sub.tlb{font-size:9.5px;letter-spacing:.06em}
.lens .stackwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
/* 土台：デフォルト状態。常に存在し、乗っている魔術がなければこれがそのまま見える */
.lens .base{
  width:38px;height:38px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.03);border:1px dashed rgba(244,237,222,.22);
  color:var(--dim);font-family:var(--mincho);font-size:19px;font-weight:700;
  position:relative;
}
.lens .base .lbl{position:absolute;bottom:-15px;font-family:var(--mono);font-size:8px;color:var(--dim);letter-spacing:.04em;white-space:nowrap}
/* 魔術タイル：土台の上に重なって乗る */
.lens .overlay{
  position:absolute;inset:0;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  transition:transform calc(.3s*var(--anim-scale)) cubic-bezier(.2,.8,.3,1),opacity calc(.3s*var(--anim-scale));
  box-shadow:0 3px 10px rgba(0,0,0,.5);
}
.lens .overlay.enter{transform:scale(.4) translateY(-10px);opacity:0}
.cleanup{
  position:absolute;left:50%;top:8px;transform:translateX(-50%);
  z-index:5;white-space:normal;text-align:center;max-width:min(88%,360px);
  font-family:var(--sans);font-size:10.5px;line-height:1.4;color:var(--warn);
  background:rgba(8,13,20,.88);border:1px solid rgba(217,146,74,.4);border-radius:4px;
  padding:5px 10px;opacity:0;transition:opacity .25s;pointer-events:none;
}
.cleanup.on{opacity:1}
.cleanup.act{pointer-events:auto}
.cleanup .closewrap{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:6px}
.cleanup .closewrap .btn{padding:4px 14px;font-size:11.5px}
.cleanup .closewrap .hint{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.lens .overlay.peel{
  transform:translateY(-34px) rotate(-14deg) scale(.85) !important;
  opacity:0 !important;
  transition:transform calc(.55s*var(--anim-scale)) cubic-bezier(.4,0,.7,1),opacity calc(.55s*var(--anim-scale));
}
.lensfly{
  position:fixed;z-index:50;pointer-events:none;
  transition:transform calc(.4s*var(--anim-scale)) cubic-bezier(.3,.7,.3,1),opacity calc(.4s*var(--anim-scale));
  transform:translate(0,0) scale(1);opacity:1;
}
.lens .kanji{
  font-family:var(--mincho);font-size:34px;line-height:1;font-weight:700;
  transition:color .5s;
}
.lens .kanji.N{color:var(--brass)} .lens .kanji.Rv{color:var(--verdigris)}
.lens .sub{font-family:var(--mono);font-size:10.5px;color:#B6C0CC;letter-spacing:.02em;line-height:1.35}
.lens .trump{font-size:17px;line-height:1.1}
.lens .base.tbase{font-family:var(--sans)}
.lens .base.tbase .none{font-size:9px;color:var(--dim);font-family:var(--mono)}
.lens .trump .none{color:var(--dim);font-size:9.5px;font-family:var(--mono);letter-spacing:.04em}
.lens .trump .tsym{
  display:inline-flex;align-items:center;gap:2px;
  border:1.5px solid;border-radius:3px;padding:0 5px;
  background:rgba(0,0,0,.3);font-weight:700;
}
.lens .trump .tsym .du{font-size:9px;font-family:var(--mono);font-weight:700;opacity:.9}

/* 出札：座席方向に配置 */
.played{position:absolute;z-index:3;transition:transform .32s cubic-bezier(.2,.7,.3,1),opacity .32s}
.played.pos-s{left:50%;bottom:6px;transform:translateX(-50%) rotate(1.5deg)}
.played.pos-w{left:12px;top:50%;transform:translateY(-50%) rotate(-3deg)}
.played.pos-n{left:50%;top:6px;transform:translateX(-50%) rotate(-1.5deg)}
.played.pos-e{right:12px;top:50%;transform:translateY(-50%) rotate(3deg)}

.played .who{
  font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-bottom:3px;
}
.played.winner .who{color:var(--ivory);font-weight:700}
.played.enter-s{transform:translateX(-50%) translateY(60px) rotate(1.5deg);opacity:0}
.played.enter-w{transform:translateY(-50%) translateX(-60px) rotate(-3deg);opacity:0}
.played.enter-n{transform:translateX(-50%) translateY(-60px) rotate(-1.5deg);opacity:0}
.played.enter-e{transform:translateY(-50%) translateX(60px) rotate(3deg);opacity:0}

/* ── トリック決着の演出 ── */
/* 勝ち札を持ち上げて強調する */
.played.winner{z-index:6}
.played.winner .cardsvg,.played.winner svg{
  filter:drop-shadow(0 0 0 rgba(0,0,0,0));
  animation:winpop calc(.38s*var(--anim-scale)) cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes winpop{
  0%{transform:scale(1) translateY(0)}
  55%{transform:scale(1.16) translateY(-7px)}
  100%{transform:scale(1.10) translateY(-5px)}
}
/* 敗れた札を沈める */
.played.loser{opacity:.42;transition:opacity calc(.3s*var(--anim-scale))}
/* 勝者の席へ吸い込む */
.center.sweeping .played{
  transition:transform calc(.42s*var(--anim-scale)) cubic-bezier(.5,0,.75,0), opacity calc(.42s*var(--anim-scale)) ease-in;
  opacity:0;
}
.center.sweeping .played.sw-n{transform:translateX(-50%) translateY(-150px) scale(.55)}
.center.sweeping .played.sw-s{transform:translateX(-50%) translateY(150px) scale(.55)}
.center.sweeping .played.sw-w{transform:translateY(-50%) translateX(-300px) scale(.55)}
.center.sweeping .played.sw-e{transform:translateY(-50%) translateX(300px) scale(.55)}

/* ── SVGカード ── */
.svgcard{display:block;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.svgcard.win{box-shadow:0 0 0 2px var(--ivory), 0 2px 10px rgba(0,0,0,.5)}
.svgcard.tr{box-shadow:0 0 0 2px currentColor, 0 2px 8px rgba(0,0,0,.5)}
.cardback{display:block;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* ── 手札 ── */
.handrow{display:flex;justify-content:center;align-items:flex-end;gap:0;padding:0 8px}
.hcard{margin-left:-26px;transition:transform .16s;position:relative}
.hcard:first-child{margin-left:0}
.hcard.playable{cursor:pointer}
.hcard.playable:hover{transform:translateY(-16px);z-index:5}
.hcard.illegal{opacity:.32}
.hcard.illegal .svgcard{filter:grayscale(.5)}

/* ── 帯（プロンプト） ── */
.prompt{
  border:1px solid #3A4A5E;border-left:3px solid var(--warn);border-radius:3px;
  background:var(--felt-deep);padding:9px 12px;
}
.prompt .q{font-size:13.5px;font-weight:600}
.prompt .h{font-size:11.5px;color:var(--muted);margin-top:1px}
.prompt .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin-top:8px}
.pool{display:flex;gap:6px;flex-wrap:wrap}

/* ── 魔力場操作カード（SVG） ── */
.condwrap{position:relative;transition:transform .16s}
.condwrap.sel{cursor:pointer}
.condwrap.sel:hover{transform:translateY(-5px)}
.condwrap.chosen .condsvg{box-shadow:0 0 0 2px var(--ivory)}
.condwrap.blocked{opacity:.3;cursor:not-allowed}
.condwrap.usedout{opacity:.3}
.condsvg{display:block;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.condsvg.tile-c{border-radius:50%}
.condsvg.tile-s{border-radius:3%}

/* ── 記録 ── */
details.logbox{
  border:1px solid #33455A;border-radius:3px;background:var(--felt-deep);
  margin-bottom:10px;
}
details.logbox summary{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);
  padding:7px 12px;cursor:pointer;user-select:none;
}
.log{
  padding:4px 12px 10px;max-height:180px;overflow-y:auto;
  font-family:var(--mono);font-size:11px;
}
.log div{padding:1.5px 0;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.04)}
.log .hl{color:var(--ink)}
.log .ev{color:var(--warn)}
.log .tk{color:var(--dim);margin-top:5px;letter-spacing:.06em}
.ticker{
  font-family:var(--mono);font-size:11px;color:var(--ink);
  border-left:3px solid var(--brass);background:rgba(201,162,39,.07);
  padding:5px 10px;min-height:26px;line-height:1.4;
  display:flex;align-items:center;border-radius:0 3px 3px 0;
}
.ticker:empty{display:none}

/* ── 得点表（常時表示） ── */
.paytable{
  display:flex;align-items:stretch;
  border:1px solid var(--pane-line);border-radius:3px;background:var(--pane);
  overflow:hidden;font-family:var(--mono);
}
.paytable .ttl{
  display:flex;flex-direction:column;justify-content:center;
  padding:5px 11px;font-size:11px;letter-spacing:.1em;color:var(--pane-sub);
  border-right:1px solid var(--pane-line);white-space:nowrap;line-height:1.6;
  background:var(--pane-alt);
}
.paytable .ttl b{color:var(--pane-ink);font-size:12px;font-weight:700;letter-spacing:.04em}
.ptlabels{display:flex;flex-direction:column;text-align:right;
  border-right:1px solid var(--pane-line);padding:0 10px 0 11px;justify-content:flex-end;
  background:var(--pane-alt)}
.ptlabels div{font-size:12px;color:var(--pane-sub);line-height:1.5;padding:2px 0;white-space:nowrap}
.ptlabels div.l-hit{color:#B4143A;font-weight:700}
.ptlabels div.l-n1{color:#8A6212}
.ptlabels div.l-n2{color:#6B6357}
.ptgrid{display:flex;flex:1}
.ptcol{
  flex:1;display:flex;flex-direction:column;text-align:center;
  border-right:1px solid var(--pane-line);min-width:0;
}
.ptcol:last-child{border-right:0}
.ptcol .b{font-size:14px;font-weight:700;padding:3px 0 2px;color:var(--pane-ink);
  background:var(--pane-alt);line-height:1.25}
.ptcol .v{font-size:14px;padding:2px 0;line-height:1.4;font-weight:700}
.ptcol .v.hit{color:#B4143A}
.ptcol .v.n1{color:#8A6212}
.ptcol .v.n2{color:#6B6357;font-size:13px;font-weight:500}
.ptcol .who{font-size:11px;line-height:1.35;padding:2px 0 3px;min-height:17px;
  font-family:var(--mono);letter-spacing:.02em;font-weight:700}
.ptcol.owned{background:var(--oc-cell)}
.ptcol.owned .b{background:var(--oc-head)}

/* ── 座席トースト（誰が何をしたか） ── */
.seattoast{
  position:absolute;z-index:14;pointer-events:none;
  grid-column:1/-1;grid-row:1/-1;   /* grid の暗黙セルに閉じ込められないよう全域を占有 */
  background:rgba(8,13,20,.95);border:1px solid;border-radius:5px;
  padding:7px 13px;max-width:230px;
  box-shadow:0 5px 20px rgba(0,0,0,.6);
  font-size:12.5px;line-height:1.5;
  opacity:0;transition:opacity .18s,transform .18s;
}
.seattoast.on{opacity:1}
.seattoast .who{font-weight:700;font-size:12.5px;display:block;margin-bottom:1px}
.seattoast .act{color:var(--ink);font-family:var(--sans)}
.seattoast .act em{font-style:normal;font-family:var(--mono);font-weight:700}
.seattoast::after{
  content:"";position:absolute;width:9px;height:9px;
  background:rgba(8,13,20,.95);border:1px solid;border-color:inherit;
  transform:rotate(45deg);
}
/* 位置：南＝手札の上／西・東＝内側／北＝下 */
.seattoast.at-s{left:50%;bottom:150px;transform:translateX(-50%) translateY(6px)}
.seattoast.at-s.on{transform:translateX(-50%) translateY(0)}
.seattoast.at-s::after{left:50%;margin-left:-5px;bottom:-5px;border-top:0;border-left:0}
.seattoast.at-n{left:50%;top:104px;transform:translateX(-50%) translateY(-6px)}
.seattoast.at-n.on{transform:translateX(-50%) translateY(0)}
.seattoast.at-n::after{left:50%;margin-left:-5px;top:-5px;border-bottom:0;border-right:0}
/* 西は開始前パネル（フェイズ順序一覧・宣言総和）と縦位置が重なりうるため、下寄りに固定 */
.seattoast.at-w{left:20px;top:auto;bottom:110px;transform:translateX(-6px)}
.seattoast.at-w.on{transform:translateX(0)}
.seattoast.at-w::after{left:22px;top:-5px;border-bottom:0;border-right:0}
.seattoast.at-e{right:20px;top:50%;transform:translateY(-50%) translateX(6px)}
.seattoast.at-e.on{transform:translateY(-50%) translateX(0)}
.seattoast.at-e::after{right:22px;top:-5px;border-bottom:0;border-right:0}

/* 勝利カードの強調 */
.svgcard.win{
  box-shadow:0 0 0 3px var(--ivory), 0 0 22px rgba(244,237,222,.55), 0 2px 10px rgba(0,0,0,.5);
}
.played.winner{ z-index:6 }
.played.winner .svgcard{ transform:scale(1.10); transition:transform .2s }

/* 解決の説明文 */
.offerstrip{flex-direction:column;align-items:center;gap:9px;max-width:min(94%,660px)}
.offerstrip .srow{display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.offerstrip .expl{
  font-family:var(--sans);font-size:11.5px;color:var(--muted);line-height:1.65;
  border-top:1px solid #33455A;padding-top:8px;width:100%;text-align:left;
}
.offerstrip .expl b{color:var(--ink);font-weight:600}
.offerstrip .expl .ok{color:#79C08D}
.offerstrip .expl .ng{color:var(--dim)}

/* ── 応変魔術：発動者と布石のフキダシ ── */
.obub{
  position:absolute;z-index:11;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  animation:obubin calc(.22s*var(--anim-scale)) cubic-bezier(.2,.8,.3,1);
}
@keyframes obubin{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1}}
.obub .bx{
  position:relative;min-width:62px;min-height:56px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,15,22,.94);border:1.5px solid;border-radius:7px;
  padding:6px 8px;box-shadow:0 4px 14px rgba(0,0,0,.5);
  transition:box-shadow .25s,border-color .25s,opacity .25s;
}
.obub .bx::after{                      /* しっぽ */
  content:'';position:absolute;width:9px;height:9px;
  background:rgba(10,15,22,.94);border:1.5px solid;border-color:inherit;
  transform:rotate(45deg);
}
.obub.at-n .bx::after{top:-6px;left:50%;margin-left:-5px;border-right:0;border-bottom:0}
.obub.at-s .bx::after{bottom:-6px;left:50%;margin-left:-5px;border-left:0;border-top:0}
.obub.at-w .bx::after{left:-6px;top:50%;margin-top:-5px;border-right:0;border-top:0}
.obub.at-e .bx::after{right:-6px;top:50%;margin-top:-5px;border-left:0;border-bottom:0}
.obub .nm{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.02em}
.obub .none{font-family:var(--sans);font-size:11px;color:var(--dim)}
.obub.pass .bx{border-color:#3B4757 !important;background:rgba(10,15,22,.62)}
.obub.win  .bx{box-shadow:0 0 0 2px var(--brass),0 6px 20px rgba(201,162,39,.35)}
.obub.lose .bx{opacity:.42}
.obub .tag{
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.04em;
  border-radius:2px;padding:1px 4px;white-space:nowrap;
}
.obub.win  .tag{background:var(--brass);color:#101720}
.obub.lose .tag{background:#3B4757;color:#9AA5B1}
/* 位置：出札と同じ配置。布石は中央 */
.obub.at-n{left:50%;top:0;transform:translateX(-50%)}
.obub.at-s{left:50%;bottom:2px;transform:translateX(-50%);z-index:13}
.obub.at-w{left:8px;top:50%;transform:translateY(-50%)}
.obub.at-e{right:8px;top:50%;transform:translateY(-50%)}
/* 布石は中央の空きへ（南北のフキダシと重ならない位置） */
.obub.at-c{left:26%;top:50%;transform:translate(-50%,-50%)}
.obub.at-s{left:72%}
.obub.at-c .bx::after{display:none}
/* 応変フェイズ中はレンズを隠す（同じ場所を使うため） */
.center.offering .lens{opacity:0;transition:opacity .2s}
/* リード強調 */
.seat.leadglow .plate{
  box-shadow:0 0 0 2px var(--brass),0 0 18px rgba(201,162,39,.45);
  transition:box-shadow .3s;
}

/* ── 応変魔術判断ポップアップ（手札の直上） ── */
.reactpop{
  position:absolute;left:50%;bottom:132px;transform:translateX(-50%);z-index:9;
  background:rgba(8,13,20,.95);border:1px solid var(--warn);
  border-radius:6px;padding:10px 16px;
  box-shadow:0 8px 28px rgba(0,0,0,.6);
  display:flex;align-items:center;gap:18px;
  animation:popin .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes popin{from{opacity:0;transform:translateX(-50%) translateY(12px)}
                 to{opacity:1;transform:translateX(-50%) translateY(0)}}
.reactpop .rtext{display:flex;flex-direction:column;gap:3px}
.reactpop .rq{font-size:14px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.reactpop .rh{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.55;white-space:nowrap}
.reactpop .rh b{color:var(--warn);font-weight:600}
.reactpop .rnow{
  display:flex;flex-direction:column;gap:4px;white-space:nowrap;
  padding:7px 11px;border:1px solid #3A4A5E;border-radius:5px;
  background:rgba(244,237,222,.045);font-family:var(--mono);
}
.reactpop .rnow .nlb{
  color:var(--muted);font-size:9.5px;letter-spacing:.08em;margin-bottom:1px;
}
.reactpop .rnow .ln{display:flex;align-items:baseline;gap:7px}
.reactpop .rnow .k{color:var(--dim);font-size:10px;min-width:44px}
.reactpop .rnow .v{font-size:13px;font-weight:700;line-height:1.2}
.reactpop .rnow .sub{color:var(--muted);font-size:10px}
.reactpop .rrow{display:flex;gap:9px;align-items:center}
.reactpop .btn{padding:12px 18px;font-size:13px;white-space:nowrap}

/* ── 応変魔術解決の可視化 ── */
body[data-resolve="1"] .seat .plate,
body[data-resolve="1"] .seat .minis,
body[data-resolve="1"] .seat .leadmark,
body[data-resolve="1"] .bidsum{
  position:absolute;left:8px;top:4px;display:none;width:200px;z-index:6;
  font-family:var(--mono);line-height:1.45;
  background:rgba(8,13,20,.66);border:1px solid rgba(244,237,222,.16);
  border-radius:5px;padding:6px 11px;z-index:4;
}
.bidsum.on{display:block}
.bidsum.wide{width:470px}
.bidsum .lb{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;margin-bottom:1px}
.bidsum .big{display:flex;align-items:baseline;gap:7px}
.bidsum .vl{font-size:23px;font-weight:700;color:var(--ivory);line-height:1}
.bidsum .of{font-size:13px;color:var(--muted)}
.bidsum .df{font-size:13px;font-weight:700}
.bidsum .df.under{color:#79C08D}
.bidsum .df.over{color:#E06C75}
.bidsum .df.even{color:var(--ivory)}
.bidsum .exp{
  font-family:var(--sans);font-size:11.5px;line-height:1.5;
  color:var(--muted);margin-top:4px;white-space:normal;
}
.bidsum .exp b{color:var(--ivory)}
/* 開始前の順序一覧 */
.bidsum .ordrow{display:flex;align-items:center;gap:4px;margin:3px 0 5px;flex-wrap:wrap}
.bidsum .ordrow:last-child{margin-bottom:0}
.bidsum .ordlb{color:var(--brass);font-size:10px;letter-spacing:.08em;display:block;margin-top:6px}
.bidsum .ordlb:first-child{margin-top:0}
.bidsum .oc{font-size:11px;font-weight:700;border:1px solid;border-radius:3px;padding:1px 5px}
.bidsum .oa{color:var(--dim);font-size:10px}
.offerstrip{
  position:absolute;left:50%;top:2px;transform:translateX(-50%);z-index:12;
  display:flex;gap:9px;align-items:flex-start;
  background:rgba(8,13,20,.92);border:1px solid #46586E;border-radius:5px;
  padding:8px 12px 7px;backdrop-filter:blur(3px);
  box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.offerstrip .hdr{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);
  writing-mode:vertical-rl;text-orientation:upright;margin-right:2px;
}
.offitem{display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:opacity .35s,transform .35s}
.offitem .who{font-family:var(--mono);font-size:12px;color:var(--ink)}
.offitem .body{
  font-family:var(--mono);font-size:14px;border:1.5px solid;border-radius:4px;
  padding:5px 11px;white-space:nowrap;
}
.offitem .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.offitem.pending .tag{color:var(--dim)}
.offitem.win{transform:translateY(-3px)}
.offitem.win .body{box-shadow:0 0 0 2px #79C08D}
.offitem.win .tag{color:#79C08D;font-weight:700}
.offitem.lose{opacity:.34}
.offitem.lose .tag{color:var(--dim)}
.offitem.placed .who{color:var(--warn)}
.offitem.placed .tag{color:var(--warn)}

.ovr{font-size:11px;color:var(--warn);margin-top:2px;line-height:1.5}
.changebanner{
  border:1px solid var(--brass);border-radius:4px;background:rgba(201,162,39,.10);
  padding:7px 16px;font-family:var(--mono);font-size:13px;
  text-align:center;line-height:1.6;
}
.changebanner .arrow{color:var(--dim);margin:0 7px}
.offerstrip .closewrap{
  display:flex;align-items:center;padding-left:12px;margin-left:4px;
  border-left:1px solid #46586E;align-self:stretch;
}
.offerstrip .closewrap .btn{
  padding:10px 18px;font-size:13px;border-color:var(--brass);white-space:nowrap;
}
.offerstrip .closewrap .btn:hover{background:#3A3320;border-color:var(--ivory)}
.offerstrip .closewrap .hint{
  font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-left:8px;
}
.changebanner .to{font-weight:700}

/* ── ビッド・スコア ── */
.scorebar{
  display:flex;gap:6px;flex-wrap:wrap;align-items:stretch;margin-bottom:10px;
}
.scard{
  flex:1 1 0;min-width:120px;border:1px solid #33455A;border-radius:3px;
  background:var(--felt-deep);padding:7px 10px;transition:border-color .2s;
}
.scard.me{border-color:#4B6076}
.scard.leadn{border-color:var(--brass)}
.scard .nm{font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center}
.scard .tot{font-family:var(--mono);font-size:25px;font-weight:700;line-height:1.1}
.scard .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dealtag{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);
  border:1px solid #33455A;border-radius:3px;padding:6px 10px;display:flex;
  flex-direction:column;justify-content:center;background:var(--felt-deep);
}
.dealtag b{color:var(--ivory);font-size:15px;font-weight:700}

.bidbtns{display:flex;gap:4px;flex-wrap:wrap}
.bidbtn{
  min-width:44px;border:1px solid #3A4A5E;background:#12161C;border-radius:3px;
  padding:6px 0 5px;font-family:var(--mono);font-size:15px;text-align:center;
  transition:background .12s,border-color .12s;
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15;
}
.bidbtn .pt{font-size:9.5px;color:var(--muted)}
.bidbtn:hover{background:#2C3E52;border-color:var(--ivory)}
.bidbtn:hover .pt{color:var(--ivory)}
.bidbtn.taken{opacity:.25;cursor:not-allowed;background:#0D1117}
.bidbtn.taken:hover{background:#0D1117;border-color:#3A4A5E}
.bidnote{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px}

.plate .bidbadge{
  font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.03em;
  border:1px solid var(--brass);color:var(--brass);border-radius:3px;padding:1px 7px;
}
.plate .bidbadge.done{border-color:var(--ok,#79C08D);color:#79C08D}
.plate .bidbadge.over{border-color:#E06C75;color:#E06C75}

/* ── 結果 ── */
.resultveil{
  position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(10,15,22,.72);backdrop-filter:blur(2px);
}
.result{
  background:var(--felt-deep);border:1px solid var(--brass);border-radius:6px;
  padding:20px 24px;max-width:560px;width:calc(100% - 40px);
}
.result h2{margin:0 0 8px;font-family:var(--mincho);font-size:19px;letter-spacing:.12em}
.result .line{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:7px;margin-top:14px}
.metric{border:1px solid #33455A;border-radius:2px;padding:6px 8px}
.metric .k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--dim)}
.metric .v{font-family:var(--mono);font-size:15px;font-weight:600}

@media (max-width:1180px){
  .layout{grid-template-columns:1fr}
}
@media (max-width:900px){
  .table{grid-template-columns:96px 1fr 96px;grid-template-rows:104px 1fr 160px;min-height:490px}
  .track{grid-template-columns:repeat(8,1fr)}
  .hcard{margin-left:-30px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

            <h4>1トリック＝全員が1枚ずつ出して、勝った人が引き取る</h4>
            <p>4人が順番に手札から1枚ずつ出します。4枚出そろったら、
            そのうち一番強いカードを出した人が<b>その4枚を引き取ります</b>。
            これを1回ぶんの勝負とみなし、<b>トリック</b>と呼びます。</p>
            <p>手札が15枚なので、15回くり返して終わりです。</p>

            <h4>リード＝最初に出す人。そのスートが基準になる</h4>
            <p>最初に出す人を<b>リードプレイヤー</b>といいます。
            リードした人が出したカードのスート（水・火・地・風）が、
            そのトリックの<b>基準のスート</b>になります。</p>

            <h4>フォロー＝同じスートを持っていたら必ず出す</h4>
            <p>後の3人は、<b>基準のスートを持っていたら、必ずそれを出さなければなりません</b>。
            これをフォローといいます。持っていなければ何を出しても構いません。</p>

            <h4>勝つのは「基準のスートの中で一番強いカード」</h4>
            <p>基準のスート以外のカードは、どれだけ数字が大きくても勝てません。
            たとえば {{s0}}水 がリードなら、{{s1}}火15 より {{s0}}水3 の方が勝ちます。</p>
            <p class="ex">例：水5（リード）→ 水12 → 火15 → 水3　→　勝つのは <b>水12</b></p>

            <h4>元素活性＝そのスートだけ特別に強くなる</h4>
            <p>「元素活性は{{s1}}火」と決まっている場合、<b>火はどのスートよりも強く</b>なります。
            基準のスートを持っていない人が火を出せば、それだけで勝てます。</p>
            <p class="ex">例：元素活性 火 で 水5（リード）→ 水12 → 火15 → 水3　→　勝つのは <b>火15</b></p>
            <p>元素活性が指定されていない状態（元素活性なし）もあります。</p>

            <h4>次のリードは、そのトリックに勝った人</h4>
            <p>勝った人が次のトリックの最初のカードを出します。
            つまり<b>勝ち続けると、基準のスートを決め続けられます</b>。</p>

            <p class="hend">ここまでが一般的なトリックテイキングです。
            このゲームでは、これに<b>「勝敗の条件そのものが変わる」</b>という仕組みが加わります。</p>
          </div>
        </details>

        <h3>このゲームの特徴</h3>
        <p>ふつうのトリックテイキングでは「数字が大きい方が勝つ」「元素活性は火」といった条件は
        ゲーム中ずっと変わりません。このゲームでは、<b>その条件をプレイヤー自身が動かします。</b></p>

        <h3>2つの条件</h3>
        <div class="hgrid">
          <div class="hcell">
            <div class="hct">理力の条件</div>
            <div><b>正</b>：数字が大きい方が勝つ（最初の状態）<br>
                 <b>逆</b>：数字が小さい方が勝つ</div>
            <div class="hsub">「反理力」カードで <b>逆に置き換わります</b>。</div>
          </div>
          <div class="hcell">
            <div class="hct">元素活性の条件</div>
            <div><b>なし</b>：元素活性がない（最初の状態）<br>
                 <b>{{s0}}水 {{s1}}火 {{s2}}地 {{s3}}風</b>：そのスートが最強になる</div>
            <div class="hsub">「元素活性」カードで <b>指定したスートに置き換わります</b>。</div>
          </div>
        </div>
        <p>この2つは<b>別々に動きます。</b>「数字が小さい方が勝つ、ただし火は最強」という状態もあります。</p>

        <h3>魔力場操作カードは 1T と 継続 の2種類</h3>
        <ul>
          <li><b>1T</b>：そのトリックだけ有効。終わると元（正・元素活性なし）に戻ります</li>
          <li><b>継続</b>：同じ種類の魔力場操作カードが次に発動するまで、ずっと有効です</li>
        </ul>
        <p class="hnb">※ 同じ種類の魔力場操作カードが発動すると、それまでのカードは種類を問わず捨てられます。
        つまり有効な魔力場操作カードは、理力・元素活性それぞれ常に1枚だけです。
        継続効果のカードも、1T効果のカードが出た後は捨てられて初期状態の条件に戻ります。</p>

        <h3>1戦の流れ</h3>
        <ol class="hflow">
          <li><b>配札</b>　60枚を15枚ずつ配ります</li>
          <li><b>ドラフト</b>　手札を見てから、12枚の魔力場操作カードを順番に1枚ずつ取ります（各自3枚）</li>
          <li><b>布石</b>　3枚のうち1枚を、1〜15のどのトリックで発動させるか決めて置きます（全員に公開）</li>
          <li><b>宣言</b>　自分が何トリック取るかを宣言します（<b>他の人と同じ数は選べません</b>）</li>
          <li><b>プレイ</b>　15トリックを戦います</li>
          <li><b>得点</b>　宣言した数と実際に取った数を照合します</li>
        </ol>

        <h3>布石と応変魔術</h3>
        <p>取った3枚の魔力場操作カードは、次のように使い分けます。</p>
        <ul>
          <li><b>布石（1枚）</b>　開始前に「このトリックで発動する」と予約。<b>必ず発動します</b></li>
          <li><b>応変魔術（2枚）</b>　プレイ中、好きなトリックで出せます。<b>発動できるのは1枚だけ</b>で、
              残る1枚は使われずに終わります</li>
        </ul>
        <p class="hnb">※ 布石が置かれているトリックには、<b>同じ種類の</b>応変魔術は出せません（保護されます）。
        違う種類なら出せるので、たとえば「元素活性 火 が布石されたトリックに、反理力を重ねる」ことは可能です。</p>

        <h3>応変魔術の解決</h3>
        <p><b>前のトリックの勝者だけ</b>が、リードの前に応変魔術を出すか出さないかを選べます。
        第1トリックでは前のトリックが存在しないため、誰も使えません。</p>
        <p>布石で保護されている軸には出せません。それ以外はそのまま発動します。</p>

        <h3>得点</h3>
        <p>ぴったり合えば満額、1つずれれば部分点、2つずれても少し入ります。<b>3つ以上ずれると0点</b>です。</p>
        <p><b>宣言が極端（0 や 8以上）なほど高得点</b>です。3〜4 トリックが最も当てやすい代わりに点は低く、
        当てにくい宣言ほど見返りが大きくなっています。画面の得点表をいつでも参照してください。</p>

        <h3>勝敗</h3>
        <p>選んだ戦数（1〜4戦）を終えた時点で、合計点が最も高い人の勝ちです。
        1戦ごとに先手（P1）が1人ずつ移ります。</p>

        <h3>画面の見かた</h3>
        <ul class="hui">
          <li><b>卓の中央の丸</b>　今の条件。「正理力／反理力」と元素活性のスートが出ます。卓の光の色も変わります</li>
          <li><b>卓の下の帯</b>　15トリックのトラック。布石されたカードと、そのトリックの勝者が並びます</li>
          <li><b>その下の表</b>　得点表。誰がどの数を宣言したかも表示されます</li>
          <li><b>右の一覧</b>　行動順に並んだプレイヤー。手番と直前の行動が分かります</li>
          <li><b>塗りつぶし／枠のみ</b>　魔力場操作カードの継続／1T の区別です</li>
        </ul>

  helpTitle:'ElemenTrick — Rules', glossTitle:'Glossary',
  helpBody:`
        <div class="hnote">
          <b>This is a playtest build, made to try out the design.</b> The title is provisional.
          The suit artwork ({{s0}}Aqua, {{s1}}Fire, {{s2}}Earth, {{s3}}Wind) and the numbers
          are placeholders; the finished game will use a refined design.
          Card counts, scoring and flow are all still being worked on and may change.<br>
          <b>Best on a desktop or a tablet in landscape.</b>
          It runs on a phone, but the screen is too cramped to play comfortably.
        </div>

        <div class="hgoal">
          <div class="hgt">The goal</div>
          <p><b>You call how many of the 15 tricks you will win, then try to land on that number.</b></p>
          <p>A round is 15 tricks. Before play begins, each player names the number of tricks
          they expect to win. <b>Hit it exactly and you score well.</b> Being off by one or two
          still pays something, but <b>being off by three or more scores nothing</b>.</p>
          <p class="hgw"><b>Winning more is not better.</b>
          If you called 3 and take 4, your score drops. Knowing when <i>not</i> to win
          matters just as much as winning.</p>
          <p>Each bid number has its own payout, and <b>the harder a number is to hit,
          the more it pays</b>. The full table is always on screen. Some examples:</p>

          <div class="hgex">
            <div class="hgexr"><span class="lbl">Bid 4</span>
              <span>Exact <b>5</b> / off by one 2　── easiest to hit, lowest payout</span></div>
            <div class="hgexr"><span class="lbl">Bid 0</span>
              <span>Exact <b>10</b> / off by one 7　── win nothing at all</span></div>
            <div class="hgexr"><span class="lbl">Bid 7</span>
              <span>Exact <b>8</b> / off by one 5　── aim to win big</span></div>
          </div>

          <p>What makes that number hard to predict is the twist:
          <b>the winning conditions themselves change during play</b> —
          and it is the players who change them.</p>
        </div>

        <details class="hbasic">
          <summary>New to trick-taking games? Start here</summary>
          <div class="hin">
            <p>This is a <b>trick-taking</b> game. Here are the basics.
            Skip this section if you already know them.</p>

            <h4>A trick: everyone plays one card, the strongest takes them all</h4>
            <p>Each of the four players plays one card from hand, in turn order.
            Once all four are down, whoever played the strongest card
            <b>takes all four</b>. That single exchange is called a <b>trick</b>.</p>
            <p>With 15 cards each, a round runs for 15 tricks.</p>

            <h4>The lead sets the suit</h4>
            <p>The player who plays first is the <b>lead player</b>. The suit of their card
            (Aqua, Fire, Earth or Wind) becomes the <b>led suit</b> for that trick.</p>

            <h4>Follow suit if you can</h4>
            <p>The other three players <b>must play the led suit if they hold any</b>.
            This is called following suit. With none of that suit, you may play anything.</p>

            <h4>Only the led suit can win</h4>
            <p>Cards outside the led suit cannot win, no matter how high.
            If {{s0}}Aqua is led, Aqua 3 beats Fire 15.</p>
            <p class="ex">Aqua 5 (lead) → Aqua 12 → Fire 15 → Aqua 3　→　<b>Aqua 12</b> wins</p>

            <h4>Trump: one suit outranks everything</h4>
            <p>When a trump suit is set — say {{s1}}Fire — <b>every Fire card beats every card
            of any other suit</b>. A player who cannot follow suit can win the trick
            simply by playing a trump.</p>
            <p class="ex">Trump Fire: Aqua 5 (lead) → Aqua 12 → Fire 15 → Aqua 3　→　<b>Fire 15</b> wins</p>
            <p>There is also a no-trump state, where no suit is trump.</p>

            <h4>The winner leads next</h4>
            <p>Whoever takes a trick plays first in the next one, which means
            <b>winning lets you keep choosing the led suit</b>.</p>

            <p class="hend">That is trick-taking in general. This game adds one thing on top:
            <b>the rules for who wins can change from trick to trick.</b></p>
          </div>
        </details>

        <h3>What makes this game different</h3>
        <p>In a normal trick-taking game, conditions like "higher wins" and "hearts are trump"
        stay fixed for the whole game. Here, <b>the players move those conditions themselves.</b></p>

        <h3>Two conditions</h3>
        <div class="hgrid">
          <div class="hcell">
            <div class="hct">Rank condition</div>
            <div><b>HIGH</b>: the higher number wins (starting state)<br>
                 <b>LOW</b>: the lower number wins</div>
            <div class="hsub">A <b>LOW</b> card <b>sets it to LOW</b>.</div>
          </div>
          <div class="hcell">
            <div class="hct">Trump condition</div>
            <div><b>None</b>: no trump suit (starting state)<br>
                 <b>{{s0}}Aqua {{s1}}Fire {{s2}}Earth {{s3}}Wind</b>: that suit outranks everything</div>
            <div class="hsub">A <b>Trump</b> card <b>replaces it with the named suit</b>.</div>
          </div>
        </div>
        <p>The two move <b>independently</b>. "Lower wins, but Fire still beats everything" is a real state.</p>

        <h3>Condition cards last 1T or LAST</h3>
        <ul>
          <li><b>1T</b> — active for that trick only. Afterwards the condition returns to its
              starting state (HIGH, no trump)</li>
          <li><b>LAST</b> — stays active until the next condition card of the same kind fires</li>
        </ul>
        <p class="hnb">※ When a condition card of the same kind fires, whatever was there before is
        discarded regardless of type. Only one card is ever active per condition.
        A LAST card is discarded by a 1T card too, and the condition returns to its starting state.</p>

        <h3>How a round runs</h3>
        <ol class="hflow">
          <li><b>Deal</b>　60 cards, 15 to each player</li>
          <li><b>Draft</b>　After looking at your hand, take condition cards one at a time from the 12 on offer (3 each)</li>
          <li><b>Plant</b>　Commit one of your three to a specific trick, 1 through 15 (face up, everyone sees it)</li>
          <li><b>Bid</b>　Call how many tricks you will win (<b>you cannot call a number someone else has taken</b>)</li>
          <li><b>Play</b>　15 tricks</li>
          <li><b>Score</b>　Compare your bid against what you actually took</li>
        </ol>

        <h3>Plant and Reactive</h3>
        <p>Your three condition cards split up like this:</p>
        <ul>
          <li><b>Plant (1 card)</b>　Committed before play to a specific trick. <b>It always fires.</b></li>
          <li><b>Reactive (2 cards)</b>　Held in hand, playable at any trick.
              <b>Only one of them will ever fire</b>; the other is never used.</li>
        </ul>
        <p class="hnb">※ A trick that has a Plant on it is <b>locked for that kind of condition</b> —
        no Reactive of the same kind can be played there. A different kind still can,
        so you can, for example, stack a LOW onto a trick where someone planted Trump Fire.</p>

        <h3>Resolving Reactives</h3>
        <p><b>Only the winner of the previous trick</b> may choose to play a Reactive before leading.
        On trick 1 there is no previous trick, so nobody may play one.</p>
        <p>It can't be played on an axis locked by a Plant. Otherwise it simply fires.</p>

        <h3>Scoring</h3>
        <p>Exact gets full value, off by one pays a reduced amount, off by two pays a little.
        <b>Off by three or more scores zero.</b></p>
        <p><b>The more extreme the bid (0, or 8 and up), the higher the payout.</b>
        Bidding 3 or 4 is easiest to hit but pays least. Check the scoring table on screen at any time.</p>

        <h3>Winning</h3>
        <p>After the chosen number of rounds (1–4), the highest total score wins.
        The first player (P1) passes to the next person each round.</p>

        <h3>Reading the screen</h3>
        <ul class="hui">
          <li><b>The disc at the centre</b>　The current conditions: HIGH/LOW and the trump suit.
              The light across the table changes colour with it</li>
          <li><b>The strip below the table</b>　The trick track. Planted cards and the winner of each trick</li>
          <li><b>The table under that</b>　Scoring. It also shows who has bid each number</li>
          <li><b>The list on the right</b>　Players in turn order, with the current turn and last action</li>
          <li><b>Filled vs outlined</b>　LAST vs 1T on condition cards</li>
        </ul>
`,
  glossBody:`
            <div class="glcat">Reading a condition card</div>
            <div class="cardguide">
              <div class="cg">{{card:R,TEMP}}{{card:R,PERSIST}}</div>
              <div class="cgtxt">
                A <b>LOW</b> card. It sets the rank condition to LOW.<br>
                The mark at the bottom shows how long it lasts.<br>
                {{dot}} <span class="mk">1T</span> = this trick only　/　
                {{bar}} <span class="mk">LAST</span> = until the next card of the same kind
              </div>
              <div class="cg">{{card:T,TEMP,1}}{{card:T,PERSIST,1}}</div>
              <div class="cgtxt">
                A <b>Trump</b> card. It makes the pictured suit trump.<br>
                Same markings ({{dot}} <span class="mk">1T</span> / {{bar}} <span class="mk">LAST</span>).
              </div>
              <div class="cg" style="align-items:center">
                <div class="chipguide">{{chip:R,TEMP}}{{chip:R,PERSIST}}{{chip:T,TEMP,1}}{{chip:T,PERSIST,1}}</div>
              </div>
              <div class="cgtxt">
                On the table and in the player list, cards appear as these small tags.<br>
                <b>Outlined = 1T</b>, <b>filled = LAST</b> — no need to read the text.
              </div>
            </div>

            <div class="glcat">General trick-taking terms</div>
            <dl class="gl">
              <dt>Trick</dt><dd>One exchange where every player lays a card and the strongest takes them all. A round here is 15 tricks.</dd>
              <dt>Suit</dt><dd>The card's family: the four elements {{s0}}Aqua, {{s1}}Fire, {{s2}}Earth and {{s3}}Wind.</dd>
              <dt>Rank</dt><dd>The card's number, 1 to 15.</dd>
              <dt>Lead</dt><dd>To play the first card of a trick, or the player who does so (the lead player). Their suit becomes the led suit.</dd>
              <dt>Follow suit</dt><dd>To play the led suit when you hold it, which is mandatory. With none of that suit you may play anything.</dd>
              <dt>Trump</dt><dd>A suit that outranks all others. A player who cannot follow suit can take the trick with one.</dd>
              <dt>Void</dt><dd>Holding no cards of a given suit, which is what lets you play a trump.</dd>
              <dt>Bid</dt><dd>Declaring, before play, how many tricks you intend to win.</dd>
              <dt>Dealer</dt><dd>The one who deals. Handled automatically here.</dd>
            </dl>

            <div class="glcat">Terms specific to this game</div>
            <dl class="gl">
              <dt>Condition card</dt><dd>A card that changes how tricks are won. 12 in total; each player drafts 3.</dd>
              <dt>Rank condition</dt><dd>Either HIGH (higher number wins) or LOW (lower wins). It starts HIGH, and is LOW only while a <b>LOW</b> card is on the table.</dd>
              <dt>Trump condition</dt><dd>None, or one of Aqua / Fire / Earth / Wind. A <b>Trump</b> card replaces it with the named suit.</dd>
              <dt>HIGH / LOW</dt><dd>The current rank condition. Shown at the centre of the table; the light across the table also shifts (gold for HIGH, silver for LOW).</dd>
              <dt>LOW</dt><dd>A card that <b>sets the rank condition to LOW</b>. While it is on the table, the lower number wins. Playing one when it is already LOW leaves it LOW.</dd>
              <dt>1T</dt><dd>Active for one trick only. Afterwards the condition returns to its starting state (HIGH, no trump).</dd>
              <dt>LAST</dt><dd>Active until the next condition card of the same kind fires. Shown filled in on the card face.</dd>
              <dt>Draft</dt><dd>The phase where players take condition cards one at a time after seeing their hands. Fully open.</dd>
              <dt>Plant</dt><dd>Committing one of your three cards to a specific trick before play. It always fires.</dd>
              <dt>Locked</dt><dd>A trick carrying a Plant will not accept a Reactive <b>of the same kind</b>. A different kind can still be stacked on.</dd>
              <dt>Reactive</dt><dd><b>Only the winner of the previous trick</b> may play one card to change the conditions before leading. Nobody can use it on trick 1.</dd>
              <dt>Trick track</dt><dd>The strip of 15 slots below the table, showing planted cards and the winner of each trick.</dd>
              <dt>Round</dt><dd>One deal through 15 tricks. Choose 1 to 4 per match; at 4 every player leads off once.</dd>
              <dt>P1</dt><dd>The first player of the round. Leads trick 1 and anchors the draft and plant order. Passes on each round.</dd>
            </dl>
`
}

const T = () => I18N[LANG];

function suitGlyph(s, size, opacity=1, fill){
  return `<g transform="scale(${size/70})" opacity="${opacity}">${SUIT_SHAPE[s].replace(/FILL/g, fill||`var(${SUIT_VAR[s]})`)}</g>`;
}
/* プレイカード：黒枠（カード幅の10%）＋元素色を暗く沈めた地＋大きな白い数字（四隅）＋中央に元素図柄 */
function cardSVG(c, w=64, cls=''){
  const h = Math.round(w*1.42);
  const col = `var(${SUIT_VAR[c.s]})`;
  const bg  = `var(${SUIT_VAR[c.s]}d)`;
  // 2 桁は幅を詰めて、左右の数字が離れるようにする
  const fit = c.r>=10 ? ' textLength="18" lengthAdjust="spacingAndGlyphs"' : '';
  const num = (x,anchor)=>`<text x="${x}" y="24" font-family="var(--sans)" font-size="19" font-weight="700" fill="#fff" text-anchor="${anchor}"${fit}>${c.r}</text>`;
  const top = num(7.5,'start') + num(56.5,'end');
  return `<svg class="svgcard ${cls}" width="${w}" height="${h}" viewBox="0 0 64 91" style="color:${col}">
    <rect x="0" y="0" width="64" height="91" rx="4.5" fill="#111"/>
    <rect x="6.4" y="6.4" width="51.2" height="78.2" rx="1.5" fill="${bg}"/>
    ${top}
    <g transform="rotate(180 32 45.5)">${top}</g>
    <g transform="translate(19.5,33)">${suitGlyph(c.s,25)}</g>
  </svg>`;
}
function backSVG(w=34){
  const h = Math.round(w*1.42);
  return `<svg class="cardback" width="${w}" height="${h}" viewBox="0 0 34 48">
    <rect x="0.5" y="0.5" width="33" height="47" rx="3" fill="#2C3E52" stroke="#1B2836"/>
    <defs><pattern id="asa" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#2C3E52"/>
      <path d="M0 4 H8 M4 0 V8" stroke="#3A5068" stroke-width="1"/>
    </pattern></defs>
    <rect x="3" y="3" width="28" height="42" rx="2" fill="url(#asa)" stroke="#3A5068" stroke-width="0.6"/>
  </svg>`;
}

function condSVG(c, w=66, cls='', selCls=''){
  const isR = c.axis==='R';
  const key = c.dur==='PERSIST' ? 'P' : 'T';
  const src = isR ? TILE_IMG.R[key] : TILE_IMG.S[c.suit][key];
  const sz  = isR ? Math.round(w*0.8) : w;
  return `<div class="condwrap ${selCls}" data-cid="${c.id}"><img class="condsvg ${isR?'tile-s':'tile-c'} ${cls}" src="${src}" width="${sz}" height="${sz}" alt="${condName(c)}" draggable="false"></div>`;
}
function miniChip(c){
  const col = c.axis==='R' ? 'var(--verdigris)' : `var(${SUIT_VAR[c.suit]})`;
  const st = c.dur==='PERSIST'
    ? `background:${col};color:#101720;border-color:${col};font-weight:700`
    : `background:rgba(12,18,26,.6);color:${col};border-color:${col}`;
  return `<span class="mini" style="${st}">${condLabel(c)}<span class="du">${durLabel(c)}</span></span>`;
}

const SCORE_T = {0:[10,7,5],1:[8,5,3],2:[6,3,2],3:[5,2,1],4:[5,2,1],
                 5:[6,3,2],6:[7,4,3],7:[8,5,3],8:[10,7,5],9:[12,9,6]};
function scoreOf(bid, won){
  const t = (NPLAYER===3) ? (bid>=12 ? SCORE_3[12] : SCORE_3[bid])
                          : (bid>=9  ? SCORE_T[9]  : SCORE_T[bid]);
  const d = Math.abs(bid-won);
  return d===0 ? t[0] : d===1 ? t[1] : d===2 ? t[2] : 0;
}

// AI の思考速度（1=最速／2=普通／3.2=ゆっくり）

function readSpeed(){
  const el=document.getElementById('speed');
  const base = el ? parseFloat(el.value) : 0.75;
  SPD  = base;
  // プレイ系（PSPD）は SPD とは別軸。
  //   高速時 1.25 → 新デフォルト 1.875（1.5倍）
  //   じっくり時 1.625 → 2.4375（1.5倍）
  //   ゆっくり（新規）→ 高速の3倍 = 3.75
  if(base===2.925)      PSPD = 3.75;    // ゆっくり
  else if(base===0.75)  PSPD = 1.875;   // 高速（新デフォルト）
  else                   PSPD = 2.4375; // じっくり
  // CSS 側の動きの速さも同じ比率で連動させる（出札の登場アニメーションは対象外のまま固定）。
  // PSPD は「高速=1」を基準にした相対値ではないため、高速時を 1 とした比率に正規化する。
  document.documentElement.style.setProperty('--anim-scale', (PSPD/1.875).toFixed(4));
}
