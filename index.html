/* ═══════════════════════════════════════════════════════
   ルール判定
   ═══════════════════════════════════════════════════════ */
function resolveTrick(cards, leadSuit, rankVal, trumpVal){
  const stronger = rankVal==='N' ? ((a,b)=>a>b) : ((a,b)=>a<b);
  let cand;
  if(trumpVal!==null && cards.some(e=>e.card.s===trumpVal))
       cand = cards.filter(e=>e.card.s===trumpVal);
  else cand = cards.filter(e=>e.card.s===leadSuit);
  let best = cand[0];
  for(const e of cand) if(stronger(e.card.r,best.card.r)) best=e;
  return best;
}
function legalMoves(hand, leadSuit){
  if(leadSuit===null) return hand.slice();
  const f = hand.filter(c=>c.s===leadSuit);
  return f.length ? f : hand.slice();
}
/* 宣言的モデル：カードは「状態の指定」であり、現在値を参照しない。
   反理力カードが置かれれば、直前が何であれ結果は必ず反理力。
   置き場からカードが除かれたときはデフォルト（正理力／元素活性なし）に戻る。 */
function applyTo(ax, c){
  ax.holder=c; ax.dur=c.dur;
  if(c.axis==='R') ax.value = 'R';
  else ax.value = c.suit;
}
function applyCond(c){ applyTo(c.axis==='R'?G.rank:G.trump, c); }
/* 1T 効果の除去演出。
   「除去されて下のデフォルト状態が現れる」ことを、剥がれるアニメーションと文字で示す。
   持続に上書きされていた場合も、戻り先は必ずデフォルト（付録の確認より）。 */
async function cleanupTrick(){
  const goneR = G.rank.dur==='TEMP';
  const goneT = G.trump.dur==='TEMP';
  if(!goneR && !goneT) return;         // 1T が無ければ何もしない

  const t=T();
  const msgs=[];
  if(goneR) msgs.push(t.cleanupNote(t.bnRank));
  if(goneT) msgs.push(t.cleanupNote(t.bnTrump));
  G.cleanupMsg = msgs.join('　／　');
  render();                              // まずメッセージだけを反映して描画を確定させる
  await sleep(30);                       // DOM 確定を1フレーム待つ
  const lens=document.getElementById('lens');
  if(lens){
    if(goneR){ const o=lens.querySelector('.rankstack .overlay'); if(o) o.classList.add('peel'); }
    if(goneT){ const o=lens.querySelector('.trumpstack .overlay'); if(o) o.classList.add('peel'); }
  }
  await pthink(650);

  // デフォルトへ戻した状態を見せたうえで、「閉じる」を押すまで保持する
  if(goneR){G.rank.value='N';G.rank.holder=null;G.rank.dur=null;}
  if(goneT){G.trump.value=null;G.trump.holder=null;G.trump.dur=null;}
  G.cleanupClose = true;
  showPrompt(()=>setPrompt(T().qCleanup, T().hResolveClose));
  render();
  await waitHuman(); PROMPT_REDRAW=null;

  G.cleanupClose = false;
  G.cleanupMsg = null;
  render(); await sleep(60);
}
// 布石保護（D-2 両軸）：そのトリックに同一軸の布石があれば出せない
function blockedAxis(ax, t){
  if(!G) return false;
  return G.track[t].some(x=>x.axis===ax);
}

/* ═══════════════════════════════════════════════════════
   評価ヘルパ
   ═══════════════════════════════════════════════════════ */
function unseenFor(p){
  const mine=new Set(G.hands[p].map(c=>c.s*100+c.r));
  const gone=new Set(G.played.map(c=>c.s*100+c.r));
  const out=[];
  for(let s=0;s<4;s++)for(let r=1;r<=NRANK;r++){
    const k=s*100+r; if(!mine.has(k)&&!gone.has(k)) out.push({s,r});
  }
  return out;
}
function handStrength(hand, uns, rankVal, trumpVal){
  if(!hand.length) return 0;
  const stronger = rankVal==='N'?((a,b)=>a>b):((a,b)=>a<b);
  let sum=0;
  for(const c of hand){
    const same=uns.filter(u=>u.s===c.s);
    let base=same.length?same.filter(u=>stronger(c.r,u.r)).length/same.length:1;
    if(trumpVal!==null) base = (c.s===trumpVal)? 0.55+0.45*base : base*0.55;
    sum+=base;
  }
  return sum/hand.length;
}
function takesNow(card, tc, leadSuit, rv, tv){
  return resolveTrick(tc.concat([{player:-1,card}]), leadSuit, rv, tv).player===-1;
}
function survive(card, tc, leadSuit, rv, tv, uns, remain){
  if(remain<=0) return 1;
  let th=0;
  for(const u of uns)
    if(resolveTrick(tc.concat([{player:-1,card},{player:-2,card:u}]),leadSuit,rv,tv).player===-2) th++;
  const q=uns.length?1-th/uns.length:1;
  return Math.pow(Math.max(0,q),remain);
}
const extremity=c=>Math.max(c.r,NRANK+1-c.r);
function keepValue(c,tv){ return extremity(c)+(tv!==null&&c.s===tv?6:0); }

/* ═══════════════════════════════════════════════════════
   AI：プレイ（宣言を狙う）
   ═══════════════════════════════════════════════════════ */
function aiPlay(p){
  const leadSuit=G.trickCards.length?G.trickCards[0].card.s:null;
  const legal=legalMoves(G.hands[p],leadSuit);
  if(legal.length===1) return legal[0];
  const uns=unseenFor(p);
  const remain=NPLAYER-1-G.trickCards.length;
  const rv=G.rank.value, tv=G.trump.value;
  const wantWin = G.bids[p]===null ? true : (G.tricksWon[p] < G.bids[p]);

  const sc=legal.map(c=>{
    const ls=leadSuit===null?c.s:leadSuit;
    const takes=takesNow(c,G.trickCards,ls,rv,tv);
    const pw=takes?survive(c,G.trickCards,ls,rv,tv,uns,remain):0;
    return {c,pw,keep:keepValue(c,tv)};
  });
  if(wantWin){
    const w=sc.filter(x=>x.pw>0.45);
    if(w.length){ w.sort((a,b)=>a.keep-b.keep||b.pw-a.pw); return w[0].c; }
    sc.sort((a,b)=>a.keep-b.keep); return sc[0].c;
  }else{
    sc.sort((a,b)=>a.pw-b.pw||b.keep-a.keep);
    return sc[0].c;
  }
}

/* ═══════════════════════════════════════════════════════
   AI：応変魔術（宣言＋妨害）
   ═══════════════════════════════════════════════════════ */
function aiOffer(p){
  if(G.spent[p]>=MAXFIRE()) return null;
  const res=G.reserve[p].filter(c=>!blockedAxis(c.axis,G.trickNo));
  if(!res.length) return null;
  const uns=unseenFor(p);
  const remainT=NTRICK+1-G.trickNo;

  // 布石は必ず発動する前提の基準
  const proj={rank:{...G.rank},trump:{...G.trump}};
  for(const c of G.track[G.trickNo]) applyTo(c.axis==='R'?proj.rank:proj.trump,c);
  const base=handStrength(G.hands[p],uns,proj.rank.value,proj.trump.value);

  const myNeed = G.bids[p]===null ? 99 : G.bids[p]-G.tricksWon[p];
  const wantWin = myNeed>0;

  // 他家の切迫度
  const vuln=[0,0,0,0], nq=[0,0,0,0], onTrack=[0,0,0,0];
  for(let q=0;q<NPLAYER;q++){
    if(q===p||G.bids[q]===null) continue;
    nq[q]=G.bids[q]-G.tricksWon[q];
    if(nq[q]<0) vuln[q]=1;
    else{
      const sl=Math.min(nq[q],remainT-nq[q]);
      vuln[q]=1-Math.min(1,sl/Math.max(1,remainT/2));
    }
    onTrack[q]=G.tricksWon[q]-G.bids[q]*(G.trickNo-1)/NTRICK;
  }

  let best=null,bg=-1;
  for(const c of res){
    const p2={rank:{...proj.rank},trump:{...proj.trump}};
    applyTo(c.axis==='R'?p2.rank:p2.trump,c);
    let gain=handStrength(G.hands[p],uns,p2.rank.value,p2.trump.value)-base;
    if(!wantWin) gain=-gain;
    if(c.dur==='PERSIST') gain*=(1+Math.min(remainT,8)/12);

    // 妨害
    let sab=0;
    for(let q=0;q<NPLAYER;q++){
      if(q===p||G.bids[q]===null) continue;
      if(c.axis==='T'){
        if(G.voids && G.voids[q][c.suit]) sab += (nq[q]>0? 0.55 : -0.55);
        else if(nq[q]<=0) sab += 0.18;
      }else{
        sab += (onTrack[q]>=0 ? 0.32 : -0.12);
      }
      sab += vuln[q]*0.22;
    }
    gain += sab*0.045;

    const idx=orderFrom(G.lead).indexOf(p);
    gain*=(c.axis==='T'?[1,.9,.82,.74][idx]:[1,.95,.92,.88][idx]);
    if(gain>bg){bg=gain;best=c;}
  }
  const th=0.055*(remainT/15)+0.012;
  return bg>th?best:null;
}

/* ═══════════════════════════════════════════════════════
   AI：ドラフト・布石
   ═══════════════════════════════════════════════════════ */
function aiDraft(p){
  const hand=G.hands[p];
  const byS=[0,1,2,3].map(s=>hand.filter(c=>c.s===s));
  const lows=[0,1,2,3].reduce((a,s)=>a+Math.max(0,byS[s].filter(c=>c.r<=5).length-1),0);
  const vd=s=>[0,1,2,3].filter(y=>y!==s).reduce((a,y)=>a+Math.max(0,3-byS[y].length),0)/9;
  let best=null,bv=-1e9;
  for(const c of G.pool){
    let v=c.axis==='R'?lows*1.15+0.6:byS[c.suit].length*(0.6+vd(c.suit)*2.2);
    v*=(c.dur==='PERSIST')?1.9:1.0; v+=Math.random()*0.5;
    if(v>bv){bv=v;best=c;}
  }
  return best;
}
function condDelta(p,c){
  const uns=unseenFor(p);
  const cur=handStrength(G.hands[p],uns,G.rank.value,G.trump.value);
  let rv=G.rank.value,tv=G.trump.value;
  if(c.axis==='R') rv='R'; else tv=c.suit;   // 反理力カードは常に反理力を指定する
  return handStrength(G.hands[p],uns,rv,tv)-cur;
}
function takenBids(){
  return new Set(allP().filter(q=>G.bids[q]!==null).map(q=>G.bids[q]));
}
/* ═══════════════════════════════════════════════════════
   AI：見積もり方式（ルール草案 付録 O-2 に準拠）
   ・確勝札の計数を「正」「反」の両方で行う
   ・布石・手元の操作カードから切り札／反理力の効きを加味
   ・既宣言の合計から、自分と未宣言者で分け合う残りを加味
   ・生の見積もりは実測回帰で較正（AI_CAL：人数別）
   ═══════════════════════════════════════════════════════ */
function aiFeatures(p){
  const hand=G.hands[p];
  const byS=[0,1,2,3].map(s=>hand.filter(c=>c.s===s));
  const avgLen=NTRICK/4;
  let sN=0,sR=0,softN=0,softR=0,voids=0,shorts=0,longx=0;
  for(let s=0;s<4;s++){
    const rs=new Set(byS[s].map(c=>c.r));
    for(let r=NRANK;r>=1&&rs.has(r);r--) sN++;     // 正：上が残っていない札
    for(let r=1;r<=NRANK&&rs.has(r);r++) sR++;     // 反：下が残っていない札
    for(const c of byS[s]){
      let oa=0,ob=0;
      for(let r=c.r+1;r<=NRANK;r++) if(!rs.has(r)) oa++;
      for(let r=1;r<c.r;r++)        if(!rs.has(r)) ob++;
      softN+=Math.max(0,1-oa/4); softR+=Math.max(0,1-ob/4);
    }
    const n=byS[s].length;
    if(n===0) voids++; else if(n<=2) shorts++;
    if(n>avgLen) longx+=n-avgLen;
  }
  // 反理力の見込み：布石（公開）と自分の手元
  let rCnt=0, trk=0, own=0;
  for(let t=1;t<=NTRICK;t++) for(const c of G.track[t]){
    const w=c.dur==='PERSIST'?1:0.35;
    if(c.axis==='R') rCnt+=w; else trk+=w*byS[c.suit].length;
  }
  for(const c of G.reserve[p]){
    const w=c.dur==='PERSIST'?1:0.35;
    if(c.axis==='R') rCnt+=w*0.6; else own=Math.max(own,w*byS[c.suit].length);
  }
  // 総和の加味：残りを未宣言者（自分を含む）で割った値と平均との差
  const decl=allP().filter(q=>G.bids[q]!==null&&q!==p);
  const k=NPLAYER-decl.length;
  const rem=NTRICK-decl.reduce((a,q)=>a+G.bids[q],0);
  const sumAdj=rem/k-NTRICK/NPLAYER;
  const best=Math.max(softN,softR);
  return [sN,sR,softN,softR,best,softN*rCnt,softR*rCnt,voids,shorts,longx,trk,own,sumAdj];
}
// 較正値：現行ルールで全席この AI を回し、実際の取得数を特徴量に回帰した結果（4人・3人それぞれ）
let AI_CAL={

     resid:[-3.04,-2.45,-2.07,-1.84,-1.66,-1.53,-1.44,-1.35,-1.25,-1.16,-1.07,-0.98,-0.90,-0.80,-0.69,-0.56,-0.46,-0.36,-0.26,-0.17,-0.07,0.02,0.10,0.20,0.34,0.44,0.54,0.67,0.77,0.88,1.01,1.13,1.29,1.52,1.72,1.94,2.21,2.53,2.97,3.61]}

function aiEstimate(p){
  const cal=AI_CAL[NPLAYER], f=aiFeatures(p);
  let e=cal.b0;
  if(cal.w) for(let i=0;i<f.length;i++) e+=cal.w[i]*f[i];
  return e;
}
function aiBid(p){
  const cal=AI_CAL[NPLAYER];
  const est=aiEstimate(p);
  // 見積もりの誤差分布（実測の残差）から、取得数の確率を作る
  const P=new Array(NTRICK+1).fill(0);
  for(const r of cal.resid){
    const k=Math.max(0,Math.min(NTRICK,Math.round(est+r)));
    P[k]+=1/cal.resid.length;
  }
  const taken=takenBids();
  let bb=null,be=-1;
  for(let b=0;b<=BIDMAX();b++){
    if(taken.has(b)) continue;                 // 排他ビッド
    let ev=0; for(let k=0;k<=NTRICK;k++) if(P[k]) ev+=P[k]*scoreOf(b,k);
    if(ev>be){be=ev;bb=b;}
  }
  return bb;
}
/* 布石：確勝札が多ければ先行型（持続を序盤 10〜40% に）、
   ヴォイド・長スートがあれば追込型（持続を 60〜85% に）。1T は中盤以降。 */
function aiPlace(p){
  const held=G.held[p];
  const sc=held.map(c=>({c,v:condDelta(p,c)*(c.dur==='PERSIST'?1.8:1)}));
  sc.sort((a,b)=>b.v-a.v);
  const pick=sc.length>1?sc[1].c:sc[0].c;          // 最良の1枚は手元に残す
  const f=aiFeatures(p);
  const strength=f[4], chase=f[7]+f[9]*0.5;
  let lo,hi;
  if(pick.dur==='PERSIST'){
    if(strength>=chase){ lo=Math.ceil(NTRICK*0.10); hi=Math.floor(NTRICK*0.40); }
    else               { lo=Math.ceil(NTRICK*0.60); hi=Math.floor(NTRICK*0.85); }
  }else{ lo=Math.ceil(NTRICK*0.55); hi=Math.floor(NTRICK*0.93); }
  lo=Math.max(1,lo);
  const cands=[];
  for(let t=lo;t<=hi;t++) if(!G.track[t].some(x=>x.axis===pick.axis)) cands.push(t);
  if(!cands.length) for(let t=1;t<=NTRICK;t++) if(!G.track[t].some(x=>x.axis===pick.axis)) cands.push(t);
  return {card:pick, slot:cands[Math.floor(Math.random()*cands.length)]};
}

async function runDeal(){
  {
    const t=T(), o=orderFrom(G.p1);
    await phaseDialog(
      t.phStartT.replace('{n}', M.deal),
      t.phStartM.replace('{p}', NAMES[G.p1]),
      t.phStartS,
      [
        {label:t.ordDraft, seq:o, note:(typeof t.ordDraftN==='function'?t.ordDraftN():t.ordDraftN)},
        {label:t.ordPlace, seq:o},
        {label:t.ordBid,   seq:o.slice().reverse(), note:t.ordBidN},
        {label:t.ordLead,  seq:o, note:t.ordLeadN, lead:true}
      ], true);
  }
  await doDraft();
  await doPlacement();
  await doBid();
  G.voids=allP().map(()=>[0,0,0,0]);
  for(let t=1;t<=NTRICK;t++){
    G.trickNo=t; render();
    await doReactive();
    await doPlay();
    await doResolve();
    await cleanupTrick();
    G.trickCards=[]; G.winnerThisTrick=null; G.rankFresh=false; G.trumpFresh=false;
    render();
  }
  endDeal();
}

async function doDraft(){
  G.phase='draft';
  const r1=orderFrom(G.p1);
  let seq=[];                            // 直列（ルール草案 v2.5 §5）
  for(let k=0;k<NHELD();k++) seq=seq.concat(r1);   // 4人=3巡 / 3人=4巡
  {
    const t=T();
    await phaseDialog(t.phDraftT, (typeof t.phDraftM==='function'?t.phDraftM():t.phDraftM), t.phDraftS, [{seq:r1}]);
  }
  G.acts=allP().map(()=>'');
  for(const p of seq){
    G.order = r1;
    G.turn=p; render();
    let c;
    if(p===HUMAN){
      const n=12-G.pool.length+1;
      showPrompt(()=>{ setPrompt(T().qDraft, T().hDraft(n)); renderPool(); });
      c=await waitHuman(); PROMPT_REDRAW=null;
    }else{ await think(220); c=aiDraft(p); }
    if(!c) return;                              // 世代が変わっていれば中断
    G.pool=G.pool.filter(x=>x.id!==c.id);
    G.held[p].push(c);
    log(T().lDraftGot(NAMES[p], condName(c)), p===HUMAN?'hl':'');
    G.acts[p]=T().aGot(condName(c));
    G.turn=null; render();
    await seatToast(p, T().tGot(condName(c)), 900);
  }
  clearToasts(); G.turn=null; G.acts=allP().map(()=>'');
}

async function doPlacement(){
  G.phase='place';
  logT(T().lPlacePhase);
  {
    const t=T();
    await phaseDialog(t.phPlaceT, (typeof t.phPlaceM==='function'?t.phPlaceM():t.phPlaceM), (typeof t.phPlaceS==='function'?t.phPlaceS():t.phPlaceS),
      [{label:t.phOrderLbl, seq:orderFrom(G.p1)}],
      (typeof t.phPlaceFlow==='function')?t.phPlaceFlow():true);
  }
  G.order=orderFrom(G.p1); G.acts=allP().map(()=>'');
  for(const p of G.order){
    G.turn=p; render();
    if(p===HUMAN){
      let chosen=null;
      while(true){
        G.placePick = chosen;        // 選択待ちのスロットを盤面に示すため描画側へ渡す
        showPrompt(()=>{
          setPrompt(T().qPlace, chosen ? T().hPlace2(condName(chosen)) : T().hPlace1);
          renderPlacePick(chosen);
        });
        render();
        const v=await waitHuman(); PROMPT_REDRAW=null;
        if(v.kind==='cond'){chosen=v.card;continue;}
        if(v.kind==='slot'&&chosen){
          if(G.track[v.slot].some(x=>x.axis===chosen.axis)) continue;
          G.track[v.slot].push(chosen); G.placedBy[chosen.id]=p;
          G.held[p]=G.held[p].filter(x=>x.id!==chosen.id);
          G.reserve[p]=G.held[p].slice();
          log(T().lPlant(NAMES[p], v.slot, condName(chosen)),'hl');
          G.acts[p]=T().aPlant(v.slot, condName(chosen));
          G.placePick=null;
          G.turn=null; render();
          await seatToast(p, T().tPlant(v.slot, condName(chosen)), 1800);
          break;
        }
      }
    }else{
      await think(250);
      const {card,slot}=aiPlace(p);
      G.track[slot].push(card); G.placedBy[card.id]=p;
      G.held[p]=G.held[p].filter(x=>x.id!==card.id);
      G.reserve[p]=G.held[p].slice();
      log(T().lPlant(NAMES[p], slot, condName(card)));
      G.acts[p]=T().aPlant(slot, condName(card));
      G.turn=null; render();
      await seatToast(p, T().tPlant(slot, condName(card)), 1800);
    }
  }
  clearToasts(); G.turn=null;
}

async function doBid(){
  G.phase='bid';
  logT(T().lBidPhase);
  const ord=orderFrom(G.p1).slice().reverse();   // P4→P1
  {
    const t=T();
    await phaseDialog(t.phBidT, t.phBidM, t.phBidS, [{label:t.phOrderLbl, seq:ord}]);
  }
  G.order=ord; G.acts=allP().map(()=>'');
  for(const p of ord){
    G.turn=p; render();
    if(p===HUMAN){
      const done=ord.filter(q=>G.bids[q]!==null);
      const sum=done.reduce((a,q)=>a+G.bids[q],0);
      const left=ord.filter(q=>G.bids[q]===null).length-1;
      showPrompt(()=>{ setPrompt(T().qBid, T().hBid(left)); renderBidPick(done, sum); });
      const v=await waitHuman(); PROMPT_REDRAW=null;
      G.bids[p]=v.bid;
    }else{
      setPrompt(T().aiThinking,'');
      await sleep(40);
      G.bids[p]=aiBid(p);
      await think(260);
    }
    log(T().lBid(NAMES[p], G.bids[p]), p===HUMAN?'hl':'');
    tick(T().tkBid(NAMES[p], G.bids[p]));
    G.acts[p]=T().aBid(G.bids[p]);
    G.turn=null; render();
    await seatToast(p, T().tBid(G.bids[p]), 1600);
  }
  clearToasts(); G.turn=null;
  const tot=G.bids.reduce((a,b)=>a+b,0);
  logT(T().lBidSum(tot, tot-15));
}

async function doReactive(){
  G.phase='reactive';
  logT(T().lTrick(G.trickNo, NAMES[G.lead]));
  const offers={};
  // Ver2：応変を使えるのは「前トリックの勝者」＝現在のリードのみ。
  // 第1トリックは前トリックが存在しないため、誰も使えない。
  const actor = (G.trickNo>1) ? G.lead : null;
  // 「出さない」フキダシは、出せる状態で見送ったときだけ意味を持つ。
  // 撃ち切り済み・手元が空・布石で全軸が塞がれている場合は選択の余地がないので出さない。
  const couldOffer = actor!==null
    && G.spent[actor] < MAXFIRE()
    && G.reserve[actor].some(c=>!blockedAxis(c.axis, G.trickNo));
  if(actor!==null && actor!==HUMAN){
    const c=aiOffer(actor); if(c) offers[actor]=c;
    await pthink(160);
  }else if(actor===HUMAN){
    const open=G.reserve[HUMAN].filter(c=>!blockedAxis(c.axis,G.trickNo));
    if(G.spent[HUMAN]<MAXFIRE()&&open.length){
      showPrompt(()=>{ setPrompt(T().qReact, T().hReact); renderReactivePop(); });
      const v=await waitHuman(); PROMPT_REDRAW=null;
      clearReactivePop();
      if(v.kind==='cond') offers[HUMAN]=v.card;
    }else{ await pthink(160); }
  }

  const placedHere = G.track[G.trickNo].slice();
  const offerList  = orderFrom(G.lead).filter(p=>offers[p]).map(p=>({p,card:offers[p]}));
  G.order=orderFrom(G.lead); G.turn=null;
  G.acts=allP().map(()=>'');
  for(const {p,card:c} of offerList) G.acts[p]=T().aOffer(condName(c));

  // 何も起きないトリックは素通り
  if(!placedHere.length && !offerList.length){
    G.offerShow=null; G.changeBanner=null; G.explain=null; G.bubbles=null; G.leadGlow=null;
    render(); await sleep(100); return;
  }

  clearToasts();

  // ① Ver2：使えるのは 1 人だけなので、その人のフキダシだけを出す
  const bub=[];
  for(const c of placedHere){
    bub.push({pos:'c', who:T().obPlant, card:c, st:'', col:'var(--warn)'});
  }
  {
    const o = actor!==null ? offerList.find(x=>x.p===actor) : null;
    if(o || couldOffer){
      bub.push({pos:POS[actor], who:SHORT[actor], card:o?o.card:null,
                st:o?'':'pass', col:o?PCOL[actor]:null, p:actor});
    }
  }
  G.bubbles=bub; G.leadGlow=null;
  setPrompt(T().qResolve, T().hResolveShow);
  render();
  await pthink(offerList.length ? 1400 : 900);

  // ② 布石による保護の有無を判定し、発動／不発を表示
  const claimed={};
  for(const c of placedHere){
    claimed[c.axis]=c;
    log(T().lPlantFire(condName(c)),'ev');
  }
  // Ver2：応変は 1 枚しか出ないため競合は起こらない。
  // 布石のある軸に出そうとした場合のみ弾かれる（保護）。
  for(const {p,card:c} of offerList){
    const bb = G.bubbles.find(x=>x.p===p);
    if(blockedAxis(c.axis,G.trickNo)){
      if(bb){ bb.st='lose'; bb.tag=T().obBlocked; }
      G.acts[p]=T().aLost(condName(c));
      log(T().lLost(NAMES[p], condName(c)));
      continue;
    }
    claimed[c.axis]=c;
    G.reserve[p]=G.reserve[p].filter(x=>x.id!==c.id);
    G.spent[p]=(G.spent[p]||0)+1;
    if(bb){ bb.st='win'; bb.tag=T().obFire; }
    G.acts[p]=T().aFired(condName(c));
    log(T().lFire(NAMES[p], condName(c)),'ev');
  }
  render();
  await pthink(offerList.length ? 900 : 600);

  // ③ 適用し、状態の変化を明示
  const before = {r:G.rank.value, t:G.trump.value, rDur:G.rank.dur, tDur:G.trump.dur};
  G.track[G.trickNo]=[];
  const plantedIds = new Set(placedHere.map(c=>c.id));
  await flyToLens(claimed, plantedIds);
  G.rankFresh = !!claimed.R; G.trumpFresh = !!claimed.T;
  for(const ax of ['R','T']) if(claimed[ax]) applyCond(claimed[ax]);
  const after = {r:G.rank.value, t:G.trump.value};

  const parts=[];
  const noteR = (claimed.R && before.rDur==='PERSIST')
    ? `<div class="ovr">${T().ovrNote(T().bnRank)}</div>` : '';
  const noteT = (claimed.T && before.tDur==='PERSIST')
    ? `<div class="ovr">${T().ovrNote(T().bnTrump)}</div>` : '';
  if(before.r!==after.r)
    parts.push(`<span>${T().bnRank}</span><span class="arrow">${before.r==='N'?T().kanjiHigh:T().kanjiLow} →</span><span class="to" style="color:${after.r==='N'?'var(--brass)':'var(--verdigris)'}">${after.r==='N'?T().bnHigh:T().bnLow}</span>${noteR}`);
  if(before.t!==after.t)
    parts.push(`<span>${T().bnTrump}</span><span class="arrow">${before.t===null?T().bnNone:SUIT_SYM[before.t]} →</span><span class="to" style="color:${after.t===null?'var(--dim)':`var(${SUIT_VAR[after.t]})`}">${after.t===null?T().bnNone:SUIT_SYM[after.t]}</span>${noteT}`);
  // 実効値は変わらなくても、持続が 1T に奪われた場合は明示する
  if(before.r===after.r && claimed.R && before.rDur==='PERSIST')
    parts.push(`<span>${T().bnRank}</span><span class="to" style="color:var(--muted)">${T().ovrSame}</span>${noteR}`);
  if(before.t===after.t && claimed.T && before.tDur==='PERSIST')
    parts.push(`<span>${T().bnTrump}</span><span class="to" style="color:var(--muted)">${T().ovrSame}</span>${noteT}`);

  if(parts.length){
    G.changeBanner = parts.join('　／　');
    tick(T().tkChange(parts.map(x=>x.replace(/<[^>]+>/g,'')).join(' ／ ')));
  }else if(claimed.R || claimed.T){
    G.changeBanner = T().bnSame;
    tick(T().tkNoChange);
  }

  // 状況説明を組み立てる
  const axName=T().axName;
  const lines=[];
  const withCard=(G.bubbles||[]).filter(o=>o.card);
  const usedAx=[...new Set(withCard.map(o=>o.card.axis))];
  if(usedAx.length>=2){
    lines.push(T().explBoth);
  }
  for(const ax of ['R','T']){
    const inAx=withCard.filter(o=>o.card.axis===ax);
    if(!inAx.length) continue;
    const placed=inAx.find(o=>o.pos==='c');
    const win=inAx.find(o=>o.st==='win');
    const lost=inAx.filter(o=>o.st==='lose');
    if(placed && lost.length){
      lines.push(T().explLocked(axName[ax], condName(placed.card)));
    }else if(placed){
      lines.push(T().explPlanted(axName[ax], condName(placed.card)));
    }else if(win){
      lines.push(T().explWin(axName[ax], win.who, condName(win.card)));
    }
  }
  if(!parts.length && (claimed.R||claimed.T)){
    lines.push(T().explNoChange);
  }
  G.explain = lines.join('<br>');

  // ④ プレイヤーが「閉じる」を押すまで表示を保持
  G.showClose = true;
  showPrompt(()=>setPrompt(T().qResolve, T().hResolveClose));
  render();
  await waitHuman(); PROMPT_REDRAW=null;

  G.showClose=false; G.offerShow=null; G.changeBanner=null; G.explain=null;
  G.bubbles=null; G.leadGlow=null;
  render(); await sleep(100);
}

async function doPlay(){
  G.phase='play';
  G.trickCards=[];
  G.order=orderFrom(G.lead); G.acts=allP().map(()=>'');
  for(const p of G.order){
    G.turn=p; render();
    let card;
    if(p===HUMAN){
      const ls=G.trickCards.length?G.trickCards[0].card.s:null;
      const need=G.bids[HUMAN]-G.tricksWon[HUMAN];
      const stx = need>0 ? T().needMore(need) : need===0 ? T().needZero : T().needOver(-need);
      showPrompt(()=>setPrompt(T().qPlay,
        T().hPlayBid(G.bids[HUMAN], G.tricksWon[HUMAN], stx) +
        (ls===null ? T().hPlayLead : T().hPlayFollow(SUIT_SYM[ls]))));
      card=await waitHuman(); PROMPT_REDRAW=null;
    }else{ await pthink(400); card=aiPlay(p); }
    if(G.trickCards.length && card.s!==G.trickCards[0].card.s) G.voids[p][G.trickCards[0].card.s]=1;
    G.hands[p]=G.hands[p].filter(c=>!(c.s===card.s&&c.r===card.r));
    G.played.push(card);
    G.trickCards.push({player:p,card,fresh:true});
    G.acts[p]=T().aPlay(SUIT_SYM[card.s]+card.r);
    G.turn=null; render();
  }
}


/* 布石・応変フキダシ の位置から、レンズ（状態エリア）へ飛ぶ演出。
   claimed[ax] のカードが実際にどのバブルから来たかを見つけ、その座標から飛ばす。 */
async function flyToLens(claimed, plantedIds){
  const cen=document.getElementById('center');
  const lens=document.getElementById('lens');
  if(!cen||!lens) return;
  const lr=lens.getBoundingClientRect();
  const flights=[];
  for(const ax of ['R','T']){
    const c=claimed[ax]; if(!c) continue;
    const isPlant = plantedIds && plantedIds.has(c.id);
    let box=null;
    if(isPlant){
      // 布石由来：発動元はトラックのマス
      const slotEl=document.querySelector(`.slot[data-slot="${G.trickNo}"]`);
      box = slotEl;   // マス全体を発射点にする
    }else{
      // 応変由来：発動元はフキダシ
      if(!G.bubbles) continue;
      const bub=G.bubbles.find(b=>b.card && b.card.id===c.id);
      if(!bub) continue;
      const el=[...cen.querySelectorAll('.obub')].find(e=>e.className.includes(bub.pos==='c'?'at-c':'at-'+bub.pos));
      if(!el) continue;
      box=el.querySelector('.bx');
    }
    if(!box) continue;
    const br=box.getBoundingClientRect();
    const fly=document.createElement('div');
    fly.className='lensfly';
    fly.style.left=(br.left+br.width/2)+'px';
    fly.style.top=(br.top+br.height/2)+'px';
    fly.innerHTML=condSVG(c,26);
    document.body.appendChild(fly);
    flights.push(fly);
    requestAnimationFrame(()=>{
      fly.style.transform=`translate(${lr.left+lr.width/2-(br.left+br.width/2)}px, ${lr.top+lr.height/2-(br.top+br.height/2)}px) scale(0.55)`;
      fly.style.opacity='0.15';
    });
  }
  if(flights.length){
    await pthink(420);
    flights.forEach(f=>f.remove());
  }
}

async function doResolve(){
  const ls=G.trickCards[0].card.s;
  const w=resolveTrick(G.trickCards,ls,G.rank.value,G.trump.value);
  G.tricksWon[w.player]++;
  G.slotWinner[G.trickNo]=w.player;
  G.winnerThisTrick=w.player;
  G.lead=w.player;
  log(T().lWin(G.trickNo, NAMES[w.player], SUIT_SYM[w.card.s]+w.card.r), w.player===HUMAN?'hl':'');
  tick(T().tkWin(G.trickNo, NAMES[w.player]));

  // ① どの札が勝ったかを見せる（勝ち札を持ち上げ、他を沈める）
  render();
  {
    const cen=document.getElementById('center');
    if(cen) cen.querySelectorAll('.played').forEach(el=>{
      if(!el.classList.contains('winner')) el.classList.add('loser');
    });
  }
  await pthink(320);

  // ② 勝者が誰かを見せる
  const need = G.bids[w.player]-G.tricksWon[w.player];
  const st = need>0 ? T().needMore(need) : need===0 ? T().needZero : T().needOver(-need);
  G.acts[w.player]=T().aWin(SUIT_SYM[w.card.s]+w.card.r, st);
  render();
  {
    const cen=document.getElementById('center');
    if(cen) cen.querySelectorAll('.played').forEach(el=>{
      if(!el.classList.contains('winner')) el.classList.add('loser');
    });
  }
  await seatToast(w.player, T().tWin(SUIT_SYM[w.card.s]+w.card.r, st), 1400);

  // ③ 勝者が場の札を回収する
  await sweepTrick(w.player);
}

/* 場の札を勝者の席へ集めてから消す */
async function sweepTrick(winner){
  const cen=document.getElementById('center');
  if(!cen){ await pthink(60); return; }
  const dir=POS[winner];                       // 勝者の方向へ集める
  cen.querySelectorAll('.played').forEach(el=>{
    el.classList.remove('loser');
    el.classList.add('sw-'+dir);
  });
  cen.classList.add('sweeping');
  await pthink(170);
  cen.classList.remove('sweeping');
  cen.querySelectorAll('.played').forEach(el=>el.classList.remove('sw-n','sw-s','sw-w','sw-e'));
}

/* 戦の区切りは自然な離脱点なので、ここに製品版への案内を置く */
function trialBlock(){
  const links = TRIAL_LINKS.filter(l=>l.url);
  const btns = links.map(l=>
    `<a class="btn" href="${l.url}" target="_blank" rel="noopener">${T().linkLabel[l.key]||l.key}</a>`
  ).join('');
  return `<div class="trialnote"><div class="tn-t">${T().trialNote}</div>`
       + (btns ? `<div class="tn-l">${btns}</div>` : '')
       + `</div>`;
}

function endDeal(){
  G.phase='dealend';
  const gains=allP().map(p=>scoreOf(G.bids[p],G.tricksWon[p]));
  for(let p=0;p<NPLAYER;p++) M.total[p]+=gains[p];
  M.rows.push({deal:M.deal, bids:G.bids.slice(), won:G.tricksWon.slice(), gains});
  logT(T().lDealEnd(M.deal, allP().map(p=>`${NAMES[p]} ${G.bids[p]}→${G.tricksWon[p]} (+${gains[p]})`).join('　')));

  const last = M.deal>=NDEAL;
  document.getElementById('resultHost').innerHTML=`
    <div class="resultveil"><div class="result">
      <h2>${last?T().rMatchEnd:T().rDealEnd(M.deal)}</h2>
      <table style="width:100%;font-family:var(--mono);font-size:12.5px;border-collapse:collapse">
        <tr style="color:var(--dim)"><th style="text-align:left">　</th><th>${T().rBid}</th><th>${T().rWon}</th><th>${T().rDiff}</th><th>${T().rScore}</th><th>${T().rTotal}</th></tr>
        ${allP().map(p=>`<tr style="border-top:1px solid #33455A">
          <td style="text-align:left;padding:4px 0">${NAMES[p]}</td>
          <td style="text-align:center">${G.bids[p]}</td>
          <td style="text-align:center">${G.tricksWon[p]}</td>
          <td style="text-align:center;color:${G.bids[p]===G.tricksWon[p]?'#79C08D':'var(--muted)'}">${G.tricksWon[p]-G.bids[p]>=0?'+':''}${G.tricksWon[p]-G.bids[p]}</td>
          <td style="text-align:center;font-weight:700">${gains[p]}</td>
          <td style="text-align:center">${M.total[p]}</td></tr>`).join('')}
      </table>
      ${last?`<div style="margin-top:12px;font-family:var(--mincho);font-size:17px;letter-spacing:.1em">
        ${(()=>{const m=Math.max(...M.total);const w=allP().filter(p=>M.total[p]===m);
        return T().rWinner(w.length>1?w.map(p=>NAMES[p]).join('・')+T().rDraw:NAMES[w[0]]);})()}</div>`:''}
      ${trialBlock()}
      <div style="margin-top:16px">
        <button class="btn primary" id="nextBtn">${last?T().btnNewMatch:T().btnNext}</button>
      </div>
    </div></div>`;
  document.getElementById('nextBtn').addEventListener('click',()=>{
    document.getElementById('resultHost').innerHTML='';
    if(last){ newMatch(); }
    else{ M.deal++; M.p1=nx(M.p1,1); startDeal(); }
  });
  setPrompt(last?T().qMatchEnd:T().qDealEnd,'');
  render();
}

function tick(t){document.getElementById('ticker').textContent=t;}

function render(){
  if(!G) return;
  document.body.dataset.rank=G.rank.value;

  renderPayTable();
  renderTotalScore();

  // 得点表：宣言（bid）フェイズに入ったら参照モーダルを自動で開き、抜けたら閉じる。
  // フェイズ中の手動クローズは尊重する（再オープンはフェイズ遷移時のみ）。
  syncPayTableModal();

  // 戦表示
  const dt=document.getElementById('dealtag');
  if(dt) dt.innerHTML = `${T().dealLabel} <b>${M.deal} / ${NDEAL}</b>　P1 ${NAMES[G.p1]}`;

  renderRoster();

  // 戦数の注記は開始前だけ。プレイ中は総和の帯に場所を譲る
  { const rn=document.getElementById('roundsNote'); if(rn) rn.style.display='none'; }

  // 卓上の左上パネルは「開始前の順序一覧」専用。
  // 宣言の総和は席プレートと衝突するため、卓の外の帯（#sumBar）へ出す。
  {
    const bs=document.getElementById('bidSum');
    const sb=document.getElementById('sumBar');
    const t=T();
    const done = G.bids.every(b=>b!==null);
    const showSum = done && !['draft','place'].includes(G.phase) && !['dealend','end'].includes(G.phase);
    const showOrd = !done && !['dealend','end'].includes(G.phase);

    if(sb){
      if(showSum){
        const S=G.bids.reduce((a,b)=>a+b,0), D=S-NTRICK;
        const cls = D<0?'under' : D>0?'over' : 'even';
        const lbl = D<0?t.sbUnder : D>0?t.sbOver : t.sbEven;
        sb.className='sumbar on';
        sb.innerHTML = `<span class="lb">${t.sbSum}</span>`
          + `<span class="vl">${S}</span>`
          + `<span class="of">/ ${NTRICK}</span>`
          + `<span class="df ${cls}">${D>0?'+':''}${D} ${lbl}</span>`
          + `<span class="exp">${t.sumExp(NTRICK,S,D)}</span>`;
      } else { sb.className='sumbar'; sb.innerHTML=''; }
    }

    if(bs){
      if(showOrd){
        // 開始前：起点から見た各フェイズの順序（2列に畳む）
        const o=orderFrom(G.p1);
        const row=(seq,lead)=>`<div class="ordrow">`+seq.map((p,i)=>
            `${i?'<span class="oa">→</span>':''}`
          + `<span class="oc" style="color:${PCOL[p]};border-color:${PCOL[p]}`
          + `${lead&&i===0?';background:rgba(201,162,39,.22)':''}">${SHORT[p]}</span>`
          ).join('')+`</div>`;
        const blk=(lb,seq,lead)=>`<div class="ordblk"><span class="ordlb">${lb}</span>${row(seq,lead)}</div>`;
        bs.className='bidsum on ord';
        bs.innerHTML = `<div class="ordgrid">`
          + blk(t.ordDraft, o)
          + blk(t.ordPlace, o)
          + blk(t.ordBid, o.slice().reverse())
          + blk(t.ordLead, o, true)
          + `</div>`;
      } else { bs.className='bidsum'; bs.innerHTML=''; }
    }
    document.body.dataset.ord = showOrd ? '1' : '0';
  }

  // 1T 除去の説明
  {
    const lc=document.getElementById('lensCleanup');
    if(lc){
      if(G.cleanupMsg){
        lc.className = 'cleanup on' + (G.cleanupClose?' act':'');
        lc.innerHTML = `<span>${G.cleanupMsg}</span>`
          + (G.cleanupClose
              ? `<div class="closewrap"><button class="btn" id="cleanupCloseBtn">${T().close}</button>
                 <span class="hint">Enter</span></div>` : '');
      }
      else { lc.className='cleanup'; lc.innerHTML=''; }
    }
  }

  // レンズ
  const rn=G.rank.value==='N', tv=G.trump.value;
  document.getElementById('lens').innerHTML=`
    <div class="lcol">
      <div class="stackwrap rankstack">
        <div class="base">${T().kanjiHigh}<span class="lbl">${T().baseLbl}</span></div>
        ${!rn ? `<div class="overlay ${G.rankFresh?'enter':''}" style="background:rgba(20,28,38,.96);border:1.5px solid var(--verdigris)">
                   <span class="kanji Rv" style="font-size:19px">${T().kanjiLow}</span>
                 </div>` : ''}
      </div>
    </div>
    <div class="lcol lstack">
      <div class="sub">${rn?T().lensHigh:T().lensLow}${G.rank.holder?'・'+durLabel(G.rank.holder):''}</div>
    </div>
    <div class="lcol">
      <div class="stackwrap trumpstack">
        <div class="base tbase"><span class="none">${T().noTrump}</span><span class="lbl">${T().baseLbl}</span></div>
        ${tv!==null ? `<div class="overlay ${G.trumpFresh?'enter':''}" style="background:rgba(20,28,38,.96);border:1.5px solid var(${SUIT_VAR[tv]})">
                   <span style="color:var(${SUIT_VAR[tv]});font-size:19px">${SUIT_SYM[tv]}</span>
                 </div>` : ''}
      </div>
    </div>
    <div class="lcol lstack">
      <div class="sub">${tv===null?T().trumpNoneSub:T().trumpSub(SUIT_SYM[tv])}${G.trump.holder?'・'+durLabel(G.trump.holder):''}</div>
    </div>
    <div class="lcol lsep"></div>
    <div class="lcol">
      <div class="tno">${['draft','place','bid'].includes(G.phase)?'–':G.trickNo}<span class="of">/${NTRICK}</span></div>
      <div class="sub tlb">${T().sbTrick}</div>
    </div>`;
  if(G.rankFresh || G.trumpFresh){
    const lensEl=document.getElementById('lens');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      lensEl.querySelectorAll('.overlay.enter').forEach(e=>e.classList.remove('enter'));
    }));
    G.rankFresh=false; G.trumpFresh=false;   // 一度見せたら消費する（次の render では通常表示）
  }

  // ボード（布石行 ＋ プレイヤー4行）
  {
    const inPlay=!['draft','place','bid'].includes(G.phase);
    const rows=[];

    // ── 布石の行
    rows.push(`<div class="bl">${T().rowPlant}</div>`);
    for(let t=1;t<=NTRICK;t++){
      let cls='slot';
      if(inPlay){ if(t<G.trickNo) cls+=' past'; if(t===G.trickNo) cls+=' now'; }
      // 布石するスロットを待っている間は、置ける場所と置けない場所を盤面上で示す
      if(G.phase==='place' && G.placePick){
        cls += G.track[t].some(x=>x.axis===G.placePick.axis) ? ' blocked' : ' pick';
      }
      const chips=G.track[t].map(c=>{
        const col = c.axis==='R' ? 'var(--verdigris)' : `var(${SUIT_VAR[c.suit]})`;
        const isP = c.dur==='PERSIST';
        const st = isP
          ? `background:${col};color:#101720;border-color:${col};font-weight:700`
          : `background:rgba(0,0,0,.30);color:${col};border-color:${col}`;
        const pb = G.placedBy[c.id];
        const who = pb!==undefined ? `<span style="color:${isP?'#101720':PCOL[pb]}">${SHORT[pb]}</span>` : '';
        return `<div class="chipline" style="${st}">${condLabel(c)}<span class="du">${durLabel(c)}</span><span class="ow">${who}</span></div>`;
      }).join('');
      const lock = (G.track[t].length && inPlay)
        ? `<div class="shield">${LANG==='ja'?'護':'L'}</div>` : '';
      rows.push(`<div class="${cls}" data-slot="${t}"><div class="no">${t}</div>${chips}${lock}</div>`);
    }

    // ── プレイヤー4行（A=自分, B, C, D）
    for(let p=0;p<NPLAYER;p++){
      const b=G.bids[p], w=G.tricksWon[p];
      const tile = b===null
        ? `<span class="bidtile none">–</span>`
        : `<span class="bidtile ${w===b?'done':(w>b?'over':'')}">${b}</span>`;
      const isLead = inPlay && p===G.lead;
      rows.push(`<div class="bl plr" style="border-left-color:${PCOL[p]}${isLead?'':'66'}">
        <span class="who" style="color:${PCOL[p]}">${'ABCD'[p]}</span>${tile}</div>`);
      for(let t=1;t<=NTRICK;t++){
        let cls='tk';
        if(inPlay){ if(t<G.trickNo) cls+=' past'; if(t===G.trickNo) cls+=' now'; }
        const won = G.slotWinner[t]===p;
        rows.push(`<div class="${cls}">${won?`<div class="mk" style="background:${PCOL[p]}"></div>`:''}</div>`);
      }
    }
    const bd=document.getElementById('board');
    bd.style.setProperty('--ntrick', String(NTRICK));
    bd.innerHTML = rows.join('');
  }

  // 座席（3人戦では使わない席を空にする）
  {
    const used=new Set(allP().map(i=>POS[i]));
    for(const k of ['s','w','n','e']) if(!used.has(k)){
      const e=document.getElementById(SEAT_EL[k]);
      if(e){ e.innerHTML=''; e.className='seat seat-'+k+' empty'; }
    }
  }
  for(let p=0;p<NPLAYER;p++){
    const pos=POS[p], el=document.getElementById(SEAT_EL[pos]);
    const isLead=p===G.lead&&!['draft','place','bid'].includes(G.phase);
    el.className='seat seat-'+pos+(isLead?' lead':'');
    const conds=['draft','place'].includes(G.phase)?G.held[p]:G.reserve[p];
    const b=G.bids[p];
    const bidTag = b===null?'' :
      `<span class="bidbadge ${G.tricksWon[p]===b?'done':(G.tricksWon[p]>b?'over':'')}">${G.tricksWon[p]} / ${b}</span>`;
    const plate=`<div class="plate" style="border-color:${PCOL[p]}66">
        ${p===G.p1?'<span class="p1">P1</span>':''}
        <span class="ab" style="color:${PCOL[p]}">${'ABCD'[p]}</span>
        <span class="nm" style="color:${PCOL[p]}">${NAMES[p].replace(/^[A-D][：:]\s*/,'')}</span>
        ${bidTag}
        ${G.spent[p]>=MAXFIRE()?`<span class="spent">${T().used}</span>`:(G.spent[p]?`<span class="spent">${T().usedN(G.spent[p],MAXFIRE())}</span>`:'')}
      </div>
      <div class="leadmark">${T().tagLead}</div>
      <div class="minis">${conds.map(miniChip).join('')}</div>`;
    if(p===HUMAN){
      const ls=(G.phase==='play'&&G.trickCards.length)?G.trickCards[0].card.s:null;
      const myTurn=G.phase==='play'&&G.trickCards.length<4&&
                   orderFrom(G.lead)[G.trickCards.length]===HUMAN;
      const legal=myTurn?legalMoves(G.hands[HUMAN],ls):[];
      const legalSet=new Set(legal.map(c=>c.s*100+c.r));
      const sorted=G.hands[HUMAN].slice().sort((a,b)=>a.s-b.s||(G.rank.value==='N'?b.r-a.r:a.r-b.r));
      el.innerHTML=plate+`<div class="handrow">${sorted.map(c=>{
        const ok=myTurn&&legalSet.has(c.s*100+c.r);
        const tr=G.trump.value!==null&&c.s===G.trump.value;
        return `<div class="hcard ${ok?'playable':(myTurn?'illegal':'')}" data-card="${c.s}-${c.r}">${cardSVG(c,52,tr?'tr':'')}</div>`;
      }).join('')}</div>`;
    }else{
      el.innerHTML=plate+`<div class="backs">${Array.from({length:G.hands[p].length},()=>backSVG(23)).join('')}</div>`;
    }
  }

  // 応変魔術解決の可視化
  const center=document.getElementById('center');
  document.querySelectorAll('.offerstrip,.changebanner').forEach(e=>e.remove());
  // 状況説明と「閉じる」（カード自体はフキダシが担う）
  const showStrip = !!(G.bubbles && G.bubbles.length) && (G.changeBanner || G.explain || G.showClose);
  document.body.dataset.resolve = showStrip ? '1' : '0';
  if(showStrip){
    const st=document.createElement('div');
    st.className='offerstrip';
    st.innerHTML =
        (G.changeBanner ? `<div class="changebanner">${G.changeBanner}</div>` : '')
      + (G.explain ? `<div class="expl">${G.explain}</div>` : '')
      + (G.showClose
          ? `<div class="closewrap"><button class="btn" id="offerCloseBtn">${T().close}</button>
             <span class="hint">Enter</span></div>` : '');
    document.getElementById('table').appendChild(st);
  }

  // 応変魔術のフキダシ（全員分・出していない人も空で表示）
  center.querySelectorAll('.obub').forEach(e=>e.remove());
  document.querySelectorAll('.seat.leadglow').forEach(e=>e.classList.remove('leadglow'));
  center.classList.toggle('offering', !!(G.bubbles&&G.bubbles.length));
  if(G.bubbles){
    for(const b of G.bubbles){
      const div=document.createElement('div');
      div.className=`obub at-${b.pos} ${b.st}`;
      const col=b.col||'#3B4757';
      const body = b.card
        ? condSVG(b.card, 32)
        : `<span class="none">${T().obNone}</span>`;
      div.innerHTML =
          (b.pos==='n'||b.pos==='c' ? `<div class="nm" style="color:${col}">${b.who}</div>` : '')
        + `<div class="bx" style="border-color:${col}">${body}</div>`
        + (b.tag ? `<div class="tag">${b.tag}</div>` : '')
        + (b.pos!=='n'&&b.pos!=='c' ? `<div class="nm" style="color:${col}">${b.who}</div>` : '');
      center.appendChild(div);
    }
    if(G.leadGlow!==null && G.leadGlow!==undefined){
      const el=document.getElementById(SEAT_EL[POS[G.leadGlow]]);
      if(el) el.classList.add('leadglow');
    }
  }

  // 出札
  center.querySelectorAll('.played').forEach(e=>e.remove());
  for(const e of G.trickCards){
    const pos=POS[e.player];
    const isW=G.winnerThisTrick===e.player&&G.trickCards.length===NPLAYER;
    const tr=G.trump.value!==null&&e.card.s===G.trump.value;
    const div=document.createElement('div');
    div.className=`played pos-${pos} ${isW?'winner':''} ${e.fresh?'enter-'+pos:''}`;
    div.innerHTML=`<div class="who" style="color:${PCOL[e.player]}">${NAMES[e.player]}</div>${cardSVG(e.card,50,(isW?'win ':'')+(tr?'tr':''))}`;
    center.appendChild(div);
    if(e.fresh){ e.fresh=false;
      requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.remove('enter-'+pos))); }
  }
}

/* 座席位置に吹き出しを出す。ms 経過後に自動で消える */
/* フェイズ案内。orders は [{label, seq:[playerIndex,...]}, ...] */
let SKIP_PHASE = false;
function phaseDialog(title, msg, sub, orders, showFlow){
  if(SKIP_PHASE) return Promise.resolve();
  return new Promise(res=>{
    const dlg=document.getElementById('phasedlg');
    if(!dlg){ res(); return; }
    document.getElementById('phTitle').innerHTML=title;
    document.getElementById('phMsg').innerHTML=msg;
    document.getElementById('phSub').innerHTML=sub||'';
    const oe=document.getElementById('phOrder');
    oe.innerHTML=(orders||[]).map(o=>
      (o.label?`<div class="ph-round">${o.label}${o.note?`<span class="nt">${o.note}</span>`:''}</div>`:'')+
      `<div class="ph-order${o.lead?' isLead':''}">`+
      o.seq.map((p,i)=>
        `${i?'<span class="arw">→</span>':''}`+
        `<span class="pchip" style="color:${PCOL[p]};border-color:${PCOL[p]}">`
        +`<span class="ix">${i+1}</span>${NAMES[p]}</span>`
      ).join('')+`</div>`
    ).join('');
    // この戦の流れ（戦開始時のみ）
    const fl=document.getElementById('phFlow');
    if(fl){
      if(showFlow){
        const t2=T();
        const steps = Array.isArray(showFlow) ? showFlow
                    : ((typeof t2.phFlow==='function')?t2.phFlow():[]);
        document.getElementById('phFlowSum').textContent = (showFlow===true)?t2.phFlowSum:(t2.phPlaceSum||t2.phFlowSum);
        document.getElementById('phFlowBody').innerHTML = steps.map((st,i)=>
          `<div class="phstep"><div class="no">${i+1}</div>`
          +`<div class="tx"><b>${st.t}</b>　${st.d}<span class="wy">${st.w}</span></div></div>`
        ).join('');
        fl.className='phflow on'; fl.open=false;
      } else { fl.className='phflow'; fl.open=false; }
    }
    const btn=document.getElementById('phBtn');
    btn.textContent=T().phOk;
    const cb=document.getElementById('phSkip');
    document.getElementById('phSkipLbl').textContent=T().phSkip;
    cb.checked=false;
    dlg.style.display='flex';
    const g=GEN;
    const close=()=>{
      if(cb.checked) SKIP_PHASE=true;
      dlg.style.display='none';
      btn.removeEventListener('click',close);
      document.removeEventListener('keydown',key);
      if(g===GEN) res();
    };
    const key=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); close(); } };
    btn.addEventListener('click',close);
    document.addEventListener('keydown',key);
  });
}

function seatToast(p, action, ms=2000){
  const g=GEN;
  if(p===HUMAN) return Promise.resolve();     // 自分の行動は自明なので出さない
  ms = ms*2;                                   // 表示時間は一律 2 倍
  return new Promise(res=>{
    const tbl=document.getElementById('table');
    if(!tbl){ res(); return; }
    tbl.querySelectorAll(`.seattoast.at-${POS[p]}`).forEach(e=>e.remove());
    const d=document.createElement('div');
    d.className=`seattoast at-${POS[p]}`;
    d.style.borderColor=PCOL[p];
    d.innerHTML=`<span class="who" style="color:${PCOL[p]}">${NAMES[p]}</span>
                 <span class="act">${action}</span>`;
    tbl.appendChild(d);
    requestAnimationFrame(()=>d.classList.add('on'));
    setTimeout(()=>{
      d.classList.remove('on');
      setTimeout(()=>{ d.remove(); if(g===GEN) res(); }, 190);
    }, ms);
  }).then(()=> g===GEN ? undefined : NEVER);
}
function clearToasts(){
  document.querySelectorAll('.seattoast').forEach(e=>e.remove());
}
const condName = c => `${condLabel(c)}・${durLabel(c)}`;


function renderRoster(){
  const el=document.getElementById('roster');
  if(!el) return;
  const ph=G.phase;
  const ord = (G.order && G.order.length) ? G.order
            : (['draft','place'].includes(ph) ? orderFrom(G.p1)
            :  ph==='bid' ? orderFrom(G.p1).slice().reverse()
            :  orderFrom(G.lead));
  const rows = ord.map((p,i)=>{
    const isTurn = G.turn===p;
    const done = G.turn!==null && ord.indexOf(p) < ord.indexOf(G.turn);
    const b=G.bids[p], w=G.tricksWon[p];
    const tags=[];
    if(p===G.p1) tags.push(`<span class="tg p1">${T().tagP1}</span>`);
    if(!['draft','place','bid'].includes(ph) && p===G.lead) tags.push(`<span class="tg lead">${T().tagLead}</span>`);
    if(isTurn) tags.push(`<span class="tg turn">${T().tagTurn}</span>`);
    const bidTag = b===null ? ''
      : `<span class="bid ${w===b?'done':(w>b?'over':'')}">${w} / ${b}</span>`;
    const conds = ['draft','place'].includes(ph) ? G.held[p] : G.reserve[p];
    const act = G.acts[p] || (isTurn ? `<span class="wait">${T().thinking}</span>` : '');
    return `<div class="rrow ${isTurn?'now':''} ${done?'done':''}" style="border-left-color:${PCOL[p]}">
      <div class="nm" style="color:${PCOL[p]}">${i+1}. ${NAMES[p]}
        <span class="tags">${tags.join('')}</span></div>
      <div class="sc">${M.total[p]}${bidTag?'　'+bidTag:''}</div>
      <div class="conds">${conds.map(miniChip).join('')}${G.spent[p]>=MAXFIRE()?`<span class="mini" style="border-color:#5F6B78;color:#5F6B78">${T().used}</span>`:(G.spent[p]?`<span class="mini" style="border-color:#7A6A3A;color:#B79A4E">${T().usedN(G.spent[p],MAXFIRE())}</span>`:'')}</div>
      ${act?`<div class="act">${act}</div>`:''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="rhead">${T().phase[ph]||''}</div>` + rows;
}

function ownerBg(colors,pct,base){
  if(!colors.length) return '';
  if(colors.length===1) return `color-mix(in srgb, ${colors[0]} ${pct}%, ${base})`;
  const seg=100/colors.length;
  return 'linear-gradient(90deg, '+colors.map((c,i)=>
    `color-mix(in srgb, ${c} ${pct}%, ${base}) ${(i*seg).toFixed(2)}% ${((i+1)*seg).toFixed(2)}%`
  ).join(', ')+')';
}
function buildPayTableHTML(){
  const cols=[];
  const CAP = BIDMAX();                               // 宣言の上限（＝得点表の最終列）
  for(let b=0;b<=CAP;b++){
    const t = (NPLAYER===3) ? SCORE_3[b] : SCORE_T[b];
    const lbl = String(b);
    const owner = G.bids ? allP().filter(q=>G.bids[q]===b) : [];
    const colors = owner.map(q=>PCOL[q]);
    const cls = colors.length ? 'ptcol owned' : 'ptcol';
    const style = colors.length
      ? ` style="--oc-cell:${ownerBg(colors,22,'var(--pane)')};--oc-head:${ownerBg(colors,38,'var(--pane-alt)')}"`
      : '';
    const who = owner.map(q=>`<span style="color:${PCOL[q]}">${SHORT[q]}</span>`).join(' ');
    cols.push(`<div class="${cls}"${style}>
      <div class="b">${lbl}</div>
      <div class="v hit">${t[0]}</div>
      <div class="v n1">${t[1]}</div>
      <div class="v n2">${t[2]}</div>
      <div class="who">${who}</div>
    </div>`);
  }
  return `<div class="ttl">${T().ptTitle}<b>${T().ptSub}</b></div>
     <div class="ptlabels">
       <div style="visibility:hidden">-</div>
       <div class="l-hit">${T().ptExact}</div><div class="l-n1">${T().ptOff1}</div><div class="l-n2">${T().ptOff2}</div>
       <div>${T().ptOwner}</div>
     </div>
     <div class="ptgrid">${cols.join('')}</div>`;
}
function renderPayTable(){
  const modal=document.getElementById('paytableModal');
  if(modal) modal.innerHTML = buildPayTableHTML();
}
/* 宣言フェイズに入った瞬間だけ自動で開く。フェイズ中に閉じられたら開き直さない。 */
let PT_LAST_PHASE = null;
function syncPayTableModal(){
  const veil=document.getElementById('ptveil');
  if(!veil) return;
  const inBid = G.phase==='bid';
  if(inBid && PT_LAST_PHASE!=='bid') veil.classList.add('on','soft');
  if(!inBid && PT_LAST_PHASE==='bid'){ veil.classList.remove('on','soft'); clearBidHost(); }
  PT_LAST_PHASE = G.phase;
}
function renderTotalScore(){
  const el=document.getElementById('totalScore');
  if(!el || !M) return;
  const cols = allP().map(p=>
    `<div class="col"><span class="nm" style="color:${PCOL[p]}">${SHORT[p]}</span>`
    +`<span class="vl">${M.total[p]}</span></div>`
  ).join('');
  el.innerHTML = `<span class="lb">${T().tsLabel}</span>${cols}`;
}

}

/* 応変ポップアップは卓中央のレンズを覆うため、同じ情報を欄内に持たせる。 */
function nowBox(){
  const rn = G.rank.value==='N', tv = G.trump.value;
  const rCol = rn ? 'var(--brass)' : 'var(--verdigris)';
  const rDur = G.rank.holder ? `・${durLabel(G.rank.holder)}` : '';
  const tDur = G.trump.holder ? `・${durLabel(G.trump.holder)}` : '';
  const tCol = tv===null ? 'var(--dim)' : `var(${SUIT_VAR[tv]})`;
  const tVal = tv===null ? T().bnNone : SUIT_SYM[tv];
  const tSub = tv===null ? T().trumpNoneSub : T().trumpSub(SUIT_SYM[tv]);
  return `<div class="rnow">
    <span class="nlb">${T().rnowLbl}</span>
    <div class="ln"><span class="k">${T().bnRank}</span>
      <span class="v" style="color:${rCol}">${rn?T().kanjiHigh:T().kanjiLow}</span>
      <span class="sub">${rn?T().lensHigh:T().lensLow}${rDur}</span></div>
    <div class="ln"><span class="k">${T().bnTrump}</span>
      <span class="v" style="color:${tCol}">${tVal}</span>
      <span class="sub">${tSub}${tDur}</span></div>
  </div>`;
}
function renderReactivePop(){
  document.querySelectorAll('.reactpop').forEach(e=>e.remove());
  const bl=new Set(G.reserve[HUMAN].filter(c=>blockedAxis(c.axis,G.trickNo)).map(c=>c.id));
  const blNames=['R','T'].filter(a=>blockedAxis(a,G.trickNo)).map(a=>T().axName[a]);
  const need=G.bids[HUMAN]-G.tricksWon[HUMAN];
  const st = need>0 ? T().needMore(need) : need===0 ? T().needZero : T().needOver(-need);
  const d=document.createElement('div');
  d.className='reactpop';
  d.innerHTML=`
    <div class="rtext">
      <div class="rq">${T().popQ}</div>
      <div class="rh">${T().popState(G.bids[HUMAN], G.tricksWon[HUMAN], st)}</div>
      ${blNames.length?`<div class="rh" style="color:var(--warn)">${T().popLocked(blNames.join('・'))}</div>`:''}
    </div>
    ${nowBox()}
    <div class="rrow">
      ${G.reserve[HUMAN].map(c=>condSVG(c,54,'',bl.has(c.id)?'blocked':'sel')).join('')}
      <button class="btn" id="passBtn">${T().pass}</button>
    </div>`;
  document.getElementById('table').appendChild(d);
}
function clearReactivePop(){
  document.querySelectorAll('.reactpop').forEach(e=>e.remove());
}

function renderReactivePick(){
  const bl=new Set(G.reserve[HUMAN].filter(c=>blockedAxis(c.axis,G.trickNo)).map(c=>c.id));
  document.getElementById('prow').innerHTML=
    `<div class="pool">${G.reserve[HUMAN].map(c=>
      condSVG(c,62,'',bl.has(c.id)?'blocked':'sel')).join('')}</div>`
    +`<button class="btn" id="passBtn">${T().pass}</button>`;
}
function renderBidPick(done, sum){
  const taken=takenBids();
  const note = done.length
    ? T().bidTaken(done.map(q=>NAMES[q]+' '+G.bids[q]).join('　'), sum)
    : T().bidFirst;
  const sc=b=>(NPLAYER===3 ? (b>=12?SCORE_3[12]:SCORE_3[b]) : (b>=9?SCORE_T[9]:SCORE_T[b]));
  const html=
    `<div style="width:100%"><div class="bidnote">${note}</div>
     <div class="bidbtns">${Array.from({length:BIDMAX()+1},(_,i)=>{
       const t=sc(i);
       return taken.has(i)
         ? `<button class="bidbtn taken" disabled>${i}</button>`
         : `<button class="bidbtn" data-bid="${i}"><b>${i}</b><span class="pt">${t[0]}/${t[1]}/${t[2]}</span></button>`;
     }).join('')}</div></div>`;
  // 得点表モーダルと右カラムの両方に置く。モーダルは最前面なので、
  // 開いていればそちらが、閉じていれば右カラムが操作対象になる。
  document.getElementById('prow').innerHTML = html;
  const host=document.getElementById('ptBidHost');
  if(host) host.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════
   入力
   ═══════════════════════════════════════════════════════ */
document.addEventListener('click',ev=>{
  if(!pending) return;
  if(startVeil && !startVeil.classList.contains('off')) return;
  if(helpVeil && helpVeil.classList.contains('on')) return;
  if(glossVeil && glossVeil.classList.contains('on')) return;
  const cond=ev.target.closest('.condwrap.sel');
  if(cond){
    const c=CONDS.find(x=>x.id===+cond.dataset.cid);
    if(G.phase==='draft') resume(c); else resume({kind:'cond',card:c});
    return;
  }
  if(ev.target.id==='passBtn'){resume({kind:'pass'});return;}
  if(ev.target.id==='offerCloseBtn'||ev.target.id==='cleanupCloseBtn'){resume({kind:'close'});return;}
  const bb=ev.target.closest('.bidbtn');
  if(bb&&G.phase==='bid'){ resume({bid:+bb.dataset.bid}); return; }
  const slot=ev.target.closest('.slot');
  if(slot&&G.phase==='place'){resume({kind:'slot',slot:+slot.dataset.slot});return;}
  const card=ev.target.closest('.hcard.playable');
  if(card&&G.phase==='play'){
    const [s,r]=card.dataset.card.split('-').map(Number);
    resume({s,r});
  }
});
document.addEventListener('keydown',ev=>{
  if(!pending||!G||!(G.showClose||G.cleanupClose)) return;
  if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); resume({kind:'close'}); }
});
// ヘルプ文中の {{s0}}〜{{s3}} を小さな紋に置き換える
function expandGlyphs(html){
  const dotMark  = `<svg class="inlmk" width="26" height="9" viewBox="0 0 26 9">`+
                   `<circle cx="13" cy="4.5" r="2.6" fill="var(--brass)"/></svg>`;
  const barMark  = `<svg class="inlmk" width="26" height="9" viewBox="0 0 26 9">`+
                   `<rect x="2" y="2.5" width="22" height="4" rx="2" fill="var(--brass)"/></svg>`;
  return html
    .replace(/\{\{dot\}\}/g, dotMark)
    .replace(/\{\{bar\}\}/g, barMark)
    .replace(/\{\{s([0-3])\}\}/g, (_,n)=>{
      const i=+n;
      return `<svg class="inlsuit" width="15" height="15" viewBox="0 0 70 70">`+
             SUIT_SHAPE[i].replace(/FILL/g,`var(${SUIT_VAR[i]})`)+`</svg>`;
    })
    // {{card:R|T , TEMP|PERSIST , suit}} → 実物と同じ魔力場操作カード
    .replace(/\{\{card:([RT]),(TEMP|PERSIST)(?:,([0-3]))?\}\}/g, (_,ax,dur,su)=>
      condSVG({id:-1, axis:ax, dur:dur, suit:su===undefined?null:+su}, 76))
    // {{chip:...}} → 一覧やトラックに出るチップ
    .replace(/\{\{chip:([RT]),(TEMP|PERSIST)(?:,([0-3]))?\}\}/g, (_,ax,dur,su)=>
      miniChip({id:-1, axis:ax, dur:dur, suit:su===undefined?null:+su}));
}

function applyLang(){
  const t=T();
  NAMES = composeNames();
  if(typeof buildNames==='function') buildNames();
  SHORT = t.short.slice();
  SUIT_SYM = t.suits.slice();
  document.documentElement.lang = LANG;
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
  set('appTitle', t.title);
  set('provisional', t.prov);
  set('helpbtn', t.rules); set('glossbtn', t.glossary); set('newgame', t.newMatch);
  set('ptRefBtn', t.ptRefBtn); set('ptclose', t.close);
  { const h=document.getElementById('ptTitle'); if(h) h.textContent=t.ptTitle; }
  set('lbRounds', t.roundsLabel); set('lbSpeed', t.speedLabel);
  set('helpTitle', t.helpTitle); set('glossTitle', t.glossTitle);
  set('helpclose', t.close); set('glossclose', t.close);
  set('logSummary', t.record);
  set('narrowWarn', t.narrowWarn);
  const hb=document.getElementById('helpBody');  if(hb) hb.innerHTML=expandGlyphs(t.helpBody);
  const gb=document.getElementById('glossBody'); if(gb) gb.innerHTML=expandGlyphs(t.glossBody);
  const rd=document.getElementById('rounds');
  if(rd) [...rd.options].forEach((o,i)=>o.textContent=t.rounds[i]);
  const sp=document.getElementById('speed');
  if(sp) [...sp.options].forEach((o,i)=>o.textContent=t.speeds[i]);
  document.title = t.title + ' Ver3';
  // 開始画面
  set('sProv', t.prov);
  set('sTagline', t.sTagline);
  const sn=document.getElementById('sNote'); if(sn) sn.innerHTML=t.sNote;
  set('sLbPlayers', t.playersLabel); set('sLbRounds', t.roundsLabel); set('sLbSpeed', t.speedLabel); set('sLbLang', t.sLang);
  set('startbtn', t.sStart); set('startrules', t.sRules);
  buildRounds();
  const ss=document.getElementById('sSpeed');
  const spdVals=['1.95','0.75','2.925'];
  if(ss && !ss.options.length){
    t.speeds.forEach((v,i)=>ss.add(new Option(v, spdVals[i])));
    ss.value='0.75';                       // 既定は「高速」
  } else if(ss){ [...ss.options].forEach((o,i)=>o.textContent=t.speeds[i]); }
  roundsNote();
  clearToasts();
  if(G){ G.acts=allP().map(()=>''); G.log=[]; drawLog(); tick(''); render(); }
  if(PROMPT_REDRAW) PROMPT_REDRAW();
}

function roundsNote(){
  const el=document.getElementById('roundsNote');
  if(el) el.style.display='';
  const rd=document.getElementById('rounds');
  if(!el||!rd) return;
  const n=parseInt(rd.value,10);
  const sp=document.getElementById('sPlayers');
  const np=sp?parseInt(sp.value,10):NPLAYER;
  const f = (n===np) ? T().roundsNote4 : T().roundsNoteN;
  el.innerHTML = (typeof f==='function') ? f() : f;
}

});
/* 名前入力欄を人数に応じて作り直す。入力値は保持する */
function buildNames(){
  const t=T();
  const sp=document.getElementById('sPlayers');
  const n = sp ? parseInt(sp.value,10) : 4;
  const row=document.getElementById('sNameRow');
  if(!row) return;
  // 既存の入力値を退避
  row.querySelectorAll('input[data-idx]').forEach(inp=>{
    const i=parseInt(inp.dataset.idx,10);
    CUSTOM_NAMES[i] = inp.value.trim() || null;
  });
  const PC=['--p0','--p1','--p2','--p3'];
  let html='';
  for(let i=0;i<n;i++){
    const def = t.names[i].replace(/^[A-D][：:]\s*/,'');
    const ph  = (i===0) ? t.nmYou : def;
    html += `<div class="nmline">`
         +  `<span class="nmtag" style="background:var(${PC[i]})">${t.short[i]}</span>`
         +  `<input type="text" data-idx="${i}" maxlength="12" placeholder="${ph}" value="${CUSTOM_NAMES[i]||''}">`
         +  `</div>`;
  }
  row.innerHTML=html;
  const sum=document.getElementById('sNamesSum');
  if(sum) sum.textContent=t.nmSum;
  const hint=document.getElementById('sNameHint');
  if(hint) hint.textContent=t.nmHint;
}
/* 入力欄の内容を CUSTOM_NAMES へ確定させる */
function commitNames(){
  document.querySelectorAll('#sNameRow input[data-idx]').forEach(inp=>{
    const i=parseInt(inp.dataset.idx,10);
    CUSTOM_NAMES[i] = inp.value.trim() || null;
  });
  NAMES = composeNames();
  if(typeof buildNames==='function') buildNames();
}
function buildRounds(){
  const t=T();
  const sp=document.getElementById('sPlayers');
  const n = sp ? parseInt(sp.value,10) : 4;
  const sr=document.getElementById('sRounds');
  if(!sr) return;
  const cur=sr.value;
  sr.innerHTML='';
  for(let i=1;i<=n;i++) sr.add(new Option(t.rounds[i-1], String(i)));
  sr.value = (cur && parseInt(cur,10)<=n) ? cur : String(n);
  // 人数セレクタの表記も言語に合わせる
  if(sp){ sp.options[0].textContent=t.pl4; sp.options[1].textContent=t.pl3; }
}
document.getElementById('sPlayers').addEventListener('change',()=>{ buildRounds(); buildNames(); });
document.getElementById('startrules').addEventListener('click',()=>helpVeil.classList.add('on'));
document.getElementById('startbtn').addEventListener('click',()=>{
  applyPlayers(parseInt(document.getElementById('sPlayers').value,10));
  commitNames();
  document.getElementById('rounds').value=document.getElementById('sRounds').value;
  document.getElementById('speed').value=document.getElementById('sSpeed').value;
  roundsNote();
  startVeil.classList.add('off');
  newMatch();
});
