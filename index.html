document.addEventListener('click',ev=>{
  if(!pending) return;
  if(startVeil && !startVeil.classList.contains('off')) return;
  if(helpVeil && helpVeil.classList.contains('on')) return;
  if(glossVeil && glossVeil.classList.contains('on')) return;
  const cond=ev.target.closest('.condwrap.sel');
  if(cond){
    const c=CONDS.find(x=>x.id===+cond.dataset.cid);
    if(G.phase==='draft') resume(c); else resume({kind:'cond',card:c});
    return;
  }
  if(ev.target.id==='passBtn'){resume({kind:'pass'});return;}
  if(ev.target.id==='offerCloseBtn'){resume({kind:'close'});return;}
  const bb=ev.target.closest('.bidbtn');
  if(bb&&G.phase==='bid'){ resume({bid:+bb.dataset.bid}); return; }
  const slot=ev.target.closest('.slot');
  if(slot&&G.phase==='place'){resume({kind:'slot',slot:+slot.dataset.slot});return;}
  const card=ev.target.closest('.hcard.playable');
  if(card&&G.phase==='play'){
    const [s,r]=card.dataset.card.split('-').map(Number);
    resume({s,r});
  }
});
document.addEventListener('keydown',ev=>{
  if(!pending||!G||!G.showClose) return;
  if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); resume({kind:'close'}); }
});
// ヘルプ文中の {{s0}}〜{{s3}} を小さな紋に置き換える
function expandGlyphs(html){
  const dotMark  = `<svg class="inlmk" width="26" height="9" viewBox="0 0 26 9">`+
                   `<circle cx="13" cy="4.5" r="2.6" fill="var(--brass)"/></svg>`;
  const barMark  = `<svg class="inlmk" width="26" height="9" viewBox="0 0 26 9">`+
                   `<rect x="2" y="2.5" width="22" height="4" rx="2" fill="var(--brass)"/></svg>`;
  return html
    .replace(/\{\{dot\}\}/g, dotMark)
    .replace(/\{\{bar\}\}/g, barMark)
    .replace(/\{\{s([0-3])\}\}/g, (_,n)=>{
      const i=+n;
      return `<svg class="inlsuit" width="15" height="15" viewBox="0 0 100 100">`+
             `<path d="${SUIT_PATH[i]}" fill="var(${SUIT_VAR[i]})"/></svg>`;
    })
    // {{card:R|T , TEMP|PERSIST , suit}} → 実物と同じ条件カード
    .replace(/\{\{card:([RT]),(TEMP|PERSIST)(?:,([0-3]))?\}\}/g, (_,ax,dur,su)=>
      condSVG({id:-1, axis:ax, dur:dur, suit:su===undefined?null:+su}, 76))
    // {{chip:...}} → 一覧やトラックに出るチップ
    .replace(/\{\{chip:([RT]),(TEMP|PERSIST)(?:,([0-3]))?\}\}/g, (_,ax,dur,su)=>
      miniChip({id:-1, axis:ax, dur:dur, suit:su===undefined?null:+su}));
}

function applyLang(){
  const t=T();
  NAMES = t.names.slice();
  SHORT = t.short.slice();
  SUIT_SYM = t.suits.slice();
  document.documentElement.lang = LANG;
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
  set('appTitle', t.title);
  set('provisional', t.prov);
  set('helpbtn', t.rules); set('glossbtn', t.glossary); set('newgame', t.newMatch);
  set('lbRounds', t.roundsLabel); set('lbSpeed', t.speedLabel);
  set('helpTitle', t.helpTitle); set('glossTitle', t.glossTitle);
  set('helpclose', t.close); set('glossclose', t.close);
  set('logSummary', t.record);
  set('narrowWarn', t.narrowWarn);
  const hb=document.getElementById('helpBody');  if(hb) hb.innerHTML=expandGlyphs(t.helpBody);
  const gb=document.getElementById('glossBody'); if(gb) gb.innerHTML=expandGlyphs(t.glossBody);
  const rd=document.getElementById('rounds');
  if(rd) [...rd.options].forEach((o,i)=>o.textContent=t.rounds[i]);
  const sp=document.getElementById('speed');
  if(sp) [...sp.options].forEach((o,i)=>o.textContent=t.speeds[i]);
  document.title = t.title + ' ' + t.prov;
  // 開始画面
  set('sProv', t.prov);
  set('sTagline', t.sTagline);
  const sn=document.getElementById('sNote'); if(sn) sn.innerHTML=t.sNote;
  set('sLbPlayers', t.playersLabel); set('sLbRounds', t.roundsLabel); set('sLbSpeed', t.speedLabel); set('sLbLang', t.sLang);
  set('startbtn', t.sStart); set('startrules', t.sRules);
  buildRounds();
  const ss=document.getElementById('sSpeed');
  const spdVals=['2.6','1'];
  if(ss && !ss.options.length){
    t.speeds.forEach((v,i)=>ss.add(new Option(v, spdVals[i])));
    ss.value='2.6';
  } else if(ss){ [...ss.options].forEach((o,i)=>o.textContent=t.speeds[i]); }
  roundsNote();
  clearToasts();
  if(G){ G.acts=allP().map(()=>''); G.log=[]; drawLog(); tick(''); render(); }
  if(PROMPT_REDRAW) PROMPT_REDRAW();
}

function roundsNote(){
  const el=document.getElementById('roundsNote');
  const rd=document.getElementById('rounds');
  if(!el||!rd) return;
  const n=parseInt(rd.value,10);
  const sp=document.getElementById('sPlayers');
  const np=sp?parseInt(sp.value,10):NPLAYER;
  const f = (n===np) ? T().roundsNote4 : T().roundsNoteN;
  el.innerHTML = (typeof f==='function') ? f() : f;
}

const helpVeil=document.getElementById('helpveil');
const glossVeil=document.getElementById('glossveil');
document.getElementById('glossbtn').addEventListener('click',()=>glossVeil.classList.add('on'));
document.getElementById('glossclose').addEventListener('click',()=>glossVeil.classList.remove('on'));
glossVeil.addEventListener('click',e=>{ if(e.target===glossVeil) glossVeil.classList.remove('on'); });
document.getElementById('helpbtn').addEventListener('click',()=>helpVeil.classList.add('on'));
document.getElementById('helpclose').addEventListener('click',()=>helpVeil.classList.remove('on'));
helpVeil.addEventListener('click',e=>{ if(e.target===helpVeil) helpVeil.classList.remove('on'); });

  LANG = e.target.value; applyLang();
});

applyLang();

// 開始画面 → ゲーム開始
document.getElementById('sLang').addEventListener('change',e=>{
  LANG=e.target.value;
  document.getElementById('lang').value=LANG;
  applyLang();
});
function buildRounds(){
  const t=T();
  const sp=document.getElementById('sPlayers');
  const n = sp ? parseInt(sp.value,10) : 4;
  const sr=document.getElementById('sRounds');
  if(!sr) return;
  const cur=sr.value;
  sr.innerHTML='';
  for(let i=1;i<=n;i++) sr.add(new Option(t.rounds[i-1], String(i)));
  sr.value = (cur && parseInt(cur,10)<=n) ? cur : String(n);
  // 人数セレクタの表記も言語に合わせる
  if(sp){ sp.options[0].textContent=t.pl4; sp.options[1].textContent=t.pl3; }
}
document.getElementById('sPlayers').addEventListener('change',()=>{ buildRounds(); });
document.getElementById('startrules').addEventListener('click',()=>helpVeil.classList.add('on'));
document.getElementById('startbtn').addEventListener('click',()=>{
  applyPlayers(parseInt(document.getElementById('sPlayers').value,10));
  document.getElementById('rounds').value=document.getElementById('sRounds').value;
  document.getElementById('speed').value=document.getElementById('sSpeed').value;
  roundsNote();
  startVeil.classList.add('off');
  newMatch();
});
