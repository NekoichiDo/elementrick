<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElemenTrick（仮）─ 試遊版</title>
<style>
/* ══════════════════════════════════════════════
   素材：藍の羅紗・胡桃の縁・生成りの札
   光：正＝真鍮 / 逆＝青磁 が卓に落ちる
   ══════════════════════════════════════════════ */
:root{
  --felt:#243447;
  --felt-deep:#1B2836;
  --rail:#4A3828;
  --rail-hi:#6B5136;
  --room:#141B24;

  --ivory:#F4EDDE;
  --ivory-dim:#E4DAC6;
  --card-ink:#2B2620;

  --brass:#C9A227;
  --verdigris:#CDD4DD;      /* 逆転＝銀 */

  --p0:#F2D64B;  /* A 黄     */
  --p1:#A578F0;  /* B 紫     */
  --p2:#3BC9E8;  /* C 水色   */
  --p3:#F0559B;  /* D 桃     */

  --s0:#3A6DB5;  /* 水 Aqua  */
  --s1:#AE2E3C;  /* 火 Fire  */
  --s2:#9E5E0E;  /* 地 Earth */
  --s3:#2F7A48;  /* 風 Wind  */

  --ink:#EAE6DC;
  --muted:#9AA5B1;
  --dim:#5F6B78;
  --warn:#D9924A;

  --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--room);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}

.wrap{max-width:1560px;margin:0 auto;padding:8px 16px 14px}
.layout{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
.colL{min-width:0;display:flex;flex-direction:column;gap:8px}
.colR{min-width:0;display:flex;flex-direction:column;gap:8px}

/* 右カラム：行動順のプレイヤー一覧 */
.roster{display:flex;flex-direction:column;gap:6px}
.rhead{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--dim);
  text-transform:uppercase;padding:0 2px;
}
.rrow{
  border:1px solid #33455A;border-left-width:3px;border-radius:3px;
  background:var(--felt-deep);padding:6px 10px;
  display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.rrow.now{background:#2C3E52;box-shadow:0 0 0 1px var(--warn) inset}
.rrow.done{opacity:.72}
.rrow .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.rrow .tags{display:flex;gap:4px;align-items:center}
.rrow .tg{
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;border-radius:2px;
  padding:1px 5px;border:1px solid currentColor;
}
.rrow .tg.p1{color:var(--muted)}
.rrow .tg.lead{color:var(--ivory)}
.rrow .tg.turn{color:var(--warn)}
.rrow .sc{font-family:var(--mono);font-size:19px;font-weight:700;text-align:right;line-height:1}
.rrow .bid{
  font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.02em;
  border:1px solid var(--brass);color:var(--brass);border-radius:3px;padding:1px 7px;
}
.rrow .bid.done{border-color:#79C08D;color:#79C08D}
.rrow .bid.over{border-color:#E06C75;color:#E06C75}
.rrow .conds{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;min-height:20px;margin-top:2px}
.rrow .act{
  grid-column:1/-1;font-size:11.5px;color:var(--ink);line-height:1.5;
  border-top:1px solid rgba(255,255,255,.07);padding-top:4px;margin-top:3px;
}
.rrow .act em{font-style:normal;font-family:var(--mono);font-weight:700}
.rrow .act.wait{color:var(--dim)}

.phasedlg{
  position:fixed;inset:0;z-index:55;display:flex;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(10,15,22,.72);backdrop-filter:blur(3px);
  animation:pdin .18s ease;
}
@keyframes pdin{from{opacity:0}to{opacity:1}}
.phasebox{
  background:var(--felt-deep);border:1px solid var(--brass);border-radius:6px;
  padding:22px 30px 20px;max-width:640px;width:100%;text-align:center;
  box-shadow:0 12px 44px rgba(0,0,0,.7);
}
.phasebox .ph-t{
  font-family:var(--mincho);font-size:19px;letter-spacing:.12em;
  color:var(--brass);margin-bottom:9px;
}
.phasebox .ph-m{font-size:14px;line-height:1.8;color:var(--ink);margin-bottom:6px}
.phasebox .ph-m b{color:var(--ivory);font-weight:700}
.phasebox .ph-s{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:14px}
/* 手番順の並び */
.ph-order{
  display:flex;gap:6px;align-items:center;justify-content:center;
  flex-wrap:wrap;margin:14px 0 4px;
}
.ph-order{gap:5px}
.ph-order .pchip{
  font-family:var(--mono);font-size:12px;font-weight:700;
  border:1.5px solid;border-radius:3px;padding:4px 8px;white-space:nowrap;
}
.ph-order .arw{color:var(--dim);font-size:12px}
.ph-order .brk{flex-basis:100%;height:0}
.ph-round{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);
  margin:10px 0 2px;
}
.phasebox .btn{margin-top:16px;padding:10px 30px}
.phskip{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:14px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none;
}
.phskip input{width:14px;height:14px;accent-color:var(--brass);cursor:pointer}
.phskip:hover{color:var(--ink)}
.phasebox .hintk{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-left:8px}

.startveil{
  position:fixed;inset:0;z-index:70;display:flex;
  align-items:center;justify-content:center;padding:24px 16px;overflow-y:auto;
  background:radial-gradient(ellipse 90% 70% at 50% 40%, #2B3F57 0%, #1B2836 55%, #0E141C 100%);
}
.startveil.off{display:none}
.startbox{
  max-width:520px;width:100%;text-align:center;
}
.stitle{
  font-family:var(--mincho);font-size:38px;letter-spacing:.14em;
  margin:0 0 4px;font-weight:600;color:var(--ivory);
}
.sprov{font-family:var(--sans);font-size:13px;color:var(--dim);letter-spacing:.06em;margin-left:8px}
.stag{
  font-size:13.5px;color:var(--brass);letter-spacing:.04em;margin:0 0 22px;line-height:1.7;
}
.snote{
  font-size:11.5px;color:var(--muted);line-height:1.75;text-align:left;
  border:1px solid #33455A;border-radius:4px;background:rgba(0,0,0,.22);
  padding:11px 15px;margin-bottom:20px;
}
.snote b{color:var(--ivory)}
.srow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.sopt{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.sopt label{font-size:10.5px;color:var(--dim);letter-spacing:.1em;font-family:var(--mono)}
.sopt select{min-width:132px}
.sbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn.big{padding:13px 40px;font-size:15px;letter-spacing:.08em}

.glossveil{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(8,12,18,.82);backdrop-filter:blur(3px);
  align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;
}
.glossveil.on{display:flex}
.helpveil{
  position:fixed;inset:0;z-index:80;display:none;
  background:rgba(8,12,18,.82);backdrop-filter:blur(3px);
  align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;
}
.helpveil.on{display:flex}
.helpbox{
  background:var(--felt-deep);border:1px solid var(--brass);border-radius:6px;
  max-width:760px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.7);
}
.helphead{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 20px;border-bottom:1px solid #33455A;position:sticky;top:0;
  background:var(--felt-deep);border-radius:6px 6px 0 0;z-index:2;
}
.helphead h2{margin:0;font-family:var(--mincho);font-size:18px;letter-spacing:.14em}
.helpbody{padding:16px 22px 26px;font-size:13.5px;line-height:1.8;color:var(--ink)}
.helpbody h3{
  font-size:14px;margin:22px 0 7px;padding-bottom:4px;letter-spacing:.06em;
  border-bottom:1px solid #33455A;color:var(--brass);font-weight:600;
}
.helpbody h4{font-size:13px;margin:14px 0 3px;color:var(--ivory);font-weight:600}
.helpbody p{margin:5px 0}
.helpbody ul,.helpbody ol{margin:5px 0;padding-left:1.4em}
.helpbody li{margin:3px 0}
.helpbody b{color:var(--ivory);font-weight:600}
.hnote{
  border:1px solid var(--warn);border-radius:4px;background:rgba(217,146,74,.08);
  padding:10px 14px;font-size:12.5px;line-height:1.7;color:var(--muted);margin-bottom:6px;
}
.hnote b{color:var(--warn)}
.glossveil .helpbody{padding-top:8px}
.glossveil .glcat:first-of-type{margin-top:4px}
.cardguide{
  display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center;
  border:1px solid #33455A;border-radius:4px;background:rgba(0,0,0,.2);
  padding:14px 16px;margin:8px 0 4px;
}
.cardguide .cg{display:flex;gap:8px;align-items:flex-end}
.cardguide .cgtxt{font-size:12.5px;line-height:1.7;color:var(--muted)}
.cardguide .cgtxt b{color:var(--ivory);font-weight:600}
.cardguide .cgtxt .mk{
  font-family:var(--mono);font-weight:700;color:var(--brass);
}
.chipguide{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
@media (max-width:640px){ .cardguide{grid-template-columns:1fr} }

.inlsuit{
  display:inline-block;vertical-align:-3px;margin:0 1px;
}
.inlmk{
  display:inline-block;vertical-align:0;margin:0 2px;
  background:#12161C;border:1px solid #3A4A5E;border-radius:2px;padding:1px 0;
}
.hgloss{
  border:1px solid #3A4A5E;border-radius:4px;background:rgba(255,255,255,.03);
  margin:22px 0 4px;
}
.hgloss summary{
  padding:11px 16px;cursor:pointer;font-size:13.5px;font-weight:600;
  color:var(--ivory);user-select:none;
}
.hgloss summary:hover{background:rgba(255,255,255,.04)}
.glcat{
  font-size:12px;letter-spacing:.1em;color:var(--brass);font-weight:600;
  margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid #33455A;
}
dl.gl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:baseline}
dl.gl dt{
  font-weight:600;color:var(--ivory);font-size:12.5px;white-space:nowrap;
  padding:5px 0 5px;border-top:1px solid rgba(255,255,255,.05);
}
dl.gl dd{
  margin:0;font-size:12.5px;color:var(--muted);line-height:1.7;
  padding:5px 0 5px;border-top:1px solid rgba(255,255,255,.05);
}
dl.gl dt:first-of-type,dl.gl dd:first-of-type{border-top:0}
dl.gl dd b{color:var(--ink)}
@media (max-width:640px){
  dl.gl{grid-template-columns:1fr;gap:0}
  dl.gl dd{padding-top:0;border-top:0;padding-bottom:8px}
}

.hgoal{
  border:1px solid var(--brass);border-radius:5px;
  background:rgba(201,162,39,.07);padding:13px 17px;margin:14px 0 4px;
}
.hgt{
  font-family:var(--mincho);font-size:15px;letter-spacing:.1em;color:var(--brass);
  margin-bottom:6px;font-weight:600;
}
.hgoal p{margin:6px 0}
.hgw{
  border-left:2px solid var(--warn);padding-left:10px;color:var(--muted);
}
.hgw b{color:var(--warn)}
.hgex{
  margin:10px 0 8px;border:1px solid #33455A;border-radius:4px;
  background:rgba(0,0,0,.22);padding:8px 12px;
}
.hgexr{display:flex;gap:12px;align-items:baseline;font-size:12.5px;padding:3px 0;line-height:1.6}
.hgexr .lbl{
  font-family:var(--mono);font-size:12px;color:var(--ivory);
  border:1px solid #46586E;border-radius:3px;padding:1px 8px;white-space:nowrap;flex:0 0 auto;
}
@media (max-width:640px){ .hgexr{flex-direction:column;gap:2px} }

.hbasic{
  border:1px solid #3A4A5E;border-radius:4px;background:rgba(255,255,255,.03);
  margin:14px 0 4px;
}
.hbasic summary{
  padding:11px 16px;cursor:pointer;font-size:13.5px;font-weight:600;
  color:var(--ivory);user-select:none;
}
.hbasic summary:hover{background:rgba(255,255,255,.04)}
.hin{padding:2px 18px 16px;border-top:1px solid #33455A}
.hin .ex{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  background:rgba(0,0,0,.25);border-radius:3px;padding:6px 10px;margin:6px 0;
}
.hin .hend{
  margin-top:14px;padding-top:10px;border-top:1px solid #33455A;color:var(--muted);
}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.hcell{border:1px solid #33455A;border-radius:4px;padding:10px 13px;background:rgba(0,0,0,.18)}
.hct{font-weight:700;color:var(--brass);margin-bottom:4px;font-size:13px}
.hsub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.65}
.hnb{font-size:12.5px;color:var(--muted);margin-top:6px}
.hflow li{margin:5px 0}
.hui li{font-size:13px}
@media (max-width:640px){ .hgrid{grid-template-columns:1fr} }

.narrowwarn{
  display:none;
  border:1px solid var(--warn);border-radius:3px;
  background:rgba(217,146,74,.10);color:var(--warn);
  font-size:11.5px;line-height:1.5;padding:7px 11px;margin-bottom:8px;
}
@media (max-width:1180px){ .narrowwarn{display:block} }

.roundsnote{
  font-family:var(--sans);font-size:11px;color:var(--muted);
  padding:0 2px 6px;line-height:1.5;
}
.prov{
  font-family:var(--sans);font-size:11px;color:var(--dim);
  letter-spacing:.06em;align-self:center;
}
.dealtag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);
  border:1px solid #33455A;border-radius:3px;padding:5px 10px;background:var(--felt-deep);
}
.dealtag b{color:var(--ivory);font-weight:700}

/* ── 見出し ── */
.masthead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:7px}
.masthead h1{
  margin:0;font-family:var(--mincho);font-weight:600;
  font-size:17px;letter-spacing:.22em;
}
.masthead .ver{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em}
.masthead .spacer{flex:1}
.modelab{font-size:11px;color:var(--muted)}
.sel-mode{
  background:var(--felt-deep);color:var(--ink);border:1px solid #3A4A5E;
  border-radius:3px;padding:5px 8px;font-size:12px;font-family:inherit;
}
.btn{
  border:1px solid #3A4A5E;background:var(--felt-deep);border-radius:3px;
  padding:7px 14px;font-size:12.5px;transition:border-color .15s,background .15s;
}
.btn:hover{border-color:var(--ivory);background:#2C3E52}
.btn.primary{border-color:var(--brass)}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ── トラック（欄干） ── */
.rail-t{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--dim);
  text-transform:uppercase;margin:0 0 4px;
}
.board{
  display:grid;grid-template-columns:64px repeat(var(--ntrick,15),1fr);
  gap:2px;font-family:var(--mono);
}
/* 行ラベル（左端） */
.bl{
  display:flex;align-items:center;gap:5px;padding:0 6px;
  font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;
  border-right:1px solid #33455A;
}
.bl.plr{border-left:3px solid transparent;border-radius:2px 0 0 2px}
.bl .who{font-weight:700;font-size:11.5px;letter-spacing:.02em}
/* ビッドタイル */
.bidtile{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:20px;border-radius:3px;
  border:1.5px solid var(--brass);color:var(--brass);
  font-size:13px;font-weight:700;line-height:1;flex:0 0 auto;
}
.bidtile.none{border-color:#3A4A5E;color:var(--dim);font-size:11px}
.bidtile.done{border-color:#79C08D;color:#79C08D;background:rgba(121,192,138,.14)}
.bidtile.over{border-color:#E06C75;color:#E06C75;background:rgba(224,108,117,.12)}

/* 布石スロット */
.track{display:contents}
/* プレイヤー行のマス */
.tk{
  border:1px solid rgba(255,255,255,.05);border-radius:2px;
  background:rgba(0,0,0,.14);min-height:23px;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s;
}
.tk.past{opacity:.5}
.tk.now{border-color:var(--ivory);background:rgba(244,237,222,.07)}
/* 獲得マーカー（10mm角ガラスタイル相当） */
.mk{
  width:17px;height:17px;border-radius:2px;
  box-shadow:0 1px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35);
  animation:mkin .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes mkin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.slot{
  border:1px solid #33455A;border-radius:2px;background:var(--felt-deep);
  min-height:44px;padding:2px;display:flex;flex-direction:column;gap:2px;
  transition:border-color .2s,opacity .2s;position:relative;
}
.slot .no{font-family:var(--mono);font-size:11px;color:#8B96A4;text-align:center;line-height:1.25}
.slot.past{opacity:.35}
.slot.now{border-color:var(--ivory)}
.slot.pick{cursor:pointer;border-color:var(--warn)}
.slot.pick:hover{background:#33455A}
.slot.blocked{opacity:.28;cursor:not-allowed}
.chipline{
  font-family:var(--mono);font-size:11px;line-height:1.45;border-radius:3px;
  border:1px solid;padding:2px 3px;text-align:center;letter-spacing:.02em;
  background:rgba(0,0,0,.25);
}
.chipline .du{margin-left:2px;font-size:9.5px;letter-spacing:0}
.chipline .ow{
  margin-left:5px;font-size:9.5px;opacity:.8;letter-spacing:0;
  padding-left:4px;border-left:1px solid currentColor;
}
.mini .du{margin-left:3px;font-size:11px;letter-spacing:0;opacity:.9}
.raillegend{
  font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.04em;
  display:inline-flex;gap:10px;align-items:center;margin-left:10px;
}
.raillegend i{font-style:normal;display:inline-flex;align-items:center;gap:3px}
.lgbox{display:inline-block;width:16px;height:9px;border:1px solid var(--muted);border-radius:2px}
.lgbox.fill{background:var(--muted)}
.slot .win{font-family:var(--mono);font-size:10px;text-align:center;color:var(--muted)}
.slot .shield{
  position:absolute;top:1px;right:2px;font-size:8px;color:var(--warn);
  font-family:var(--mono);letter-spacing:.05em;
}

/* ── 卓 ── */
.tableframe{
  border-radius:12px;padding:7px;
  background:linear-gradient(160deg,var(--rail-hi),var(--rail) 40%,#3A2C1E);
  box-shadow:0 6px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
  margin-bottom:10px;
}
.table{
  position:relative;border-radius:8px;overflow:hidden;
  background:
    radial-gradient(ellipse 130% 90% at 50% 46%, #2B3F57 0%, var(--felt) 55%, var(--felt-deep) 100%);
  min-height:392px;
  display:grid;
  grid-template-columns:168px 1fr 168px;
  grid-template-rows:84px 1fr 138px;
  grid-template-areas:
    "corner-a north corner-b"
    "west     center east"
    "south    south  south";
}
/* 署名：卓に落ちる光 */
.table::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 46% at 50% 44%, rgba(201,162,39,.20), rgba(201,162,39,0) 70%);
  transition:opacity .7s ease;
  opacity:1;
}
.table::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 46% at 50% 44%, rgba(205,212,221,.20), rgba(205,212,221,0) 70%);
  transition:opacity .7s ease;
  opacity:0;
}
body[data-rank="R"] .table::before{opacity:0}
body[data-rank="R"] .table::after{opacity:1}

/* 座席 */
.seat{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px}
.seat-n{grid-area:north;flex-direction:column}
.seat-w{grid-area:west;justify-content:center;align-items:flex-start;padding-left:8px}
.seat-e{align-items:flex-end;padding-right:8px}
.seat-w .plate,.seat-e .plate{white-space:nowrap}
.seat-w .minis,.seat-e .minis{justify-content:flex-start}
.seat-e .minis{justify-content:flex-end}
.seat-e{grid-area:east;justify-content:center}
.seat-s{grid-area:south;justify-content:flex-end;padding-bottom:10px}

.plate{
  display:flex;align-items:center;gap:8px;
  background:rgba(12,18,26,.72);border:1px solid rgba(255,255,255,.12);
  border-radius:4px;padding:5px 12px;backdrop-filter:blur(2px);
  transition:border-color .25s, box-shadow .25s;
}
.plate .nm{font-size:14.5px;font-weight:600;letter-spacing:.04em}
.plate .won{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--ivory)}
.plate .p1{
  font-family:var(--mono);font-size:10px;color:var(--room);
  background:var(--muted);border-radius:2px;padding:0 4px;letter-spacing:.08em;
}
.plate .spent{font-size:11px;color:var(--dim)}
.seat.lead .plate{border-color:var(--ivory);box-shadow:0 0 10px rgba(244,237,222,.25)}
.leadmark{
  font-family:var(--mincho);font-size:10px;color:var(--ivory);letter-spacing:.3em;
  opacity:0;transition:opacity .25s;
}
.seat.lead .leadmark{opacity:1}

.backs{display:flex;gap:0}
.backs .cardback{margin-left:-15px}
.backs .cardback:first-child{margin-left:0}
.seat-w .backs,.seat-e .backs{flex-direction:column}
.seat-w .backs .cardback,.seat-e .backs .cardback{margin-left:0;margin-top:-27px}
.seat-w .backs .cardback:first-child,.seat-e .backs .cardback:first-child{margin-top:0}

.minis{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:20px}
.mini{
  font-family:var(--mono);font-size:14px;border:1.5px solid;border-radius:3px;
  padding:3px 9px;background:rgba(12,18,26,.6);letter-spacing:.03em;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.mini.R{border-color:var(--verdigris);color:var(--verdigris)}

/* 中央 */
.center{grid-area:center;position:relative;z-index:2}
.lens{
  position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
  width:86px;height:86px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:radial-gradient(circle at 42% 36%, rgba(255,255,255,.10), rgba(0,0,0,.32));
  border:1px solid rgba(244,237,222,.28);
  box-shadow:0 2px 14px rgba(0,0,0,.4), inset 0 0 22px rgba(0,0,0,.35);
  pointer-events:none;
}
.lens .kanji{
  font-family:var(--mincho);font-size:30px;line-height:1;font-weight:600;
  transition:color .5s;
}
.lens .kanji.N{color:var(--brass)} .lens .kanji.Rv{color:var(--verdigris)}
.lens .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.lens .trump{font-size:19px;line-height:1.15}
.lens .trump .none{color:var(--dim);font-size:10px;font-family:var(--mono)}

/* 出札：座席方向に配置 */
.played{position:absolute;z-index:3;transition:transform .32s cubic-bezier(.2,.7,.3,1),opacity .32s}
.played.pos-s{left:50%;bottom:6px;transform:translateX(-50%) rotate(1.5deg)}
.played.pos-w{left:12px;top:50%;transform:translateY(-50%) rotate(-3deg)}
.played.pos-n{left:50%;top:6px;transform:translateX(-50%) rotate(-1.5deg)}
.played.pos-e{right:12px;top:50%;transform:translateY(-50%) rotate(3deg)}
.played .who{
  font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-bottom:3px;
}
.played.winner .who{color:var(--ivory);font-weight:700}
.played.enter-s{transform:translateX(-50%) translateY(60px) rotate(1.5deg);opacity:0}
.played.enter-w{transform:translateY(-50%) translateX(-60px) rotate(-3deg);opacity:0}
.played.enter-n{transform:translateX(-50%) translateY(-60px) rotate(-1.5deg);opacity:0}
.played.enter-e{transform:translateY(-50%) translateX(60px) rotate(3deg);opacity:0}

/* ── SVGカード ── */
.svgcard{display:block;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.svgcard.win{box-shadow:0 0 0 2px var(--ivory), 0 2px 10px rgba(0,0,0,.5)}
.svgcard.tr{box-shadow:0 0 0 2px currentColor, 0 2px 8px rgba(0,0,0,.5)}
.cardback{display:block;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* ── 手札 ── */
.handrow{display:flex;justify-content:center;align-items:flex-end;gap:0;padding:0 8px}
.hcard{margin-left:-18px;transition:transform .16s;position:relative}
.hcard:first-child{margin-left:0}
.hcard.playable{cursor:pointer}
.hcard.playable:hover{transform:translateY(-16px);z-index:5}
.hcard.illegal{opacity:.32}
.hcard.illegal .svgcard{filter:grayscale(.5)}

/* ── 帯（プロンプト） ── */
.prompt{
  border:1px solid #3A4A5E;border-left:3px solid var(--warn);border-radius:3px;
  background:var(--felt-deep);padding:9px 12px;
}
.prompt .q{font-size:13.5px;font-weight:600}
.prompt .h{font-size:11.5px;color:var(--muted);margin-top:1px}
.prompt .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin-top:8px}
.pool{display:flex;gap:6px;flex-wrap:wrap}

/* ── 条件カード（SVG） ── */
.condwrap{position:relative;transition:transform .16s}
.condwrap.sel{cursor:pointer}
.condwrap.sel:hover{transform:translateY(-5px)}
.condwrap.chosen .condsvg{box-shadow:0 0 0 2px var(--ivory)}
.condwrap.blocked{opacity:.3;cursor:not-allowed}
.condwrap.usedout{opacity:.3}
.condsvg{display:block;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.45)}

/* ── 記録 ── */
details.logbox{
  border:1px solid #33455A;border-radius:3px;background:var(--felt-deep);
  margin-bottom:10px;
}
details.logbox summary{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);
  padding:7px 12px;cursor:pointer;user-select:none;
}
.log{
  padding:4px 12px 10px;max-height:180px;overflow-y:auto;
  font-family:var(--mono);font-size:11px;
}
.log div{padding:1.5px 0;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.04)}
.log .hl{color:var(--ink)}
.log .ev{color:var(--warn)}
.log .tk{color:var(--dim);margin-top:5px;letter-spacing:.06em}
.ticker{
  font-family:var(--mono);font-size:11px;color:var(--ink);
  border-left:3px solid var(--brass);background:rgba(201,162,39,.07);
  padding:5px 10px;min-height:26px;line-height:1.4;
  display:flex;align-items:center;border-radius:0 3px 3px 0;
}
.ticker:empty{display:none}

/* ── 得点表（常時表示） ── */
.paytable{
  display:flex;align-items:stretch;
  border:1px solid #33455A;border-radius:3px;background:var(--felt-deep);
  overflow:hidden;font-family:var(--mono);
}
.paytable .ttl{
  display:flex;flex-direction:column;justify-content:center;
  padding:5px 11px;font-size:11px;letter-spacing:.1em;color:#A3AEBC;
  border-right:1px solid #33455A;white-space:nowrap;line-height:1.6;
}
.paytable .ttl b{color:var(--ivory);font-size:12px;font-weight:600;letter-spacing:.04em}
.ptlabels{display:flex;flex-direction:column;text-align:right;
  border-right:1px solid #33455A;padding:0 10px 0 11px;justify-content:flex-end}
.ptlabels div{font-size:12px;color:#A3AEBC;line-height:1.5;padding:2px 0;white-space:nowrap}
.ptlabels div.l-hit{color:#F0637A;font-weight:600}
.ptlabels div.l-n1{color:#E8C15A}
.ptlabels div.l-n2{color:#C9B98A}
.ptgrid{display:flex;flex:1}
.ptcol{
  flex:1;display:flex;flex-direction:column;text-align:center;
  border-right:1px solid rgba(255,255,255,.06);min-width:0;
}
.ptcol:last-child{border-right:0}
.ptcol .b{font-size:14px;font-weight:700;padding:3px 0 2px;color:var(--ivory);
  background:rgba(255,255,255,.06);line-height:1.25}
.ptcol .v{font-size:14px;padding:2px 0;line-height:1.4;font-weight:600}
.ptcol .v.hit{color:#F0637A;font-weight:700}
.ptcol .v.n1{color:#E8C15A}
.ptcol .v.n2{color:#C9B98A;font-size:13px;font-weight:400}
.ptcol .who{font-size:11px;line-height:1.35;padding:2px 0 3px;min-height:17px;
  font-family:var(--mono);letter-spacing:.02em;font-weight:600}
.ptcol.mine{background:rgba(240,99,122,.13)}
.ptcol.mine .b{background:rgba(240,99,122,.22)}
.ptcol.taken{opacity:.32}

/* ── 座席トースト（誰が何をしたか） ── */
.seattoast{
  position:absolute;z-index:14;pointer-events:none;
  background:rgba(8,13,20,.95);border:1px solid;border-radius:5px;
  padding:7px 13px;max-width:230px;
  box-shadow:0 5px 20px rgba(0,0,0,.6);
  font-size:12.5px;line-height:1.5;
  opacity:0;transition:opacity .18s,transform .18s;
}
.seattoast.on{opacity:1}
.seattoast .who{font-weight:700;font-size:12.5px;display:block;margin-bottom:1px}
.seattoast .act{color:var(--ink);font-family:var(--sans)}
.seattoast .act em{font-style:normal;font-family:var(--mono);font-weight:700}
.seattoast::after{
  content:"";position:absolute;width:9px;height:9px;
  background:rgba(8,13,20,.95);border:1px solid;border-color:inherit;
  transform:rotate(45deg);
}
/* 位置：南＝手札の上／西・東＝内側／北＝下 */
.seattoast.at-s{left:50%;bottom:150px;transform:translateX(-50%) translateY(6px)}
.seattoast.at-s.on{transform:translateX(-50%) translateY(0)}
.seattoast.at-s::after{left:50%;margin-left:-5px;bottom:-5px;border-top:0;border-left:0}
.seattoast.at-n{left:50%;top:104px;transform:translateX(-50%) translateY(-6px)}
.seattoast.at-n.on{transform:translateX(-50%) translateY(0)}
.seattoast.at-n::after{left:50%;margin-left:-5px;top:-5px;border-bottom:0;border-right:0}
.seattoast.at-w{left:20px;top:50%;transform:translateY(-50%) translateX(-6px)}
.seattoast.at-w.on{transform:translateY(-50%) translateX(0)}
.seattoast.at-w::after{left:22px;top:-5px;border-bottom:0;border-right:0}
.seattoast.at-e{right:20px;top:50%;transform:translateY(-50%) translateX(6px)}
.seattoast.at-e.on{transform:translateY(-50%) translateX(0)}
.seattoast.at-e::after{right:22px;top:-5px;border-bottom:0;border-right:0}

/* 勝利カードの強調 */
.svgcard.win{
  box-shadow:0 0 0 3px var(--ivory), 0 0 22px rgba(244,237,222,.55), 0 2px 10px rgba(0,0,0,.5);
}
.played.winner{ z-index:6 }
.played.winner .svgcard{ transform:scale(1.10); transition:transform .2s }

/* 解決の説明文 */
.offerstrip{flex-direction:column;align-items:center;gap:9px;max-width:min(94%,660px)}
.offerstrip .srow{display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.offerstrip .expl{
  font-family:var(--sans);font-size:11.5px;color:var(--muted);line-height:1.65;
  border-top:1px solid #33455A;padding-top:8px;width:100%;text-align:left;
}
.offerstrip .expl b{color:var(--ink);font-weight:600}
.offerstrip .expl .ok{color:#79C08D}
.offerstrip .expl .ng{color:var(--dim)}

/* ── リアクティブ判断ポップアップ（手札の直上） ── */
.reactpop{
  position:absolute;left:50%;bottom:132px;transform:translateX(-50%);z-index:9;
  background:rgba(8,13,20,.95);border:1px solid var(--warn);
  border-radius:6px;padding:10px 16px;
  box-shadow:0 8px 28px rgba(0,0,0,.6);
  display:flex;align-items:center;gap:18px;
  animation:popin .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes popin{from{opacity:0;transform:translateX(-50%) translateY(12px)}
                 to{opacity:1;transform:translateX(-50%) translateY(0)}}
.reactpop .rtext{display:flex;flex-direction:column;gap:3px}
.reactpop .rq{font-size:14px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.reactpop .rh{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.55;white-space:nowrap}
.reactpop .rh b{color:var(--warn);font-weight:600}
.reactpop .rrow{display:flex;gap:9px;align-items:center}
.reactpop .btn{padding:12px 18px;font-size:13px;white-space:nowrap}

/* ── リアクティブ解決の可視化 ── */
body[data-resolve="1"] .seat .plate,
body[data-resolve="1"] .seat .minis,
body[data-resolve="1"] .seat .leadmark,
body[data-resolve="1"] .lens{
  opacity:.18;transition:opacity .18s;
}
.offerstrip{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;
  display:flex;gap:9px;align-items:flex-start;
  background:rgba(8,13,20,.86);border:1px solid #46586E;border-radius:5px;
  padding:8px 12px 7px;backdrop-filter:blur(3px);
  box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.offerstrip .hdr{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);
  writing-mode:vertical-rl;text-orientation:upright;margin-right:2px;
}
.offitem{display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:opacity .35s,transform .35s}
.offitem .who{font-family:var(--mono);font-size:12px;color:var(--ink)}
.offitem .body{
  font-family:var(--mono);font-size:14px;border:1.5px solid;border-radius:4px;
  padding:5px 11px;white-space:nowrap;
}
.offitem .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.offitem.pending .tag{color:var(--dim)}
.offitem.win{transform:translateY(-3px)}
.offitem.win .body{box-shadow:0 0 0 2px #79C08D}
.offitem.win .tag{color:#79C08D;font-weight:700}
.offitem.lose{opacity:.34}
.offitem.lose .tag{color:var(--dim)}
.offitem.placed .who{color:var(--warn)}
.offitem.placed .tag{color:var(--warn)}

.changebanner{
  border:1px solid var(--brass);border-radius:4px;background:rgba(201,162,39,.10);
  padding:7px 16px;font-family:var(--mono);font-size:13px;
  text-align:center;line-height:1.6;
}
.changebanner .arrow{color:var(--dim);margin:0 7px}
.offerstrip .closewrap{
  display:flex;align-items:center;padding-left:12px;margin-left:4px;
  border-left:1px solid #46586E;align-self:stretch;
}
.offerstrip .closewrap .btn{
  padding:10px 18px;font-size:13px;border-color:var(--brass);white-space:nowrap;
}
.offerstrip .closewrap .btn:hover{background:#3A3320;border-color:var(--ivory)}
.offerstrip .closewrap .hint{
  font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-left:8px;
}
.changebanner .to{font-weight:700}

/* ── ビッド・スコア ── */
.scorebar{
  display:flex;gap:6px;flex-wrap:wrap;align-items:stretch;margin-bottom:10px;
}
.scard{
  flex:1 1 0;min-width:120px;border:1px solid #33455A;border-radius:3px;
  background:var(--felt-deep);padding:7px 10px;transition:border-color .2s;
}
.scard.me{border-color:#4B6076}
.scard.leadn{border-color:var(--brass)}
.scard .nm{font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center}
.scard .tot{font-family:var(--mono);font-size:25px;font-weight:700;line-height:1.1}
.scard .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dealtag{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);
  border:1px solid #33455A;border-radius:3px;padding:6px 10px;display:flex;
  flex-direction:column;justify-content:center;background:var(--felt-deep);
}
.dealtag b{color:var(--ivory);font-size:15px;font-weight:700}

.bidbtns{display:flex;gap:4px;flex-wrap:wrap}
.bidbtn{
  min-width:44px;border:1px solid #3A4A5E;background:#12161C;border-radius:3px;
  padding:6px 0 5px;font-family:var(--mono);font-size:15px;text-align:center;
  transition:background .12s,border-color .12s;
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15;
}
.bidbtn .pt{font-size:9.5px;color:var(--muted)}
.bidbtn:hover{background:#2C3E52;border-color:var(--ivory)}
.bidbtn:hover .pt{color:var(--ivory)}
.bidbtn.taken{opacity:.25;cursor:not-allowed;background:#0D1117}
.bidbtn.taken:hover{background:#0D1117;border-color:#3A4A5E}
.bidnote{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px}

.plate .bidbadge{
  font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.03em;
  border:1px solid var(--brass);color:var(--brass);border-radius:3px;padding:1px 7px;
}
.plate .bidbadge.done{border-color:var(--ok,#79C08D);color:#79C08D}
.plate .bidbadge.over{border-color:#E06C75;color:#E06C75}

/* ── 結果 ── */
.resultveil{
  position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(10,15,22,.72);backdrop-filter:blur(2px);
}
.result{
  background:var(--felt-deep);border:1px solid var(--brass);border-radius:6px;
  padding:20px 24px;max-width:560px;width:calc(100% - 40px);
}
.result h2{margin:0 0 8px;font-family:var(--mincho);font-size:19px;letter-spacing:.12em}
.result .line{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:7px;margin-top:14px}
.metric{border:1px solid #33455A;border-radius:2px;padding:6px 8px}
.metric .k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--dim)}
.metric .v{font-family:var(--mono);font-size:15px;font-weight:600}

@media (max-width:1180px){
  .layout{grid-template-columns:1fr}
}
@media (max-width:900px){
  .table{grid-template-columns:96px 1fr 96px;grid-template-rows:104px 1fr 160px;min-height:490px}
  .track{grid-template-columns:repeat(8,1fr)}
  .hcard{margin-left:-30px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

  <div class="startveil" id="startveil">

              すでに逆なら、もう1枚出すと正に戻ります。</div>
          </div>
          <div class="hcell">
            <div class="hct">切り札の条件</div>
            <div><b>なし</b>：切り札がない（最初の状態）<br>
                 <b>{{s0}}水 {{s1}}火 {{s2}}地 {{s3}}風</b>：そのスートが最強になる</div>

          </div>
        </div>
        <p>この2つは<b>別々に動きます。</b>「数字が小さい方が勝つ、ただし火は最強」という状態もあります。</p>

          <li><b>1T</b>：そのトリックだけ有効。終わると元（正・切り札なし）に戻ります</li>
          <li><b>継続</b>：同じ種類の条件カードが次に発動するまで、ずっと有効です</li>
        </ul>
        <p class="hnb">※ 同じ種類の条件カードが発動すると、それまでのカードは種類を問わず捨てられます。
        つまり有効な条件カードは、ランク・切り札それぞれ常に1枚だけです。
        継続効果のカードも、1T効果のカードが出た後は捨てられて初期状態の条件に戻ります。</p>

        <h3>1戦の流れ</h3>

          <li><b>配札</b>　60枚を15枚ずつ配ります</li>
          <li><b>ドラフト</b>　手札を見てから、12枚の条件カードを順番に1枚ずつ取ります（各自3枚）</li>
          <li><b>布石</b>　3枚のうち1枚を、1〜15のどのトリックで発動させるか決めて置きます（全員に公開）</li>
          <li><b>宣言</b>　自分が何トリック取るかを宣言します（<b>他の人と同じ数は選べません</b>）</li>
          <li><b>プレイ</b>　15トリックを戦います</li>
          <li><b>得点</b>　宣言した数と実際に取った数を照合します</li>
        </ol>

        <h3>布石とリアクティブ</h3>
        <p>取った3枚の条件カードは、次のように使い分けます。</p>
        <ul>
          <li><b>布石（1枚）</b>　開始前に「このトリックで発動する」と予約。<b>必ず発動します</b></li>
          <li><b>リアクティブ（2枚）</b>　プレイ中、好きなトリックで出せます。<b>発動できるのは1枚だけ</b>で、
              残る1枚は使われずに終わります</li>
        </ul>
        <p class="hnb">※ 布石が置かれているトリックには、<b>同じ種類の</b>リアクティブは出せません（保護されます）。
        違う種類なら出せるので、たとえば「切り札 火 が布石されたトリックに、逆転を重ねる」ことは可能です。</p>

        <h3>リアクティブの解決</h3>
        <p>各トリックの開始前、全員が<b>同時に</b>カードを出すか出さないかを選びます。
        同じ種類のカードが重なった場合は、<b>リードプレイヤーに近い人だけが発動</b>します。</p>
        <p>負けた人のカードは<b>手元に戻る</b>ので、次のトリック以降でまた出せます。損はしません。</p>

        <h3>得点</h3>
        <p>ぴったり合えば満額、1つずれれば部分点、2つずれても少し入ります。<b>3つ以上ずれると0点</b>です。</p>
        <p><b>宣言が極端（0 や 8以上）なほど高得点</b>です。3〜4 トリックが最も当てやすい代わりに点は低く、
        当てにくい宣言ほど見返りが大きくなっています。画面の得点表をいつでも参照してください。</p>

        <h3>勝敗</h3>
        <p>選んだ戦数（1〜4戦）を終えた時点で、合計点が最も高い人の勝ちです。
        1戦ごとに先手（P1）が1人ずつ移ります。</p>

        <h3>画面の見かた</h3>
        <ul class="hui">
          <li><b>卓の中央の丸</b>　今の条件。「正／逆」と切り札スートが出ます。卓の光の色も変わります</li>
          <li><b>卓の下の帯</b>　15トリックのトラック。布石されたカードと、そのトリックの勝者が並びます</li>
          <li><b>その下の表</b>　得点表。誰がどの数を宣言したかも表示されます</li>
          <li><b>右の一覧</b>　行動順に並んだプレイヤー。手番と直前の行動が分かります</li>
          <li><b>塗りつぶし／枠のみ</b>　条件カードの継続／1T の区別です</li>
        </ul>

  helpBody:`
        <div class="hnote">
          <b>This is a playtest build, made to try out the design.</b> The title is provisional.
          The suit artwork ({{s0}}Aqua, {{s1}}Fire, {{s2}}Earth, {{s3}}Wind) and the numbers
          are placeholders; the finished game will use a refined design.
          Card counts, scoring and flow are all still being worked on and may change.<br>
          <b>Best on a desktop or a tablet in landscape.</b>
          It runs on a phone, but the screen is too cramped to play comfortably.
        </div>

        <div class="hgoal">
          <div class="hgt">The goal</div>
          <p><b>You call how many of the 15 tricks you will win, then try to land on that number.</b></p>
          <p>A round is 15 tricks. Before play begins, each player names the number of tricks
          they expect to win. <b>Hit it exactly and you score well.</b> Being off by one or two
          still pays something, but <b>being off by three or more scores nothing</b>.</p>
          <p class="hgw"><b>Winning more is not better.</b>
          If you called 3 and take 4, your score drops. Knowing when <i>not</i> to win
          matters just as much as winning.</p>
          <p>Each bid number has its own payout, and <b>the harder a number is to hit,
          the more it pays</b>. The full table is always on screen. Some examples:</p>

          <div class="hgex">
            <div class="hgexr"><span class="lbl">Bid 4</span>
              <span>Exact <b>5</b> / off by one 2　── easiest to hit, lowest payout</span></div>
            <div class="hgexr"><span class="lbl">Bid 0</span>
              <span>Exact <b>10</b> / off by one 7　── win nothing at all</span></div>
            <div class="hgexr"><span class="lbl">Bid 8</span>
              <span>Exact <b>8</b> / off by one 5　── take most of the table</span></div>
          </div>

          <p>What makes that number hard to predict is the twist:
          <b>the winning conditions themselves change during play</b> —
          and it is the players who change them.</p>
        </div>

        <details class="hbasic">
          <summary>New to trick-taking games? Start here</summary>
          <div class="hin">
            <p>This is a <b>trick-taking</b> game. Here are the basics.
            Skip this section if you already know them.</p>

            <h4>A trick: everyone plays one card, the strongest takes them all</h4>
            <p>Each of the four players plays one card from hand, in turn order.
            Once all four are down, whoever played the strongest card
            <b>takes all four</b>. That single exchange is called a <b>trick</b>.</p>
            <p>With 15 cards each, a round runs for 15 tricks.</p>

            <h4>The lead sets the suit</h4>
            <p>The player who plays first is the <b>lead player</b>. The suit of their card
            (Aqua, Fire, Earth or Wind) becomes the <b>led suit</b> for that trick.</p>

            <h4>Follow suit if you can</h4>
            <p>The other three players <b>must play the led suit if they hold any</b>.
            This is called following suit. With none of that suit, you may play anything.</p>

            <h4>Only the led suit can win</h4>
            <p>Cards outside the led suit cannot win, no matter how high.
            If {{s0}}Aqua is led, Aqua 3 beats Fire 15.</p>
            <p class="ex">Aqua 5 (lead) → Aqua 12 → Fire 15 → Aqua 3　→　<b>Aqua 12</b> wins</p>

            <h4>Trump: one suit outranks everything</h4>
            <p>When a trump suit is set — say {{s1}}Fire — <b>every Fire card beats every card
            of any other suit</b>. A player who cannot follow suit can win the trick
            simply by playing a trump.</p>
            <p class="ex">Trump Fire: Aqua 5 (lead) → Aqua 12 → Fire 15 → Aqua 3　→　<b>Fire 15</b> wins</p>
            <p>There is also a no-trump state, where no suit is trump.</p>

            <h4>The winner leads next</h4>
            <p>Whoever takes a trick plays first in the next one, which means
            <b>winning lets you keep choosing the led suit</b>.</p>

            <p class="hend">That is trick-taking in general. This game adds one thing on top:
            <b>the rules for who wins can change from trick to trick.</b></p>
          </div>
        </details>

        <h3>What makes this game different</h3>
        <p>In a normal trick-taking game, conditions like "higher wins" and "hearts are trump"
        stay fixed for the whole game. Here, <b>the players move those conditions themselves.</b></p>

        <h3>Two conditions</h3>
        <div class="hgrid">
          <div class="hcell">
            <div class="hct">Rank condition</div>
            <div><b>HIGH</b>: the higher number wins (starting state)<br>
                 <b>LOW</b>: the lower number wins</div>
            <div class="hsub">A <b>Flip</b> card <b>reverses whatever is currently set</b>.
              If it is already LOW, a second Flip puts it back to HIGH.</div>
          </div>
          <div class="hcell">
            <div class="hct">Trump condition</div>
            <div><b>None</b>: no trump suit (starting state)<br>
                 <b>{{s0}}Aqua {{s1}}Fire {{s2}}Earth {{s3}}Wind</b>: that suit outranks everything</div>
            <div class="hsub">A <b>Trump</b> card <b>replaces it with the named suit</b>.</div>
          </div>
        </div>
        <p>The two move <b>independently</b>. "Lower wins, but Fire still beats everything" is a real state.</p>

        <h3>Condition cards last 1T or LAST</h3>
        <ul>
          <li><b>1T</b> — active for that trick only. Afterwards the condition returns to its
              starting state (HIGH, no trump)</li>
          <li><b>LAST</b> — stays active until the next condition card of the same kind fires</li>
        </ul>
        <p class="hnb">※ When a condition card of the same kind fires, whatever was there before is
        discarded regardless of type. Only one card is ever active per condition.
        A LAST card is discarded by a 1T card too, and the condition returns to its starting state.</p>

        <h3>How a round runs</h3>
        <ol class="hflow">
          <li><b>Deal</b>　60 cards, 15 to each player</li>

   ═══════════════════════════════════════════════════════ */
function resolveTrick(cards, leadSuit, rankVal, trumpVal){
  const stronger = rankVal==='N' ? ((a,b)=>a>b) : ((a,b)=>a<b);
  let cand;
  if(trumpVal!==null && cards.some(e=>e.card.s===trumpVal))
       cand = cards.filter(e=>e.card.s===trumpVal);
  else cand = cards.filter(e=>e.card.s===leadSuit);
  let best = cand[0];
  for(const e of cand) if(stronger(e.card.r,best.card.r)) best=e;
  return best;
}
function legalMoves(hand, leadSuit){
  if(leadSuit===null) return hand.slice();
  const f = hand.filter(c=>c.s===leadSuit);
  return f.length ? f : hand.slice();
}
function applyTo(ax, c){
  ax.holder=c; ax.dur=c.dur;
  if(c.axis==='R') ax.value = (ax.value==='N')?'R':'N';
  else ax.value = c.suit;
}
function applyCond(c){ applyTo(c.axis==='R'?G.rank:G.trump, c); }
function cleanupTrick(){
  if(G.rank.dur==='TEMP'){G.rank.value='N';G.rank.holder=null;G.rank.dur=null;}
  if(G.trump.dur==='TEMP'){G.trump.value=null;G.trump.holder=null;G.trump.dur=null;}
}
// 布石保護（D-2 両軸）：そのトリックに同一軸の布石があれば出せない
function blockedAxis(ax, t){
  if(!G) return false;
  return G.track[t].some(x=>x.axis===ax);
}

/* ═══════════════════════════════════════════════════════
   評価ヘルパ
   ═══════════════════════════════════════════════════════ */
function unseenFor(p){
  const mine=new Set(G.hands[p].map(c=>c.s*100+c.r));
  const gone=new Set(G.played.map(c=>c.s*100+c.r));
  const out=[];
  for(let s=0;s<4;s++)for(let r=1;r<=NRANK;r++){
    const k=s*100+r; if(!mine.has(k)&&!gone.has(k)) out.push({s,r});
  }
  return out;
}
function handStrength(hand, uns, rankVal, trumpVal){
  if(!hand.length) return 0;
  const stronger = rankVal==='N'?((a,b)=>a>b):((a,b)=>a<b);
  let sum=0;
  for(const c of hand){
    const same=uns.filter(u=>u.s===c.s);
    let base=same.length?same.filter(u=>stronger(c.r,u.r)).length/same.length:1;
    if(trumpVal!==null) base = (c.s===trumpVal)? 0.55+0.45*base : base*0.55;
    sum+=base;
  }
  return sum/hand.length;
}
function takesNow(card, tc, leadSuit, rv, tv){
  return resolveTrick(tc.concat([{player:-1,card}]), leadSuit, rv, tv).player===-1;
}
function survive(card, tc, leadSuit, rv, tv, uns, remain){
  if(remain<=0) return 1;
  let th=0;
  for(const u of uns)
    if(resolveTrick(tc.concat([{player:-1,card},{player:-2,card:u}]),leadSuit,rv,tv).player===-2) th++;
  const q=uns.length?1-th/uns.length:1;
  return Math.pow(Math.max(0,q),remain);
}
const extremity=c=>Math.max(c.r,NRANK+1-c.r);
function keepValue(c,tv){ return extremity(c)+(tv!==null&&c.s===tv?6:0); }

/* ═══════════════════════════════════════════════════════
   AI：プレイ（宣言を狙う）
   ═══════════════════════════════════════════════════════ */
function aiPlay(p){
  const leadSuit=G.trickCards.length?G.trickCards[0].card.s:null;
  const legal=legalMoves(G.hands[p],leadSuit);
  if(legal.length===1) return legal[0];
  const uns=unseenFor(p);
  const remain=NPLAYER-1-G.trickCards.length;
  const rv=G.rank.value, tv=G.trump.value;
  const wantWin = G.bids[p]===null ? true : (G.tricksWon[p] < G.bids[p]);

  const sc=legal.map(c=>{
    const ls=leadSuit===null?c.s:leadSuit;
    const takes=takesNow(c,G.trickCards,ls,rv,tv);
    const pw=takes?survive(c,G.trickCards,ls,rv,tv,uns,remain):0;
    return {c,pw,keep:keepValue(c,tv)};
  });
  if(wantWin){
    const w=sc.filter(x=>x.pw>0.45);
    if(w.length){ w.sort((a,b)=>a.keep-b.keep||b.pw-a.pw); return w[0].c; }
    sc.sort((a,b)=>a.keep-b.keep); return sc[0].c;
  }else{
    sc.sort((a,b)=>a.pw-b.pw||b.keep-a.keep);
    return sc[0].c;
  }
}

/* ═══════════════════════════════════════════════════════
   AI：リアクティブ（宣言＋妨害）
   ═══════════════════════════════════════════════════════ */
function aiOffer(p){
  if(G.spent[p]>=MAXFIRE()) return null;
  const res=G.reserve[p].filter(c=>!blockedAxis(c.axis,G.trickNo));
  if(!res.length) return null;
  const uns=unseenFor(p);
  const remainT=16-G.trickNo;

  // 布石は必ず発動する前提の基準
  const proj={rank:{...G.rank},trump:{...G.trump}};
  for(const c of G.track[G.trickNo]) applyTo(c.axis==='R'?proj.rank:proj.trump,c);
  const base=handStrength(G.hands[p],uns,proj.rank.value,proj.trump.value);

  const myNeed = G.bids[p]===null ? 99 : G.bids[p]-G.tricksWon[p];
  const wantWin = myNeed>0;

  // 他家の切迫度
  const vuln=[0,0,0,0], nq=[0,0,0,0], onTrack=[0,0,0,0];
  for(let q=0;q<NPLAYER;q++){
    if(q===p||G.bids[q]===null) continue;
    nq[q]=G.bids[q]-G.tricksWon[q];
    if(nq[q]<0) vuln[q]=1;
    else{
      const sl=Math.min(nq[q],remainT-nq[q]);
      vuln[q]=1-Math.min(1,sl/Math.max(1,remainT/2));
    }
    onTrack[q]=G.tricksWon[q]-G.bids[q]*(G.trickNo-1)/NTRICK;
  }

  let best=null,bg=-1;
  for(const c of res){
    const p2={rank:{...proj.rank},trump:{...proj.trump}};
    applyTo(c.axis==='R'?p2.rank:p2.trump,c);
    let gain=handStrength(G.hands[p],uns,p2.rank.value,p2.trump.value)-base;
    if(!wantWin) gain=-gain;
    if(c.dur==='PERSIST') gain*=(1+Math.min(remainT,8)/12);

    // 妨害
    let sab=0;
    for(let q=0;q<NPLAYER;q++){
      if(q===p||G.bids[q]===null) continue;
      if(c.axis==='T'){
        if(G.voids && G.voids[q][c.suit]) sab += (nq[q]>0? 0.55 : -0.55);
        else if(nq[q]<=0) sab += 0.18;
      }else{
        sab += (onTrack[q]>=0 ? 0.32 : -0.12);
      }
      sab += vuln[q]*0.22;
    }
    gain += sab*0.045;

    const idx=orderFrom(G.lead).indexOf(p);
    gain*=(c.axis==='T'?[1,.9,.82,.74][idx]:[1,.95,.92,.88][idx]);
    if(gain>bg){bg=gain;best=c;}
  }
  const th=0.055*(remainT/15)+0.012;
  return bg>th?best:null;
}

/* ═══════════════════════════════════════════════════════
   AI：ドラフト・布石
   ═══════════════════════════════════════════════════════ */
function aiDraft(p){
  const hand=G.hands[p];
  const byS=[0,1,2,3].map(s=>hand.filter(c=>c.s===s));
  const lows=[0,1,2,3].reduce((a,s)=>a+Math.max(0,byS[s].filter(c=>c.r<=5).length-1),0);
  const vd=s=>[0,1,2,3].filter(y=>y!==s).reduce((a,y)=>a+Math.max(0,3-byS[y].length),0)/9;
  let best=null,bv=-1e9;
  for(const c of G.pool){
    let v=c.axis==='R'?lows*1.15+0.6:byS[c.suit].length*(0.6+vd(c.suit)*2.2);
    v*=(c.dur==='PERSIST')?1.9:1.0; v+=Math.random()*0.5;
    if(v>bv){bv=v;best=c;}
  }
  return best;
}
function condDelta(p,c){
  const uns=unseenFor(p);
  const cur=handStrength(G.hands[p],uns,G.rank.value,G.trump.value);
  let rv=G.rank.value,tv=G.trump.value;
  if(c.axis==='R') rv=(rv==='N')?'R':'N'; else tv=c.suit;
  return handStrength(G.hands[p],uns,rv,tv)-cur;
}
function aiPlace(p){
  const held=G.held[p];
  const sc=held.map(c=>({c,v:condDelta(p,c)*(c.dur==='PERSIST'?1.8:1)}));
  sc.sort((a,b)=>b.v-a.v);
  const pick=sc.length>1?sc[1].c:sc[0].c;
  const lo=pick.dur==='PERSIST'?5:9, hi=pick.dur==='PERSIST'?11:14;
  const cands=[];
  for(let t=lo;t<=hi;t++) if(!G.track[t].some(x=>x.axis===pick.axis)) cands.push(t);
  if(!cands.length) for(let t=1;t<=NTRICK;t++) if(!G.track[t].some(x=>x.axis===pick.axis)) cands.push(t);
  return {card:pick, slot:cands[Math.floor(Math.random()*cands.length)]};
}

/* ═══════════════════════════════════════════════════════
   AI：ビッド（軽量ロールアウト）
   ═══════════════════════════════════════════════════════ */
function fastPick(hand, tc, rv, tv, wantWin){
  const ls = tc.length ? tc[0].card.s : null;
  const opts = legalMoves(hand, ls);
  if(opts.length===1) return opts[0];
  const takers=[], others=[];
  for(const c of opts){
    const l = ls===null ? c.s : ls;
    (takesNow(c,tc,l,rv,tv) ? takers : others).push(c);
  }
  const byKeep=(a,b)=>keepValue(a,tv)-keepValue(b,tv);
  if(wantWin){
    if(takers.length){ takers.sort(byKeep); return takers[0]; }
    others.sort(byKeep); return others[0];
  }else{
    if(others.length){ others.sort((a,b)=>keepValue(b,tv)-keepValue(a,tv)); return others[0]; }
    takers.sort(byKeep); return takers[0];
  }
}
// me の手札は既知、残り45枚をランダム配分して1戦を走らせる
function rollout(me, myHand, bidsIn, samples){
  const mine=new Set(myHand.map(c=>c.s*100+c.r));
  const pool0=[];
  for(let s=0;s<4;s++)for(let r=1;r<=NRANK;r++){
    const k=s*100+r; if(!mine.has(k)) pool0.push({s,r});
  }
  const placed=[];
  for(let t=1;t<=NTRICK;t++) for(const c of G.track[t]) placed.push({t,c});
  const reserveAll=allP().map(q=>G.reserve[q].slice());
  const out=[];
  for(let it=0;it<samples;it++){
    const pool=shuffle(pool0.slice());
    const hands=[null,null,null,null]; hands[me]=myHand.slice();
    let i=0; for(let q=0;q<NPLAYER;q++) if(q!==me){ hands[q]=pool.slice(i,i+NTRICK); i+=NTRICK; }
    // リアクティブは各自1枚をランダムなトリックで発動すると仮定
    const fire={};
    for(let q=0;q<NPLAYER;q++){
      if(!reserveAll[q].length) continue;
      const c=reserveAll[q][Math.floor(Math.random()*reserveAll[q].length)];
      const t=1+Math.floor(Math.random()*15);
      (fire[t]=fire[t]||[]).push(c);
    }
    let rv='N', tv=null, rd=null, td=null, lead=G.lead;
    const won=[0,0,0,0];
    for(let t=1;t<=NTRICK;t++){
      // 条件適用（布石優先＝D-2、同軸のリアクティブは無効）
      const usedAx={};
      for(const {t:tt,c} of placed) if(tt===t){ usedAx[c.axis]=1;
        if(c.axis==='R'){ rv = rv==='N'?'R':'N'; rd=c.dur; } else { tv=c.suit; td=c.dur; } }
      for(const c of (fire[t]||[])){
        if(usedAx[c.axis]) continue; usedAx[c.axis]=1;
        if(c.axis==='R'){ rv = rv==='N'?'R':'N'; rd=c.dur; } else { tv=c.suit; td=c.dur; }
      }
      const tc=[];
      for(const q of orderFrom(lead)){
        const want = bidsIn[q]===null ? true : (won[q] < bidsIn[q]);
        const card = fastPick(hands[q], tc, rv, tv, want);
        hands[q]=hands[q].filter(c=>!(c.s===card.s&&c.r===card.r));
        tc.push({player:q,card});
      }
      const w=resolveTrick(tc,tc[0].card.s,rv,tv);
      won[w.player]++; lead=w.player;
      if(rd==='TEMP'){ rv='N'; rd=null; }
      if(td==='TEMP'){ tv=null; td=null; }
    }
    out.push(won[me]);
  }
  return out;
}
function takenBids(){
  return new Set(allP().filter(q=>G.bids[q]!==null).map(q=>G.bids[q]));
}
/* ══ 逃げ道の見極め（低い宣言の実現可能性）══
   ロールアウトは「降りる＝常に最弱を出せる」と仮定するため、
   低い宣言の成功率を過大評価する。実際にはフォロー義務があり、
   ・ヴォイドを作れるスートがあるか（高ランク札を無害に捨てられるか）
   ・長いスートに高ランク札を抱えていないか
   で「避けられない取得数」が決まる。手札からそれを見積もる。 */
function forcedFloor(hand){
  const avg = NRANK/4;
  let floor=0, shed=0;
  for(let sx=0;sx<4;sx++){
    const cs=hand.filter(c=>c.s===sx);
    const n=cs.length;
    if(n===0){ shed+=2.0; continue; }
    if(n<=2)  shed+=1.0;
    else if(n<=3) shed+=0.4;
    for(const c of cs){
      const above=NRANK-c.r;
      const myAbove=cs.filter(x=>x.r>c.r).length;
      const oppAbove=Math.max(0,above-myAbove);
      floor += Math.pow(Math.max(0,1-oppAbove/Math.max(1,NRANK*0.55)),2);
    }
    if(n>avg) floor += (n-avg)*0.35;
  }
  return Math.max(0, floor - shed*0.55);
}

function aiBid(p){
  const S=10;
  const taken=takenBids();
  const rough = rollout(p, G.hands[p], G.bids.slice(), 6);
  const mean = rough.reduce((a,b)=>a+b,0)/rough.length;
  const hi = Math.min(NTRICK, Math.round(mean)+6);
  const floor=forcedFloor(G.hands[p]);         // 避けられない取得数の見積り
  let bb=null, be=-1e9;
  for(let b=0;b<=hi;b++){
    if(taken.has(b)) continue;                 // 排他ビッド
    const trial=G.bids.slice(); trial[p]=b;
    const r=rollout(p, G.hands[p], trial, S);
    let ev=0; for(const w of r) ev+=scoreOf(b,w);
    ev/=r.length;
    // 逃げ道のない手札で低く宣言することを抑える
    if(b < floor){
      const gap=floor-b;
      ev *= Math.max(0.15, 1 - gap*0.22);
    }
    if(ev>be){ be=ev; bb=b; }
  }
  if(bb===null) for(let b=0;b<=NTRICK;b++) if(!taken.has(b)){ bb=b; break; }
  return bb;
}

  G.order=orderFrom(G.lead); G.turn=null;
  G.acts=allP().map(()=>'');
  for(const {p,card:c} of offerList) G.acts[p]=T().aOffer(condName(c));

  // 何も起きないトリックは素通り
  if(!placedHere.length && !offerList.length){
    G.offerShow=null; G.changeBanner=null; G.explain=null;
    render(); await sleep(100); return;
  }

  // 出したプレイヤーの位置に、まず 1 秒だけ表示
  for(const {p,card:c} of offerList){
    await seatToast(p, T().tOffer(condName(c)), 1000);
  }
  clearToasts();

  // ① 全員が出したカードを並べて見せる
  G.offerShow = [
    ...placedHere.map(c=>({who:T().tagPlanted.split('・')[0].split(' ·')[0], card:c, st:'placed', col:'var(--warn)'})),
    ...offerList.map(o=>({who:NAMES[o.p], card:o.card, st:'pending', col:PCOL[o.p]}))
  ];
  setPrompt(T().qResolve, T().hResolveShow);
  render();
  await think(offerList.length ? 1100 : 700);

  // ② 優先順位で解決し、勝敗を表示
  const claimed={};
  for(const c of placedHere){
    claimed[c.axis]=c;
    log(T().lPlantFire(condName(c)),'ev');
  }
  for(const {p,card:c} of offerList){
    const item = G.offerShow.find(x=>x.st==='pending' && x.card.id===c.id);
    if(blockedAxis(c.axis,G.trickNo)){ if(item) item.st='lose'; continue; }
    if(!(c.axis in claimed)){
      claimed[c.axis]=c;
      G.reserve[p]=G.reserve[p].filter(x=>x.id!==c.id);
      G.spent[p]=(G.spent[p]||0)+1;
      if(item) item.st='win';
      G.acts[p]=T().aFired(condName(c));
      log(T().lFire(NAMES[p], condName(c)),'ev');
    }else{
      if(item) item.st='lose';
      G.acts[p]=T().aLost(condName(c));
      log(T().lLost(NAMES[p], condName(c)));
    }
  }
  render();
  await think(offerList.length>1 ? 900 : 550);

  // ③ 適用し、状態の変化を明示
  const before = {r:G.rank.value, t:G.trump.value};
  G.track[G.trickNo]=[];
  for(const ax of ['R','T']) if(claimed[ax]) applyCond(claimed[ax]);
  const after = {r:G.rank.value, t:G.trump.value};

  const parts=[];
  if(before.r!==after.r)
    parts.push(`<span>${T().bnRank}</span><span class="arrow">${before.r==='N'?T().kanjiHigh:T().kanjiLow} →</span><span class="to" style="color:${after.r==='N'?'var(--brass)':'var(--verdigris)'}">${after.r==='N'?T().bnHigh:T().bnLow}</span>`);
  if(before.t!==after.t)
    parts.push(`<span>${T().bnTrump}</span><span class="arrow">${before.t===null?T().bnNone:SUIT_SYM[before.t]} →</span><span class="to" style="color:${after.t===null?'var(--dim)':`var(${SUIT_VAR[after.t]})`}">${after.t===null?T().bnNone:SUIT_SYM[after.t]}</span>`);

  if(parts.length){
    G.changeBanner = parts.join('　／　');
    tick(T().tkChange(parts.map(x=>x.replace(/<[^>]+>/g,'')).join(' ／ ')));
  }else if(claimed.R || claimed.T){
    G.changeBanner = T().bnSame;
    tick(T().tkNoChange);
  }

  // 状況説明を組み立てる
  const axName=T().axName;
  const lines=[];
  const usedAx=[...new Set(G.offerShow.map(o=>o.card.axis))];
  if(usedAx.length>=2){
    lines.push(T().explBoth);
  }
  for(const ax of ['R','T']){
    const inAx=G.offerShow.filter(o=>o.card.axis===ax);
    if(!inAx.length) continue;
    const placed=inAx.find(o=>o.st==='placed');
    const win=inAx.find(o=>o.st==='win');
    const lost=inAx.filter(o=>o.st==='lose');
    if(placed && lost.length){
      lines.push(T().explLocked(axName[ax], condName(placed.card)));
    }else if(placed){
      lines.push(T().explPlanted(axName[ax], condName(placed.card)));
    }else if(win && lost.length){
      const names=lost.map(o=>o.who).join('・');
      lines.push(T().explWinLose(axName[ax], win.who, condName(win.card), names));
    }else if(win){
      lines.push(T().explWin(axName[ax], win.who, condName(win.card)));
    }
  }
  if(!parts.length && (claimed.R||claimed.T)){
    lines.push(T().explNoChange);
  }
  G.explain = lines.join('<br>');

  // ④ プレイヤーが「閉じる」を押すまで表示を保持
  G.showClose = true;
  showPrompt(()=>setPrompt(T().qResolve, T().hResolveClose));
  render();
  await waitHuman(); PROMPT_REDRAW=null;

  G.showClose=false; G.offerShow=null; G.changeBanner=null; G.explain=null;
  render(); await sleep(100);
}

async function doPlay(){
  G.phase='play';
  G.trickCards=[];
  G.order=orderFrom(G.lead); G.acts=allP().map(()=>'');
  for(const p of G.order){
    G.turn=p; render();
    let card;
    if(p===HUMAN){
      const ls=G.trickCards.length?G.trickCards[0].card.s:null;
      const need=G.bids[HUMAN]-G.tricksWon[HUMAN];
      const stx = need>0 ? T().needMore(need) : need===0 ? T().needZero : T().needOver(-need);
      showPrompt(()=>setPrompt(T().qPlay,
        T().hPlayBid(G.bids[HUMAN], G.tricksWon[HUMAN], stx) +
        (ls===null ? T().hPlayLead : T().hPlayFollow(SUIT_SYM[ls]))));
      card=await waitHuman(); PROMPT_REDRAW=null;
    }else{ await think(400); card=aiPlay(p); }
    if(G.trickCards.length && card.s!==G.trickCards[0].card.s) G.voids[p][G.trickCards[0].card.s]=1;
    G.hands[p]=G.hands[p].filter(c=>!(c.s===card.s&&c.r===card.r));
    G.played.push(card);
    G.trickCards.push({player:p,card,fresh:true});
    G.acts[p]=T().aPlay(SUIT_SYM[card.s]+card.r);
    G.turn=null; render();
  }
}

async function doResolve(){
  const ls=G.trickCards[0].card.s;
  const w=resolveTrick(G.trickCards,ls,G.rank.value,G.trump.value);
  G.tricksWon[w.player]++;
  G.slotWinner[G.trickNo]=w.player;
  G.winnerThisTrick=w.player;
  G.lead=w.player;
  log(T().lWin(G.trickNo, NAMES[w.player], SUIT_SYM[w.card.s]+w.card.r), w.player===HUMAN?'hl':'');
  tick(T().tkWin(G.trickNo, NAMES[w.player]));
  render();
  const need = G.bids[w.player]-G.tricksWon[w.player];
  const st = need>0 ? T().needMore(need) : need===0 ? T().needZero : T().needOver(-need);
  G.acts[w.player]=T().aWin(SUIT_SYM[w.card.s]+w.card.r, st);
  render();
  await seatToast(w.player,
    T().tWin(SUIT_SYM[w.card.s]+w.card.r, st), 1400);
}

/* ═══════════════════════════════════════════════════════
   戦終了・マッチ終了
   ═══════════════════════════════════════════════════════ */
function endDeal(){
  G.phase='dealend';
  const gains=allP().map(p=>scoreOf(G.bids[p],G.tricksWon[p]));
  for(let p=0;p<NPLAYER;p++) M.total[p]+=gains[p];
  M.rows.push({deal:M.deal, bids:G.bids.slice(), won:G.tricksWon.slice(), gains});
  logT(T().lDealEnd(M.deal, allP().map(p=>`${NAMES[p]} ${G.bids[p]}→${G.tricksWon[p]} (+${gains[p]})`).join('　')));

  const last = M.deal>=NDEAL;
  document.getElementById('resultHost').innerHTML=`
    <div class="resultveil"><div class="result">
      <h2>${last?T().rMatchEnd:T().rDealEnd(M.deal)}</h2>
      <table style="width:100%;font-family:var(--mono);font-size:12.5px;border-collapse:collapse">
        <tr style="color:var(--dim)"><th style="text-align:left">　</th><th>${T().rBid}</th><th>${T().rWon}</th><th>${T().rDiff}</th><th>${T().rScore}</th><th>${T().rTotal}</th></tr>
        ${allP().map(p=>`<tr style="border-top:1px solid #33455A">
          <td style="text-align:left;padding:4px 0">${NAMES[p]}</td>
          <td style="text-align:center">${G.bids[p]}</td>
          <td style="text-align:center">${G.tricksWon[p]}</td>
          <td style="text-align:center;color:${G.bids[p]===G.tricksWon[p]?'#79C08D':'var(--muted)'}">${G.tricksWon[p]-G.bids[p]>=0?'+':''}${G.tricksWon[p]-G.bids[p]}</td>
          <td style="text-align:center;font-weight:700">${gains[p]}</td>
          <td style="text-align:center">${M.total[p]}</td></tr>`).join('')}
      </table>
      ${last?`<div style="margin-top:12px;font-family:var(--mincho);font-size:17px;letter-spacing:.1em">
        ${(()=>{const m=Math.max(...M.total);const w=allP().filter(p=>M.total[p]===m);
        return T().rWinner(w.length>1?w.map(p=>NAMES[p]).join('・')+T().rDraw:NAMES[w[0]]);})()}</div>`:''}
      <div style="margin-top:16px">
        <button class="btn primary" id="nextBtn">${last?T().btnNewMatch:T().btnNext}</button>
      </div>
    </div></div>`;
  document.getElementById('nextBtn').addEventListener('click',()=>{
    document.getElementById('resultHost').innerHTML='';
    if(last){ newMatch(); }
    else{ M.deal++; M.p1=nx(M.p1,1); startDeal(); }
  });
  setPrompt(last?T().qMatchEnd:T().qDealEnd,'');
  render();
}

function log(t,cls=''){G.log.push({t,cls});drawLog();}
function logT(t){G.log.push({t,cls:'tk'});drawLog();}
function drawLog(){
  const el=document.getElementById('log');
  el.innerHTML=G.log.map(e=>`<div class="${e.cls}">${e.t}</div>`).join('');
  el.scrollTop=el.scrollHeight;
}
function tick(t){document.getElementById('ticker').textContent=t;}
let PROMPT_REDRAW = null;
function showPrompt(fn){ PROMPT_REDRAW = fn; fn(); }
function setPrompt(q,h){
  document.getElementById('pq').textContent=q;
  document.getElementById('ph').textContent=h||'';
  document.getElementById('prow').innerHTML='';
}

function render(){
  if(!G) return;
  document.body.dataset.rank=G.rank.value;

  renderPayTable();

  // 戦表示
  const dt=document.getElementById('dealtag');
  if(dt) dt.innerHTML = `${T().dealLabel} <b>${M.deal} / ${NDEAL}</b>　P1 ${NAMES[G.p1]}`;

  renderRoster();

  // レンズ
  const rn=G.rank.value==='N', tv=G.trump.value;
  document.getElementById('lens').innerHTML=`
    <div class="kanji ${rn?'N':'Rv'}">${rn?T().kanjiHigh:T().kanjiLow}</div>
    <div class="sub">${rn?T().lensHigh:T().lensLow}${G.rank.holder?'・'+durLabel(G.rank.holder):''}</div>
    <div class="trump">${tv===null?`<span class="none">${T().noTrump}</span>`
      :`<span style="color:var(${SUIT_VAR[tv]})">${SUIT_SYM[tv]}</span><span class="sub"> ${durLabel(G.trump.holder)}</span>`}</div>
    <div class="sub">T ${['draft','place','bid'].includes(G.phase)?'–':G.trickNo} / 15</div>`;

  // ボード（布石行 ＋ プレイヤー4行）
  {
    const inPlay=!['draft','place','bid'].includes(G.phase);
    const rows=[];

    // ── 布石の行
    rows.push(`<div class="bl">${T().rowPlant}</div>`);
    for(let t=1;t<=NTRICK;t++){
      let cls='slot';
      if(inPlay){ if(t<G.trickNo) cls+=' past'; if(t===G.trickNo) cls+=' now'; }
      const chips=G.track[t].map(c=>{
        const col = c.axis==='R' ? 'var(--verdigris)' : `var(${SUIT_VAR[c.suit]})`;
        const isP = c.dur==='PERSIST';
        const st = isP
          ? `background:${col};color:#101720;border-color:${col};font-weight:700`
          : `background:rgba(0,0,0,.30);color:${col};border-color:${col}`;
        const pb = G.placedBy[c.id];
        const who = pb!==undefined ? `<span style="color:${isP?'#101720':PCOL[pb]}">${SHORT[pb]}</span>` : '';
        return `<div class="chipline" style="${st}">${condLabel(c)}<span class="du">${durLabel(c)}</span><span class="ow">${who}</span></div>`;
      }).join('');
      const lock = (G.track[t].length && inPlay)
        ? `<div class="shield">${LANG==='ja'?'護':'L'}</div>` : '';
      rows.push(`<div class="${cls}" data-slot="${t}"><div class="no">${t}</div>${chips}${lock}</div>`);
    }

    // ── プレイヤー4行（A=自分, B, C, D）
    for(let p=0;p<NPLAYER;p++){
      const b=G.bids[p], w=G.tricksWon[p];
      const tile = b===null
        ? `<span class="bidtile none">–</span>`
        : `<span class="bidtile ${w===b?'done':(w>b?'over':'')}">${b}</span>`;
      const isLead = inPlay && p===G.lead;
      rows.push(`<div class="bl plr" style="border-left-color:${PCOL[p]}${isLead?'':'66'}">
        <span class="who" style="color:${PCOL[p]}">${'ABCD'[p]}</span>${tile}</div>`);
      for(let t=1;t<=NTRICK;t++){
        let cls='tk';
        if(inPlay){ if(t<G.trickNo) cls+=' past'; if(t===G.trickNo) cls+=' now'; }
        const won = G.slotWinner[t]===p;
        rows.push(`<div class="${cls}">${won?`<div class="mk" style="background:${PCOL[p]}"></div>`:''}</div>`);
      }
    }
    const bd=document.getElementById('board');
    bd.style.setProperty('--ntrick', String(NTRICK));
    bd.innerHTML = rows.join('');
  }

  // 座席（3人戦では使わない席を空にする）
  {
    const used=new Set(allP().map(i=>POS[i]));
    for(const k of ['s','w','n','e']) if(!used.has(k)){
      const e=document.getElementById(SEAT_EL[k]);
      if(e){ e.innerHTML=''; e.className='seat seat-'+k+' empty'; }
    }
  }
  for(let p=0;p<NPLAYER;p++){
    const pos=POS[p], el=document.getElementById(SEAT_EL[pos]);
    const isLead=p===G.lead&&!['draft','place','bid'].includes(G.phase);
    el.className='seat seat-'+pos+(isLead?' lead':'');
    const conds=['draft','place'].includes(G.phase)?G.held[p]:G.reserve[p];
    const b=G.bids[p];
    const bidTag = b===null?'' :
      `<span class="bidbadge ${G.tricksWon[p]===b?'done':(G.tricksWon[p]>b?'over':'')}">${G.tricksWon[p]} / ${b}</span>`;
    const plate=`<div class="plate" style="border-color:${PCOL[p]}66">
        ${p===G.p1?'<span class="p1">P1</span>':''}
        <span class="ab" style="color:${PCOL[p]}">${'ABCD'[p]}</span>
        <span class="nm" style="color:${PCOL[p]}">${NAMES[p].replace(/^[A-D][：:]\s*/,'')}</span>
        ${bidTag}
        ${G.spent[p]?`<span class="spent">${T().used}</span>`:''}
      </div>
      <div class="leadmark">${T().tagLead}</div>
      <div class="minis">${conds.map(miniChip).join('')}</div>`;
    if(p===HUMAN){
      const ls=(G.phase==='play'&&G.trickCards.length)?G.trickCards[0].card.s:null;
      const myTurn=G.phase==='play'&&G.trickCards.length<4&&
                   orderFrom(G.lead)[G.trickCards.length]===HUMAN;
      const legal=myTurn?legalMoves(G.hands[HUMAN],ls):[];
      const legalSet=new Set(legal.map(c=>c.s*100+c.r));
      const sorted=G.hands[HUMAN].slice().sort((a,b)=>a.s-b.s||(G.rank.value==='N'?b.r-a.r:a.r-b.r));
      el.innerHTML=plate+`<div class="handrow">${sorted.map(c=>{
        const ok=myTurn&&legalSet.has(c.s*100+c.r);
        const tr=G.trump.value!==null&&c.s===G.trump.value;
        return `<div class="hcard ${ok?'playable':(myTurn?'illegal':'')}" data-card="${c.s}-${c.r}">${cardSVG(c,52,tr?'tr':'')}</div>`;
      }).join('')}</div>`;
    }else{
      el.innerHTML=plate+`<div class="backs">${Array.from({length:G.hands[p].length},()=>backSVG(23)).join('')}</div>`;
    }
  }

  // リアクティブ解決の可視化
  const center=document.getElementById('center');
  document.querySelectorAll('.offerstrip,.changebanner').forEach(e=>e.remove());
  document.body.dataset.resolve = (G.offerShow && G.offerShow.length) ? '1' : '0';
  if(G.offerShow && G.offerShow.length){
    const st=document.createElement('div');
    st.className='offerstrip';
    st.innerHTML=`<div class="srow"><div class="hdr">${T().resolveHdr}</div>`+G.offerShow.map(o=>{
      const c=o.card;
      const col = c.axis==='R' ? 'var(--verdigris)' : `var(${SUIT_VAR[c.suit]})`;
      const isP = c.dur==='PERSIST';
      const bs = isP
        ? `background:${col};color:#101720;border-color:${col};font-weight:700`
        : `background:rgba(0,0,0,.35);color:${col};border-color:${col}`;
      const tag = o.st==='placed' ? T().tagPlanted
                : o.st==='win'    ? T().tagFired
                : o.st==='lose'   ? T().tagReturned : T().tagOffered;
      return `<div class="offitem ${o.st}">
        <div class="who" style="color:${o.col||'var(--ink)'}">${o.who}</div>
        <div class="body" style="${bs}">${condLabel(c)}・${durLabel(c)}</div>
        <div class="tag">${tag}</div>
      </div>`;
    }).join('') + (G.showClose
      ? `<div class="closewrap"><button class="btn" id="offerCloseBtn">${T().close}</button>
         <span class="hint">Enter</span></div>` : '')
      + `</div>`
      + (G.changeBanner ? `<div class="changebanner">${G.changeBanner}</div>` : '')
      + (G.explain ? `<div class="expl">${G.explain}</div>` : '');
    document.getElementById('table').appendChild(st);
  }

  // 出札
  center.querySelectorAll('.played').forEach(e=>e.remove());
  for(const e of G.trickCards){
    const pos=POS[e.player];
    const isW=G.winnerThisTrick===e.player&&G.trickCards.length===4;
    const tr=G.trump.value!==null&&e.card.s===G.trump.value;
    const div=document.createElement('div');
    div.className=`played pos-${pos} ${isW?'winner':''} ${e.fresh?'enter-'+pos:''}`;
    div.innerHTML=`<div class="who" style="color:${PCOL[e.player]}">${NAMES[e.player]}</div>${cardSVG(e.card,50,(isW?'win ':'')+(tr?'tr':''))}`;
    center.appendChild(div);
    if(e.fresh){ e.fresh=false;
      requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.remove('enter-'+pos))); }
  }
}

/* 座席位置に吹き出しを出す。ms 経過後に自動で消える */
/* フェイズ案内。orders は [{label, seq:[playerIndex,...]}, ...] */
let SKIP_PHASE = false;
function phaseDialog(title, msg, sub, orders){
  if(SKIP_PHASE) return Promise.resolve();
  return new Promise(res=>{
    const dlg=document.getElementById('phasedlg');
    if(!dlg){ res(); return; }
    document.getElementById('phTitle').innerHTML=title;
    document.getElementById('phMsg').innerHTML=msg;
    document.getElementById('phSub').innerHTML=sub||'';
    const oe=document.getElementById('phOrder');
    oe.innerHTML=(orders||[]).map(o=>
      (o.label?`<div class="ph-round">${o.label}</div>`:'')+
      `<div class="ph-order">`+
      o.seq.map((p,i)=>
        `${i?'<span class="arw">→</span>':''}`+
        `<span class="pchip" style="color:${PCOL[p]};border-color:${PCOL[p]}">${NAMES[p]}</span>`
      ).join('')+`</div>`
    ).join('');
    const btn=document.getElementById('phBtn');
    btn.textContent=T().phOk;
    const cb=document.getElementById('phSkip');
    document.getElementById('phSkipLbl').textContent=T().phSkip;
    cb.checked=false;
    dlg.style.display='flex';
    const g=GEN;
    const close=()=>{
      if(cb.checked) SKIP_PHASE=true;
      dlg.style.display='none';
      btn.removeEventListener('click',close);
      document.removeEventListener('keydown',key);
      if(g===GEN) res();
    };
    const key=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); close(); } };
    btn.addEventListener('click',close);
    document.addEventListener('keydown',key);
  });
}

function seatToast(p, action, ms=2000){
  const g=GEN;
  if(p===HUMAN) return Promise.resolve();     // 自分の行動は自明なので出さない
  ms = ms*2;                                   // 表示時間は一律 2 倍
  return new Promise(res=>{
    const tbl=document.getElementById('table');
    if(!tbl){ res(); return; }
    tbl.querySelectorAll(`.seattoast.at-${POS[p]}`).forEach(e=>e.remove());
    const d=document.createElement('div');
    d.className=`seattoast at-${POS[p]}`;
    d.style.borderColor=PCOL[p];
    d.innerHTML=`<span class="who" style="color:${PCOL[p]}">${NAMES[p]}</span>
                 <span class="act">${action}</span>`;
    tbl.appendChild(d);
    requestAnimationFrame(()=>d.classList.add('on'));
    setTimeout(()=>{
      d.classList.remove('on');
      setTimeout(()=>{ d.remove(); if(g===GEN) res(); }, 190);
    }, ms);
  }).then(()=> g===GEN ? undefined : NEVER);
}
function clearToasts(){
  document.querySelectorAll('.seattoast').forEach(e=>e.remove());
}
const condName = c => `${condLabel(c)}・${durLabel(c)}`;


function renderRoster(){
  const el=document.getElementById('roster');
  if(!el) return;
  const ph=G.phase;
  const ord = (G.order && G.order.length) ? G.order
            : (['draft','place'].includes(ph) ? orderFrom(G.p1)
            :  ph==='bid' ? orderFrom(G.p1).slice().reverse()
            :  orderFrom(G.lead));
  const rows = ord.map((p,i)=>{
    const isTurn = G.turn===p;
    const done = G.turn!==null && ord.indexOf(p) < ord.indexOf(G.turn);
    const b=G.bids[p], w=G.tricksWon[p];
    const tags=[];
    if(p===G.p1) tags.push(`<span class="tg p1">${T().tagP1}</span>`);
    if(!['draft','place','bid'].includes(ph) && p===G.lead) tags.push(`<span class="tg lead">${T().tagLead}</span>`);
    if(isTurn) tags.push(`<span class="tg turn">${T().tagTurn}</span>`);
    const bidTag = b===null ? ''
      : `<span class="bid ${w===b?'done':(w>b?'over':'')}">${w} / ${b}</span>`;
    const conds = ['draft','place'].includes(ph) ? G.held[p] : G.reserve[p];
    const act = G.acts[p] || (isTurn ? `<span class="wait">${T().thinking}</span>` : '');
    return `<div class="rrow ${isTurn?'now':''} ${done?'done':''}" style="border-left-color:${PCOL[p]}">
      <div class="nm" style="color:${PCOL[p]}">${i+1}. ${NAMES[p]}
        <span class="tags">${tags.join('')}</span></div>
      <div class="sc">${M.total[p]}${bidTag?'　'+bidTag:''}</div>
      <div class="conds">${conds.map(miniChip).join('')}${G.spent[p]?`<span class="mini" style="border-color:#5F6B78;color:#5F6B78">${T().used}</span>`:''}</div>
      ${act?`<div class="act">${act}</div>`:''}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="rhead">${T().phase[ph]||''}</div>` + rows;
}

function renderPayTable(){
  const el=document.getElementById('paytable');
  if(!el) return;
  const taken = G.bids ? new Set(allP().filter(q=>G.bids[q]!==null).map(q=>G.bids[q])) : new Set();
  const mine  = G.bids ? G.bids[HUMAN] : null;
  const cols=[];
  const CAP = (NPLAYER===3) ? 12 : 9;                 // 一律扱いを始める宣言値
  for(let b=0;b<=CAP;b++){
    const t = (NPLAYER===3) ? SCORE_3[b] : SCORE_T[b];
    const lbl = b===CAP ? (CAP+'+') : String(b);
    const cls = (mine!==null&&(b===mine||(b===CAP&&mine>=CAP))) ? 'mine'
              : (taken.has(b) ? 'taken' : '');
    const owner = G.bids ? allP().filter(q=>G.bids[q]===b || (b===CAP&&G.bids[q]>=CAP)) : [];
    const who = owner.map(q=>`<span style="color:${PCOL[q]}">${SHORT[q]}</span>`).join(' ');
    cols.push(`<div class="ptcol ${cls}">
      <div class="b">${lbl}</div>
      <div class="v hit">${t[0]}</div>
      <div class="v n1">${t[1]}</div>
      <div class="v n2">${t[2]}</div>
      <div class="who">${who}</div>
    </div>`);
  }
  el.innerHTML =
    `<div class="ttl">${T().ptTitle}<b>${T().ptSub}</b></div>
     <div class="ptlabels">
       <div style="visibility:hidden">-</div>
       <div class="l-hit">${T().ptExact}</div><div class="l-n1">${T().ptOff1}</div><div class="l-n2">${T().ptOff2}</div>
       <div>${T().ptOwner}</div>
     </div>
     <div class="ptgrid">${cols.join('')}</div>`;
}

function renderPlacePick(chosen){

function renderReactivePop(){
  document.querySelectorAll('.reactpop').forEach(e=>e.remove());
  const bl=new Set(G.reserve[HUMAN].filter(c=>blockedAxis(c.axis,G.trickNo)).map(c=>c.id));
  const blNames=['R','T'].filter(a=>blockedAxis(a,G.trickNo)).map(a=>T().axName[a]);
  const order=orderFrom(G.lead).map(p=>p===HUMAN?`<b>${NAMES[p]}</b>`:NAMES[p]).join(' &gt; ');
  const need=G.bids[HUMAN]-G.tricksWon[HUMAN];
  const st = need>0 ? T().needMore(need) : need===0 ? T().needZero : T().needOver(-need);
  const d=document.createElement('div');
  d.className='reactpop';
  d.innerHTML=`
    <div class="rtext">
      <div class="rq">${T().popQ}</div>
      <div class="rh">${T().popState(G.bids[HUMAN], G.tricksWon[HUMAN], st)}</div>
      <div class="rh">${T().popOrder(order)}</div>
      ${blNames.length?`<div class="rh" style="color:var(--warn)">${T().popLocked(blNames.join('・'))}</div>`:''}
    </div>
    <div class="rrow">
      ${G.reserve[HUMAN].map(c=>condSVG(c,54,'',bl.has(c.id)?'blocked':'sel')).join('')}
      <button class="btn" id="passBtn">${T().pass}</button>
    </div>`;
  document.getElementById('table').appendChild(d);
}

function renderBidPick(done, sum){
  const taken=takenBids();
  const note = done.length
    ? T().bidTaken(done.map(q=>NAMES[q]+' '+G.bids[q]).join('　'), sum)
    : T().bidFirst;
  const sc=b=>(NPLAYER===3 ? (b>=12?SCORE_3[12]:SCORE_3[b]) : (b>=10?[10,7,2]:SCORE_T[b]));
  document.getElementById('prow').innerHTML=
    `<div style="width:100%"><div class="bidnote">${note}</div>
     <div class="bidbtns">${Array.from({length:16},(_,i)=>{
       const t=sc(i);
       return taken.has(i)
         ? `<button class="bidbtn taken" disabled>${i}</button>`
         : `<button class="bidbtn" data-bid="${i}"><b>${i}</b><span class="pt">${t[0]}/${t[1]}/${t[2]}</span></button>`;
     }).join('')}</div></div>`;
}

/* ═══════════════════════════════════════════════════════
   入力
